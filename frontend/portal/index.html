<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar sesión · Portal de facturación</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="/js/portal/portal.js?v=20261013a"></script>
  <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <!-- Mismo diseño que el login del CRM (login.html) -->
  <link rel="stylesheet" href="/css/paginas/login.css">
</head>
<body>
  <div class="page">

    <section class="stage">
      <img class="stage-logo" src="/images/logo-mark.webp" alt="Connecting">
    </section>

    <section class="form-side">
      <div class="form-inner">
        <div class="main-panel active">
          <div class="form-crest"><i class="fas fa-file-invoice-dollar"></i></div>
          <h2 class="panel-title">Portal de facturación</h2>
          <p class="panel-sub">Facturación y recibos de Google Ads. Ingresa tus credenciales para continuar.</p>

          <div id="alerta" class="alert alert-danger" role="alert" aria-live="polite">
            <i class="fas fa-circle-exclamation"></i>
            <span id="alerta-texto"></span>
          </div>

          <form id="form" novalidate autocomplete="on">
            <div class="field">
              <label class="field-label" for="username">Usuario</label>
              <div class="input-wrap">
                <input class="ctrl" type="text" id="username" name="username" placeholder="Tu nombre de usuario"
                  autocomplete="username" autocapitalize="none" spellcheck="false" required>
                <i class="fas fa-user fi"></i>
              </div>
            </div>
            <div class="field">
              <label class="field-label" for="password">Contraseña</label>
              <div class="input-wrap pw-wrap">
                <input class="ctrl" type="password" id="password" name="password" placeholder="Ingresa tu contraseña"
                  autocomplete="current-password" required>
                <i class="fas fa-lock fi"></i>
                <button type="button" class="pw-toggle" id="pw-ver" aria-label="Mostrar u ocultar contraseña">
                  <i class="fas fa-eye-slash" id="pw-icono"></i>
                </button>
              </div>
            </div>
            <button type="submit" class="btn-submit" id="entrar">
              <i class="fas fa-circle-arrow-right btn-ico"></i>
              <div class="spinner"></div>
              <span class="btn-text">Iniciar sesión</span>
            </button>
          </form>
        </div>
      </div>
    </section>
  </div>

<script>
/* Login del portal (POST /api/portal/login). Con sesión abierta, directo al inicio. */
(function () {
  'use strict';
  var INICIO = '/portal/inicio.html';
  var $ = function (id) { return document.getElementById(id); };

  fetch('/api/portal/me', { credentials: 'include' }).then(function (r) { if (r.ok) location.replace(INICIO); });

  function error(msg) {
    $('alerta-texto').textContent = msg;
    $('alerta').classList.add('show');
  }

  $('pw-ver').addEventListener('click', function () {
    var p = $('password'), ver = p.type === 'password';
    p.type = ver ? 'text' : 'password';
    $('pw-icono').className = 'fas ' + (ver ? 'fa-eye' : 'fa-eye-slash');
  });

  $('form').addEventListener('submit', async function (e) {
    e.preventDefault();
    var u = $('username').value.trim(), p = $('password').value;
    $('alerta').classList.remove('show');
    if (!u || !p) { error('Escribe tu usuario y tu contraseña.'); return; }
    var b = $('entrar');
    b.disabled = true;
    b.classList.add('loading');
    try {
      var r = await fetch('/api/portal/login', {
        method: 'POST', credentials: 'include', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ username: u, password: p }),
      });
      if (r.ok) { location.replace(INICIO); return; }
      var d = await r.json().catch(function () { return {}; });
      error(r.status === 429 ? (typeof d.detail === 'string' ? d.detail : 'Demasiados intentos. Espera un minuto.')
        : 'Usuario o contraseña incorrectos.');
    } catch (_) {
      error('No se pudo conectar. Revisa tu conexión e inténtalo de nuevo.');
    }
    b.disabled = false;
    b.classList.remove('loading');
  });
})();
</script>
</body>
</html>
