<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Llamadas y Ventas - Team Líneas</title>
    <link rel="stylesheet" href="/../css/base/theme.css?v=20251124f">
    <script src="/../js/core/fetch-interceptor.js" defer></script>
    <link rel="stylesheet" href="/css/lineas/llamadas-ventas.css?v=20260828">
    <link rel="stylesheet" href="/css/componentes/glass-cards-cream.css?v=20260716a">
  <link rel="stylesheet" href="/css/componentes/sidebar-static.css?v=2">
</head>
<body>
  <script src="/js/core/theme-init.js" defer></script>
  <script src="/js/layout/sidebar.js" defer></script>
  <script src="/js/layout/sidebar-ui.js" defer></script>
  <script src="/js/componentes/llamadas-bloqueo.js" defer></script>
  <script src="/js/layout/sidebar-user.js" defer></script>
<nav class="sidebar" id="app-sidebar"></nav>
    <div class="layout">
        <div class="main-content">
            <header>
                <div class="logo">📞 Llamadas y Ventas Líneas</div>
            </header>

            <!-- Navegación de Fecha -->
            <div class="date-nav">
                <button onclick="prevDay()">◀ Anterior</button>
                <div class="current-date" id="currentDateDisplay">--</div>
                <button onclick="nextDay()">Siguiente ▶</button>
            </div>

            <!-- KPIs -->
            <div class="kpi-grid">
                <div class="kpi-card">
                    <div class="kpi-label">Calis</div>
                    <div class="kpi-value" id="total-calis">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Ventas</div>
                    <div class="kpi-value" id="total-ventas">0</div>
                </div>
                <div class="kpi-card">
                    <div class="kpi-label">Total Global</div>
                    <div class="kpi-value" id="total-global">0</div>
                </div>
            </div>

            <div class="section-title">
                <span>Equipos de Trabajo - Team Líneas</span>
                <button class="btn-save" onclick="guardarDatos()">💾 GUARDAR</button>
            </div>

            <div class="teams-grid" id="teamsContainer"></div>
        </div>
    </div>

    <script>
        // Escapa HTML para interpolar datos del servidor en innerHTML sin riesgo de XSS.
        const escH = s => String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;');
        const MONTH_NAMES = ['Enero', 'Febrero', 'Marzo', 'Abril', 'Mayo', 'Junio', 'Julio', 'Agosto', 'Septiembre', 'Octubre', 'Noviembre', 'Diciembre'];
        
        // Teams de Líneas — se cargan dinámicamente desde la página de permisos
        // (/api/lineas/teams). Sin nombres hardcodeados.
        let teams = [];

        let currentDate = new Date();
        let agentesData = {};

        // Cargar agentes desde la API
        async function loadAgentes() {
            try {
                // Teams desde permisos (tabla users) — fuente única, sin hardcode
                const tr = await fetch('/api/lineas/teams', { credentials: 'include' });
                const td = tr.ok ? await tr.json() : null;
                teams = ((td && td.teams) || []).map(t => ({
                    name: String(t.token || '').toLowerCase(),
                    title: (t.label || ('Team ' + (t.token || ''))).toUpperCase(),
                    token: String(t.token || '').toUpperCase(),
                    agents: []
                }));

                const res = await fetch('/api/comisiones/agentes-lineas', { credentials: 'include' });
                const data = await res.json();
                if ((data.success || data.ok) && Array.isArray(data.data)) {
                    // Asignar cada agente a su team ACTUAL (team_token que da el backend)
                    teams.forEach(team => {
                        team.agents = data.data
                            .filter(a => String(a.team_token || '').toUpperCase() === team.token)
                            .map(a => a.nombre || a.name);
                    });
                }
            } catch (e) {
                console.error('Error cargando agentes:', e);
            }
        }

        function formatDate(date) {
            const day = date.getDate();
            const month = date.getMonth() + 1;
            const year = date.getFullYear();
            return `${day}/${month}/${year}`;
        }

        function getDateKey(date) {
            return `${date.getFullYear()}-${String(date.getMonth() + 1).padStart(2, '0')}-${String(date.getDate()).padStart(2, '0')}`;
        }

        function updateDateDisplay() {
            const day = currentDate.getDate();
            const month = currentDate.getMonth();
            const year = currentDate.getFullYear();
            document.getElementById('currentDateDisplay').textContent = `${day} de ${MONTH_NAMES[month]} ${year}`;
        }

        function prevDay() {
            currentDate.setDate(currentDate.getDate() - 1);
            updateDateDisplay();
            loadDayData();
        }

        function nextDay() {
            currentDate.setDate(currentDate.getDate() + 1);
            updateDateDisplay();
            loadDayData();
        }

        function renderTeams() {
            const container = document.getElementById('teamsContainer');
            let html = '';

            teams.forEach(team => {
                let agentsHtml = team.agents.map((agent, idx) => `
                    <tr>
                        <td>${escH(agent)}</td>
                        <td><input type="number" class="stat-input" id="${team.name}-ca-${idx}" value="0" min="0" onchange="calcularTotales()"></td>
                        <td><input type="number" class="stat-input" id="${team.name}-v-${idx}" value="0" min="0" onchange="calcularTotales()"></td>
                    </tr>
                `).join('');

                html += `
                    <div class="team-card">
                        <div class="team-header">
                            <h3>${team.title}</h3>
                        </div>
                        <div class="team-table-wrap">
                            <table class="team-table">
                                <thead>
                                    <tr>
                                        <th>Agente</th>
                                        <th>Calis</th>
                                        <th>Ventas</th>
                                    </tr>
                                </thead>
                                <tbody>
                                    ${agentsHtml}
                                </tbody>
                            </table>
                        </div>
                        <div class="team-footer">
                            <span>TOTAL</span>
                            <span><span id="total-${team.name}-ca">0</span> / <span id="total-${team.name}-v">0</span></span>
                        </div>
                    </div>
                `;
            });

            container.innerHTML = html;
        }

        function calcularTotales() {
            let totalCalis = 0, totalVentas = 0;

            teams.forEach(team => {
                let teamCalis = 0, teamVentas = 0;

                team.agents.forEach((agent, idx) => {
                    const caInput = document.getElementById(`${team.name}-ca-${idx}`);
                    const vInput = document.getElementById(`${team.name}-v-${idx}`);
                    
                    if (caInput) teamCalis += parseInt(caInput.value) || 0;
                    if (vInput) teamVentas += parseInt(vInput.value) || 0;
                });

                document.getElementById(`total-${team.name}-ca`).textContent = teamCalis;
                document.getElementById(`total-${team.name}-v`).textContent = teamVentas;

                totalCalis += teamCalis;
                totalVentas += teamVentas;
            });

            document.getElementById('total-calis').textContent = totalCalis;
            document.getElementById('total-ventas').textContent = totalVentas;
            document.getElementById('total-global').textContent = totalCalis + totalVentas;
        }

        async function guardarDatos() {
            const dateKey = getDateKey(currentDate);
            const datos = { fecha: dateKey, equipos: {} };

            teams.forEach(team => {
                datos.equipos[team.name] = {};
                team.agents.forEach((agent, idx) => {
                    const caInput = document.getElementById(`${team.name}-ca-${idx}`);
                    const vInput = document.getElementById(`${team.name}-v-${idx}`);
                    
                    datos.equipos[team.name][agent] = {
                        calis: parseInt(caInput?.value) || 0,
                        ventas: parseInt(vInput?.value) || 0
                    };
                });
            });

            try {
                const headers = { 'Content-Type': 'application/json' };

                const res = await fetch('/api/llamadas-ventas-lineas', {
                    method: 'POST',
                    headers,
                    credentials: 'include',
                    body: JSON.stringify(datos)
                });

                if (res.ok) {
                    alert('✅ Datos guardados correctamente');
                } else {
                    alert('❌ Error al guardar los datos');
                }
            } catch (e) {
                console.error('Error guardando:', e);
                alert('❌ Error al guardar los datos');
            }
        }

        async function loadDayData() {
            const dateKey = getDateKey(currentDate);
            
            try {
                const headers = {};

                const res = await fetch(`/api/llamadas-ventas-lineas/${dateKey}`, { headers, credentials: 'include' });
                const data = await res.json();

                // Limpiar inputs
                teams.forEach(team => {
                    team.agents.forEach((agent, idx) => {
                        const caInput = document.getElementById(`${team.name}-ca-${idx}`);
                        const vInput = document.getElementById(`${team.name}-v-${idx}`);
                        if (caInput) caInput.value = 0;
                        if (vInput) vInput.value = 0;
                    });
                });

                // Cargar datos si existen
                if ((data.ok || data.success) && data.data && data.data.equipos) {
                    teams.forEach(team => {
                        const teamData = data.data.equipos[team.name];
                        if (teamData) {
                            team.agents.forEach((agent, idx) => {
                                const agentData = teamData[agent];
                                if (agentData) {
                                    const caInput = document.getElementById(`${team.name}-ca-${idx}`);
                                    const vInput = document.getElementById(`${team.name}-v-${idx}`);
                                    if (caInput) caInput.value = agentData.calis || 0;
                                    if (vInput) vInput.value = agentData.ventas || 0;
                                }
                            });
                        }
                    });
                }

                calcularTotales();
            } catch (e) {
                console.error('Error cargando datos:', e);
                calcularTotales();
            }
        }

        async function init() {
            await loadAgentes();
            renderTeams();
            updateDateDisplay();
            loadDayData();
        }

        window.addEventListener('DOMContentLoaded', init);
    </script>
</body>
</html>
