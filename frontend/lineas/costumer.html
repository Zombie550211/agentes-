  <script>
    (function guard(){
      try{
        const user = JSON.parse(localStorage.getItem('user')||sessionStorage.getItem('user')||'{}');
        const role = String(user.role||'').toLowerCase();
        const team = String(user.team||'').toLowerCase();
        const uname = String(user.username || user.name || user.email || '').toLowerCase();
        // Permitir: Team Líneas, Supervisor Team Líneas, Administrador, Back Office, Rol_icon
        const isTeamLineas = role==='teamlineas' || role==='lineas-agentes' || role==='supervisor team lineas' || (role==='supervisor' && team.includes('lineas')) || team.includes('lineas') || uname.startsWith('lineas-');
        const isAdmin = role === 'admin' || role === 'administrador';
        const isBackoffice = role === 'backoffice' || role === 'back office' || role === 'back_office' || role === 'bo' || role === 'b.o' || role === 'b:o' || role === 'b-o';
        const isRolIcon = role === 'rol_icon' || role === 'rol-icon' || role === 'rolicon';
        const ok = isTeamLineas || isAdmin || isBackoffice || isRolIcon;
        if(!ok){ window.location.replace('/login.html'); }
      }catch(e){ window.location.replace('/login.html'); }
    })();

    // Escapa HTML para prevenir XSS al interpolar datos del servidor en innerHTML.
    // Válido tanto para contenido entre tags como para atributos con comillas dobles.
    window.escH = function (s) {
      return String(s == null ? '' : s)
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    };
  </script>

  <script>
    // Resuelve imagen_url sin importar si viene de Cloudinary (https://...) o local (/uploads/...)
    // Devuelve '' ante cualquier URL con caracteres que puedan escaparse de un
    // atributo HTML o de un literal JS. El resultado se interpola en src="…" y en
    // onclick="…('…')", así que sin este filtro una imagen_url guardada por un agente
    // ejecuta código en el navegador de quien abra la ficha (XSS almacenado).
    // El backend valida lo mismo en validators.validar_imagen_url — esto es la 2ª capa.
    function _resolveImgUrl(u) {
      if (!u) return '';
      u = String(u);
      if (/["'<>`\\\r\n\t]/.test(u) || u.indexOf('..') !== -1) return '';
      if (u.startsWith('http://') || u.startsWith('https://')) return u;
      if (/^[a-zA-Z][a-zA-Z0-9+.-]*:/.test(u)) return '';  // javascript:, data:, …
      return u.startsWith('/') ? u : '/' + u;
    }

      // Función global para mostrar notificaciones con diseño mejorado

          border-left: 4px solid ${currentColor.border};

          font-size: 14px;
          font-weight: 500;
          display: flex;
          align-items: center;
          gap: 12px;
          min-width: 300px;
          max-width: 500px;
          animation: slideInBounce 0.5s cubic-bezier(0.68, -0.55, 0.265, 1.55);
          backdrop-filter: blur(10px);
        `;
        
        const icons = {
          success: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"></path><polyline points="22 4 12 14.01 9 11.01"></polyline></svg>',
          error: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="15" y1="9" x2="9" y2="15"></line><line x1="9" y1="9" x2="15" y2="15"></line></svg>',
          warning: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path><line x1="12" y1="9" x2="12" y2="13"></line><line x1="12" y1="17" x2="12.01" y2="17"></line></svg>',
          info: '<svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="10"></circle><line x1="12" y1="16" x2="12" y2="12"></line><line x1="12" y1="8" x2="12.01" y2="8"></line></svg>'
        };
        
        const icon = icons[type] || icons.success;
        
        notification.innerHTML = `
          <div style="flex-shrink: 0;">${icon}</div>
          <div style="flex: 1; line-height: 1.5;">${message}</div>

        // Agregar animaciones CSS si no existen
        if (!document.querySelector('#notification-styles')) {
          const style = document.createElement('style');
          style.id = 'notification-styles';
          style.textContent = `
            @keyframes slideInBounce {
              0% {
                transform: translateX(120%) scale(0.9);
                opacity: 0;
              }
              60% {
                transform: translateX(-10px) scale(1.02);
                opacity: 1;
              }
              100% {
                transform: translateX(0) scale(1);
                opacity: 1;
              }
            }
            @keyframes slideOutFade {
              0% {
                transform: translateX(0) scale(1);
                opacity: 1;
              }
              100% {
                transform: translateX(120%) scale(0.9);
                opacity: 0;
              }
            }
            .notification-close:hover {
              opacity: 1 !important;
              transform: rotate(90deg);
              transition: all 0.3s ease;
            }
            @keyframes fadeIn {
              from {
                opacity: 0;
              }
              to {
                opacity: 1;
              }
            }

                transform: scale(0.9);

              }

        document.body.appendChild(notification);

        // Auto-remover después de 4 segundos

      // Función para mostrar confirmación personalizada
      function showConfirm(title, message) {
        return new Promise((resolve) => {
          const overlay = document.createElement('div');
          overlay.style.cssText = `
            position: fixed;
            top: 0;
            left: 0;
            right: 0;
            bottom: 0;
            background: rgba(0, 0, 0, 0.5);
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 10002;
            animation: fadeIn 0.2s ease-out;
            backdrop-filter: blur(4px);
          `;
          
          const modal = document.createElement('div');
          modal.style.cssText = `
            background: white;
            border-radius: 16px;
            padding: 0;
            max-width: 400px;
            width: 90%;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            animation: scaleIn 0.3s cubic-bezier(0.68, -0.55, 0.265, 1.55);
            overflow: hidden;
          `;
          
          modal.innerHTML = `
            <div style="padding: 24px 24px 20px; border-bottom: 1px solid #e5e7eb;">
              <div style="display: flex; align-items: center; gap: 12px;">
                <div style="width: 48px; height: 48px; border-radius: 12px; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); display: flex; align-items: center; justify-content: center; flex-shrink: 0;">
                  <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"></path>

                    <line x1="12" y1="17" x2="12.01" y2="17"></line>
                  </svg>
                </div>
                <h3 style="margin: 0; color: #0f172a; font-size: 18px; font-weight: 700;">${title}</h3>
              </div>
            </div>
            <div style="padding: 20px 24px;">
              <p style="margin: 0; color: #64748b; font-size: 14px; line-height: 1.6;">${message}</p>
            </div>
            <div style="display: flex; gap: 12px; padding: 20px 24px; background: #f8f9fa; border-top: 1px solid #e5e7eb;">
              <button class="confirm-cancel" style="flex: 1; background: white; color: #64748b; border: 1px solid #e5e7eb; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s;">
                Cancelar
              </button>
              <button class="confirm-accept" style="flex: 1; background: linear-gradient(135deg, #ef4444 0%, #dc2626 100%); color: white; border: none; padding: 10px 20px; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; transition: all 0.2s; box-shadow: 0 2px 8px rgba(239, 68, 68, 0.3);">

          overlay.appendChild(modal);

          // Agregar efectos hover
          const cancelBtn = modal.querySelector('.confirm-cancel');

      // Configuración de actualización de STATUS
      const STATUS_ENDPOINT = '/api/lineas-team/status'; // Ajustar si tu ruta es distinta
      const STATUS_METHOD = 'PUT';
      const STATUS_OPTIONS = [
        { val: 'active', label: 'Active' },
        { val: 'pending', label: 'Pending' },
        { val: 'hold', label: 'Hold' },
        { val: 'cancelled', label: 'Cancelled' },
        { val: 'rescheduled', label: 'Rescheduled' },
        { val: 'completed', label: 'Completed' }
      ];

      // ── COLCHÓN LOGIC ──────────────────────────────────────────
      // Un lead es "colchón" cuando se vendió en un mes pero se instala en otro distinto.
      function isColchonLead(lead, refMonthStr) {
        try {
          const dv = String(lead.dia_venta || '').slice(0, 7);
          const di = String(lead.dia_instalacion || '').slice(0, 7);
          if (!dv || !di || dv === di) return false;
          if (refMonthStr) {
            // Con mes de referencia: colchón si se instaló en ESE mes pero se vendió en otro
            return dv !== refMonthStr && di === refMonthStr;
          }
          // Sin filtro de mes: colchón si instalación es posterior a la venta
          return dv < di;
        } catch (_) { return false; }
      }

      function _markColchon(items) {
        // Mes de referencia: usa el filtro de fechas activo (primer día del rango) o null
        const dateFrom = ($('#dateFrom')?.value || '').slice(0, 7) || null;
        items.forEach(function(lead) {
          const isRoute = isColchonLead(lead, dateFrom);
          const st = String(lead.status || '').toLowerCase();
          const isActive = st === 'completed' || st === 'active';
          // _es_colchon_route: cualquier lead cuyo "home month" es dia_instalacion
          // (active/completed instalados en mes distinto al de venta, O pending con instalación futura)
          lead._es_colchon_route = isRoute;
          // _es_colchon badge: solo active/completed (pendientes aún no son colchón confirmado)
          lead._es_colchon       = isRoute && isActive;
        });
      }

      // Tab activo de status ('all' | 'pending' | 'active' | 'completed' | 'colchon' | 'cancelled' | 'hold')
      let _activeStatusTab = 'all';
      // ────────────────────────────────────────────────────────────
      function getUserRole(){
        try{ const u = JSON.parse(localStorage.getItem('user')||sessionStorage.getItem('user')||'{}'); return String(u.role||'').toLowerCase(); }catch{ return ''; }
      }
      function canEditStatus(){
        const r = getUserRole();
        return r.includes('admin') || r.includes('administrador') || r.includes('backoffice') || r.includes('rol_icon');
      }
      function canDelete(){
        const r = getUserRole();
        return r.includes('admin') || r.includes('administrador') || r.includes('backoffice') || r.includes('rol_icon');
      }

      function normalizeDigits(v){ return String(v||'').replace(/\D+/g,''); }

      // Teams de Líneas desde la página de permisos (/api/lineas/teams). Sin hardcode.
      let LINEAS_TEAMS = [];
      // Supervisor que el backend le fija a quien mira: con locked=true la pantalla
      // no ofrece otros teams. Vacío para admin y backoffice, que los ven todos.
      let LINEAS_ASIGNADO = null;
      async function loadLineasTeams() {
        try {
          const r = await fetch('/api/lineas/teams', { credentials: 'include' });
          const d = r.ok ? await r.json() : null;
          LINEAS_TEAMS = (d && d.teams) || [];
          LINEAS_ASIGNADO = (d && d.assigned) || null;
        } catch (_) { LINEAS_TEAMS = []; LINEAS_ASIGNADO = null; }
      }

      // Token del team propio ('LUIS', 'JONATHAN'…) o '' si no hay uno fijado.
      function miTeamToken() {
        if (!LINEAS_ASIGNADO || !LINEAS_ASIGNADO.locked || !LINEAS_ASIGNADO.supervisor) return '';
        return normalizeTeamKey(LINEAS_ASIGNADO.supervisor);
      }

      // Clave canónica de team = token del team (JONATHAN/LUIS/VICTOR/…), derivado de permisos.
      function normalizeTeamKey(v) {
        const raw = String(v || '').trim().toUpperCase();
        if (!raw) return 'SIN TEAM';
        const cleaned = raw
          .replace(/[\.\t\r\n]+/g, ' ')
          .replace(/[^A-Z0-9\s]/g, ' ')
          .replace(/\s+/g, ' ')
          .trim();
        if (!cleaned) return 'SIN TEAM';
        const t = LINEAS_TEAMS.find(tt => tt.token && cleaned.includes(tt.token));
        return t ? t.token : cleaned;
      }

      // Genera los botones del toggle de team y el select oculto desde permisos.
      function renderTeamToggle() {
        const tg = document.getElementById('teamToggle');
        if (tg) {
          tg.innerHTML = '<button class="tt-btn tt-active" data-team="">Todos</button>' +
            LINEAS_TEAMS.map(t => `<button class="tt-btn" data-team="${t.token || ''}">${(t.label || ('Team ' + (t.token || ''))).replace(/^Team\s+/i, '')}</button>`).join('');
        }
        const tf = document.getElementById('teamFilter');
        if (tf) {
          tf.innerHTML = '<option value="">Todos los Teams</option>' +
            LINEAS_TEAMS.map(t => `<option value="${t.token || ''}">${t.label || t.token}</option>`).join('');
        }
      }

      // Opciones <option> de supervisor para el formulario de edición (desde permisos).
      function supervisorOptionsHTML(currentSup) {
        const cur = String(currentSup || '').toUpperCase();
        return '<option value="">— Sin asignar —</option>' +
          LINEAS_TEAMS.map(t => {
            const val = (t.supervisor && t.supervisor.name) || t.token;
            const sel = (t.token && cur.includes(t.token)) ? 'selected' : '';
            return `<option value="${String(val).replace(/"/g,'&quot;')}" ${sel}>${String(val)}</option>`;
          }).join('');
      }

      // Estados de las líneas de un cliente, en MAYÚSCULAS. Se miran las dos
      // fuentes que conviven en los datos: lines_data (lines[].status) y el
      // JSON lineas_status, que es lo que usan las tarjetas para pintarlas.
      function estadosDeLineas(it) {
        const salida = [];
        const lineas = Array.isArray(it?.lines) ? it.lines : [];
        lineas.forEach(l => { if (l && l.status) salida.push(String(l.status).toUpperCase()); });
        const n = parseInt(it?.cantidad_lineas || 0, 10) || lineas.length;
        for (let i = 0; i < n; i++) {
          const s = extractLineStatus(it, i);
          if (s) salida.push(String(s).toUpperCase());
        }
        return salida;
      }

      function extractLineStatus(item, i) {
        if (!item) return '';
        const ls = item.lineas_status;
        if (ls) {
          if (Array.isArray(ls)) {
            return ls[i] ?? ls[i + 1] ?? '';
          }
          if (typeof ls === 'object') {
            return ls[i] ?? ls[String(i)] ?? ls[i + 1] ?? ls[String(i + 1)] ?? '';
          }
        }
        return '';
      }

      function getAgentRaw(it) {
        return it?.agenteAsignado || it?.agenteNombre || it?.agente || it?._collectionName || '';
      }

      function normalizeAgentKey(v) {
        return String(v || '').trim().toUpperCase().replace(/\s+/g, ' ');
      }

      // Desplegable de agentes. Un supervisor solo ve a los suyos; admin y
      // backoffice ven a todos, agrupados bajo el nombre de su supervisor.
      function populateAgentFilterFromItems(items) {
        const agentFilter = document.getElementById('agentFilter');
        if (!agentFilter) return;
        const teamFilter = document.getElementById('teamFilter');
        const selectedTeam = teamFilter ? String(teamFilter.value || '').trim().toUpperCase() : '';

        // agente -> token de su team, según permisos (no según el registro: un
        // lead viejo puede arrastrar el supervisor que tenía entonces).
        // Se indexan nombre Y usuario, y ambos sin puntos: los registros guardan
        // tanto "ANDREA ARDON" como "ANDREA.ARDON" según por dónde entraran.
        const teamDeAgente = new Map();   // clave normalizada -> token
        const plantilla    = new Map();   // token -> Set(nombres para mostrar)
        const nombreSup    = new Map();   // token -> nombre del supervisor
        const clavesDe = v => {
          const k = normalizeAgentKey(v);
          if (!k) return [];
          const sinPuntos = k.replace(/\./g, ' ').replace(/\s+/g, ' ').trim();
          return sinPuntos === k ? [k] : [k, sinPuntos];
        };
        LINEAS_TEAMS.forEach(t => {
          const token = t.token || '';
          nombreSup.set(token, (t.supervisor && t.supervisor.name) || t.label || token);
          (t.agents || []).forEach(a => {
            clavesDe(a.name).concat(clavesDe(a.username)).forEach(k => teamDeAgente.set(k, token));
            const visible = normalizeAgentKey(a.name || a.username);
            if (visible) {
              if (!plantilla.has(token)) plantilla.set(token, new Set());
              plantilla.get(token).add(visible);
            }
          });
        });

        const grupos = new Map();         // token -> Set(agentes)
        const agregar = (token, agente) => {
          if (!agente) return;
          const k = token || 'SIN TEAM';
          if (!grupos.has(k)) grupos.set(k, new Set());
          grupos.get(k).add(agente);
        };

        (Array.isArray(items) ? items : []).forEach(it => {
          const sup = String(it?.supervisor || it?.team || it?.Team || it?.SUPERVISOR || '').trim().toUpperCase();
          if (selectedTeam && !sup.includes(selectedTeam)) return;
          const agente = normalizeAgentKey(getAgentRaw(it));
          if (!agente) return;
          const porPermisos = clavesDe(agente).map(k => teamDeAgente.get(k)).find(Boolean);
          agregar(porPermisos || normalizeTeamKey(sup), agente);
        });

        const miToken = miTeamToken();
        const esSupervisor = String(getUserRole() || '').includes('supervisor');
        const ordenar = s => Array.from(s).sort((a, b) => a.localeCompare(b));
        const opcion  = a => `<option value="${escH(a)}">${escH(a)}</option>`;

        let html = '<option value="">Todos</option>';

        if (miToken) {
          const propios = new Set(grupos.get(miToken) || []);
          // El supervisor ve su plantilla completa aunque algún agente no tenga
          // ventas en el periodo; un agente solo se ve a sí mismo (es lo único
          // que le devuelve el backend).
          if (esSupervisor) {
            const yaEstan = new Set();
            propios.forEach(a => clavesDe(a).forEach(k => yaEstan.add(k)));
            (plantilla.get(miToken) || new Set()).forEach(a => {
              // Mismo agente escrito de otra forma ("ANDREA.ARDON" / "ANDREA ARDON"):
              // se queda el que traen los datos, que es con el que filtra la tabla.
              if (!clavesDe(a).some(k => yaEstan.has(k))) propios.add(a);
            });
          }
          html += ordenar(propios).map(opcion).join('');
        } else {
          // Admin y backoffice: mismo listado, separado por supervisor.
          const tokens = Array.from(grupos.keys()).sort((a, b) => {
            if (a === 'SIN TEAM') return 1;
            if (b === 'SIN TEAM') return -1;
            return String(nombreSup.get(a) || a).localeCompare(String(nombreSup.get(b) || b));
          });
          html += tokens.map(token => {
            const etiqueta = token === 'SIN TEAM' ? 'Sin supervisor' : (nombreSup.get(token) || token);
            return `<optgroup label="${escH(etiqueta)}">` + ordenar(grupos.get(token)).map(opcion).join('') + '</optgroup>';
          }).join('');
        }

        const prev = String(agentFilter.value || '');
        agentFilter.innerHTML = html;
        if (prev && Array.from(agentFilter.options).some(o => o.value === prev)) {
          agentFilter.value = prev;
        }
      }

      function toYMDFromAnyDate(v){
        const s0 = String(v || '').trim();
        if (!s0) return '';
        const s = s0.slice(0, 32);
        const m1 = s.match(/^(\d{4})-(\d{2})-(\d{2})/);
        if (m1) return `${m1[1]}-${m1[2]}-${m1[3]}`;
        const m2 = s.match(/^(\d{2})\/(\d{2})\/(\d{4})/);
        if (m2) return `${m2[3]}-${m2[2].padStart(2,'0')}-${m2[1].padStart(2,'0')}`;
        const m3 = s.match(/^(\d{2})-(\d{2})-(\d{4})/);
        if (m3) return `${m3[3]}-${m3[2].padStart(2,'0')}-${m3[1].padStart(2,'0')}`;
        const d = new Date(s0);
        if (!isNaN(d)) {
          const mm = String(d.getMonth() + 1).padStart(2, '0');
          const dd = String(d.getDate()).padStart(2, '0');
          return `${d.getFullYear()}-${mm}-${dd}`;
        }
        return '';
      }

      function sortOldToNew(items){
        const arr = Array.isArray(items) ? items : [];
        arr.sort((a, b) => {
          const aKey = toYMDFromAnyDate(a?.dia_venta) || toYMDFromAnyDate(a?.createdAt) || toYMDFromAnyDate(a?.fecha_contratacion) || '';
          const bKey = toYMDFromAnyDate(b?.dia_venta) || toYMDFromAnyDate(b?.createdAt) || toYMDFromAnyDate(b?.fecha_contratacion) || '';
          if (!aKey && !bKey) return 0;
          if (!aKey) return 1;
          if (!bKey) return -1;
          if (aKey < bKey) return -1;
          if (aKey > bKey) return 1;
          return 0;
        });
        return arr;
      }

      function sortNewToOld(items){
        const arr = Array.isArray(items) ? items : [];
        arr.sort((a, b) => {
          const aKey = toYMDFromAnyDate(a?.dia_venta) || toYMDFromAnyDate(a?.createdAt) || toYMDFromAnyDate(a?.fecha_contratacion) || '';
          const bKey = toYMDFromAnyDate(b?.dia_venta) || toYMDFromAnyDate(b?.createdAt) || toYMDFromAnyDate(b?.fecha_contratacion) || '';
          if (!aKey && !bKey) return 0;
          if (!aKey) return 1;
          if (!bKey) return -1;
          if (aKey > bKey) return -1;
          if (aKey < bKey) return 1;
          return 0;
        });
        return arr;
      }

      async function fetchData(){
        const headers = {};
        const resp = await fetch(`/api/lineas-team`, {
          credentials: 'include',
          headers: headers
        });
        const j = await resp.json();
        let data = Array.isArray(j?.data) ? j.data : [];
        
        // Filtrar datos según rol del usuario
        try {
          const user = JSON.parse(localStorage.getItem('user')||sessionStorage.getItem('user')||'{}');
          const role = String(user.role || '').toLowerCase();
          const username = String(user.username || '').toUpperCase();
          
          
          // Admin, BackOffice y rol_icon ven TODO
          if (role === 'admin' || role === 'administrador' || role === 'backoffice' || role === 'back office' || role === 'back_office' || role === 'rol_icon' || role === 'rol-icon' || role === 'rolicon') {
            return data;
          }
          
          // Supervisores ven solo leads de sus agentes
          if (role === 'supervisor' || role === 'supervisor team lineas') {
            return data;
          }
          
          // Vendedores/Agentes - el backend ya filtró los datos por su colección
          if (role === 'vendedor' || role === 'agente' || role === 'agent' || role === 'seller') {
            return data;
          }
          
          // Otros roles - filtrar por username como fallback
          data = data.filter(item => {
            const agente = String(item.agenteAsignado || item.agenteNombre || item.agente || item._collectionName || '').toUpperCase();
            return agente.includes(username) || agente === username;
          });
          
        } catch (e) {
          console.error('Error al filtrar datos por rol:', e);
        }
        
        return data;
      }

      function buildHeaders(){
        const thead = document.getElementById('costumer-thead');
        if (!thead) return;
        thead.innerHTML = `
          <tr>
            <th>Cliente</th>
            <th>Teléfono</th>
            <th>Cuenta</th>
            <th>Cant. líneas</th>
            <th>Líneas</th>
            <th>STATUS</th>
            <th>Día venta</th>
            <th>Día instalación</th>
            <th>ID</th>
            <th>Mercado</th>
            <th>Supervisor</th>
            <th>ACCIÓN</th>
          </tr>`;
      }

      /* opts.ventaStricta: el rango de fechas se evalúa SOLO contra dia_venta
         (sin la regla pending→instalación ni la excepción de colchones).
         Se usa para los KPIs de "Ventas", que deben cuadrar con las ventas
         reales del mes como en el widget de Team Líneas (ej. junio: 90/139). */
      function applyFilters(items, opts){
        const _ventaStricta = !!(opts && opts.ventaStricta);
        _markColchon(items);
        const query = ($('#q')?.value || '').trim().toUpperCase();
        const qDigits = normalizeDigits(query);
        const qstatus = ($('#qs')?.value || '').trim().toLowerCase();
        const qagent = ($('#agentFilter')?.value || '').trim().toUpperCase();
        // Leer team desde el toggle switch
        const _activeTeamBtn = document.querySelector('#teamToggle .tt-btn.tt-active');
        const qteam = (_activeTeamBtn ? (_activeTeamBtn.getAttribute('data-team')||'') : '').toUpperCase();
        const qlineStatus = ($('#lineStatusFilter')?.value || '').trim().toUpperCase();
        let dateFrom = ($('#dateFrom')?.value || '').trim();
        let dateTo = ($('#dateTo')?.value || '').trim();
        
        // No aplicar filtro de fechas por defecto - mostrar todos los leads
        // El usuario puede establecer fechas manualmente si lo desea
        
        const nombre = '';
        const tel = '';
        const cuenta = '';
        const autopay = '';
        const pin = '';
        const dir = '';
        const servs = [];
        let status = '';
        if (qstatus) status = qstatus;
        const dventa = '';
        const dinst = '';
        const cant = '';
        const idv = '';
        const mercado = [];
        let sup = '';
        if (!sup && defaultSupervisor) sup = defaultSupervisor;

        const selectedTeamKey = qteam ? normalizeTeamKey(qteam) : '';

        return items.filter(it=>{
          if (query) {
            const phoneDigits = normalizeDigits(it.telefono_principal);
            const phoneMatch = qDigits.length >= 3 && phoneDigits.includes(qDigits);
            const blob = [
              String(it.nombre_cliente||'').toUpperCase(),
              String(it.numero_cuenta||'').toUpperCase(),
              String(it.direccion||'').toUpperCase(),
              String(it.id||'').toUpperCase(),
              String(it.ID||'').toUpperCase(),
              it.telefono_principal||''
            ].join(' | ');
            if (!blob.includes(query) && !phoneMatch) return false;
          }
          if (nombre && !(String(it.nombre_cliente||'').toUpperCase().includes(nombre))) return false;
          if (tel && !(normalizeDigits(it.telefono_principal).includes(tel))) return false;
          if (cuenta && !(String(it.numero_cuenta||'').includes(cuenta))) return false;
          if (autopay && String(it.autopay||'').toLowerCase()!==autopay) return false;
          if (pin && !(String(it.pin_seguridad||'').includes(pin))) return false;
          if (dir && !(String(it.direccion||'').toUpperCase().includes(dir))) return false;
          if (servs.length && !servs.some(s=> (it.servicios||[]).includes(s))) return false;
          if (status && String(it.status||'').toLowerCase()!==status) return false;
          if (dventa && String(it.dia_venta||'')!==dventa) return false;
          if (dinst && String(it.dia_instalacion||'')!==dinst) return false;
          if (cant && Number(it.cantidad_lineas||0)!== Number(cant)) return false;
          if (idv && !(String(it.id||'').includes(idv))) return false;
          if (mercado.length && !mercado.includes(String(it.mercado||''))) return false;
          if (sup && !String(it.supervisor||'').toUpperCase().includes(sup.toUpperCase())) return false;
          // Filtro por agente asignado
          if (qagent && !(String(it.agenteAsignado||'').toUpperCase().includes(qagent) || 
                          String(it.agenteNombre||'').toUpperCase().includes(qagent) ||
                          String(it.agente||'').toUpperCase().includes(qagent))) return false;
          
          // Filtro por Team (supervisor)
          if (selectedTeamKey) {
            const itemTeamKey = normalizeTeamKey(it.supervisor || it.team || it.Team || it.SUPERVISOR || '');
            if (itemTeamKey !== selectedTeamKey) return false;
          }
          
          // Filtro por status de línea
          if (qlineStatus) {
            const _lineMatch = (st) => {
              const u = String(st || '').toUpperCase();
              if (qlineStatus === 'ACTIVA')     return u === 'ACTIVE' || u === 'ACTIVA' || u === 'COMPLETED' || u.includes('ACTIV') || u.includes('COMPLET');
              if (qlineStatus === 'CANCELADA')  return u === 'CANCELLED' || u === 'CANCELADA' || u.includes('CANCEL');
              if (qlineStatus === 'SUSPENDIDA') return u === 'HOLD' || u === 'SUSPENDIDA' || u.includes('HOLD') || u.includes('SUSPENDID');
              return u.includes(qlineStatus);
            };
            const lines = Array.isArray(it.lines) ? it.lines : [];
            const hasMatchingLine = lines.some(line => _lineMatch(line.status));
            if (!hasMatchingLine && !_lineMatch(it.status)) return false;
          }
          
          // Filtro por rango de fechas — se omite si hay texto de búsqueda activo
          if (!query) {
            const _stForDate = String(it.status || '').toLowerCase();
            const _isPending  = _stForDate === 'pending';
            const _isActive   = _stForDate === 'active' || _stForDate === 'completed';
            const _rawDate    = _ventaStricta ? (it.dia_venta || '')
                                : ((_isPending && it.dia_instalacion) ? it.dia_instalacion : (it.dia_venta || ''));
            const _normalize  = (d) => {
              let s = String(d || '');
              if (s.includes('/')) { const p = s.split('/'); if (p.length === 3) s = `${p[2]}-${p[1].padStart(2,'0')}-${p[0].padStart(2,'0')}`; }
              return s;
            };
            let diaRef  = _normalize(_rawDate);
            let diaInst = _normalize(it.dia_instalacion || '');
            // Colchón: lead ACTIVE/COMPLETED con dia_instalacion en rango aunque dia_venta esté fuera
            const instInRange = !_ventaStricta && _isActive && diaInst && (!dateFrom || diaInst >= dateFrom) && (!dateTo || diaInst <= dateTo);
            if (dateFrom && diaRef && diaRef < dateFrom && !instInRange) return false;
            if (dateTo   && diaRef && diaRef > dateTo   && !instInRange) return false;
          }

          // ── Filtro por tab de status ──
          if (_activeStatusTab === 'colchon') {
            if (!it._es_colchon_route) return false;
          } else if (_activeStatusTab !== 'all') {
            const st = String(it.status || '').toLowerCase();
            if (_activeStatusTab === 'active') {
              // "Active Líneas": cuenta el estado de las LÍNEAS, no el del cliente.
              // Antes este tab mezclaba clientes active y completed, que es justo
              // lo que ahora hace el tab de al lado.
              const estados = estadosDeLineas(it);
              if (estados.length) {
                if (!estados.some(e => e === 'ACTIVE' || e === 'ACTIVA' || e.includes('ACTIV'))) return false;
              } else if (st !== 'active') {
                // Registro sin detalle de líneas (datos antiguos): se cae al
                // status del cliente para no esconderlo de la vista.
                return false;
              }
            } else {
              if (st !== _activeStatusTab) return false;
            }
            // En tabs de status concreto: excluir colchones del tab "active/completed"
            if ((_activeStatusTab === 'active') && it._es_colchon) return false;
          }

          return true;
        });
      }

      function renderTable(items){
        buildHeaders();
        const tb = document.getElementById('costumer-tbody');
        const editable = canEditStatus();
        tb.innerHTML = items.map((it, idx)=>{
          const servArr = Array.isArray(it.servicios) ? it.servicios : (typeof it.servicios_texto==='string' ? it.servicios_texto.split(/[,;]+/).map(s=>s.trim()).filter(Boolean) : []);
          const tels = Array.isArray(it.telefonos) ? it.telefonos : [];
          const lines = Array.isArray(it.lines) ? it.lines : [];
          const maxLen = Math.max(servArr.length, tels.length, lines.length);
          
          const pairs = Array.from({length: maxLen}).map((_,i)=>{
            const s = servArr[i] || '';
            const t = tels[i] || '';
            return (s||t) ? `${s}${s&&t?': ':''}${t}` : '';
          }).filter(Boolean);
          
          const cant = (it.cantidad_lineas!=null) ? it.cantidad_lineas : (Array.isArray(it.telefonos) ? it.telefonos.length : '');
          const hasMultipleLines = cant > 1;
          const statusLower = String(it.status||'').toLowerCase();
          const docId = it._id || it.id || '';
          const statusCell = editable
            ? `<select class="status-select status-select-card status-select-${statusLower}" data-id="${docId}" data-prev="${statusLower}">
                 ${STATUS_OPTIONS.map(o=>`<option value="${o.val}" ${o.val===statusLower?'selected':''}>${o.label}</option>`).join('')}
               </select>`
            : String(it.status||'').toUpperCase();
          
          // Determinar color del badge de status
          let statusBadgeClass = 'status-badge ';
          if (statusLower === 'completed') statusBadgeClass += 'status-completed';
          else if (statusLower === 'pending') statusBadgeClass += 'status-pending';
          else if (statusLower === 'active') statusBadgeClass += 'status-active';
          else statusBadgeClass += 'bg-gray-200 text-gray-700';

          // Avatar con iniciales
          const _nameParts = (it.nombre_cliente||'?').trim().split(/\s+/);
          const _initials = _nameParts.length >= 2
            ? (_nameParts[0][0] + _nameParts[_nameParts.length-1][0]).toUpperCase()
            : (_nameParts[0][0]||'?').toUpperCase();

            }

            const detailsRow = this.closest('.details-row');
            const noteForm = detailsRow.querySelector(`.note-form[data-line-index="${lineIndex}"]`);
            if (noteForm) {
              noteForm.style.display = noteForm.style.display === 'none' ? 'block' : 'none';

            }

          btn.addEventListener('click', async function(e) {
            e.stopPropagation();
            const noteForm = this.closest('.note-form');
            const textarea = noteForm.querySelector('.note-textarea');
            const noteText = textarea.value.trim();
            
            if (!noteText) {
              showNotification('Por favor escribe una nota', 'error');
              return;
            }
            
            const lineIndex = parseInt(noteForm.getAttribute('data-line-index'));
            const detailsRow = noteForm.closest('.details-row');
            const rowIndex = detailsRow.getAttribute('data-row-index');
            const clientData = allItems[parseInt(rowIndex)];
            const clientId = clientData._id || clientData.id;
            
            // Guardar en el backend
            try {
              const response = await fetch('/api/lineas-team/notes', {
                method: 'POST',
                headers: {
                  'Content-Type': 'application/json'
                },
                body: JSON.stringify({
                  clientId: clientId,
                  lineIndex: lineIndex,
                  noteText: noteText
                })

      function lcCabecera(filtrados) {

        const mes = document.getElementById('mesFilter');
        const mesTxt = mes && mes.selectedIndex >= 0 ? mes.options[mes.selectedIndex].text : '';

        txt('lcAgenteTxt', (agente && agente.value) ? agente.value : 'Todos');
        const linea = document.getElementById('lineStatusFilter');
        txt('lcLineaTxt', (linea && linea.value) ? linea.value : 'Todas');

        // Cada chip cuenta sobre el conjunto filtrado, con el mismo criterio
        // que usa el tab correspondiente.
        const porTab = (tab) => allItemsPorTab(filtrados, tab).length;
        txt('lcCntAll', filtrados.length);
        ['pending','active','completed','colchon','cancelled','hold'].forEach(k => {
          txt('lcCnt' + k.charAt(0).toUpperCase() + k.slice(1), porTab(k));
        });

        const limpiar = document.getElementById('lcLimpiar');
        if (limpiar) {

          const tabActivo = _activeStatusTab && _activeStatusTab !== 'all';

      }

      // Función para analizar Excel y comparar con CRM
      async function handleExcelAnalysis(event) {
        const file = event.target.files[0];
        if (!file) return;
        
        try {
          // Cargar SheetJS si no está disponible.
          // Self-hosted 0.20.3 (parchea CVE-2023-30533 prototype pollution y
          // CVE-2024-22363 ReDoS de 0.18.5); ya no depende de CDN externo.
          if (typeof XLSX === 'undefined') {
            await loadScript('/vendor/xlsx/xlsx-0.20.3.full.min.js');
          }
          
          const reader = new FileReader();
          reader.onload = function(e) {
            try {
              const data = new Uint8Array(e.target.result);
              const workbook = XLSX.read(data, { type: 'array' });
              const firstSheet = workbook.Sheets[workbook.SheetNames[0]];
              const excelData = XLSX.utils.sheet_to_json(firstSheet, { header: 1 });
              
              // Procesar datos del Excel
              analyzeExcelData(excelData);
            } catch (err) {
              console.error('Error al procesar Excel:', err);
              showNotification('Error al procesar el archivo Excel: ' + err.message, 'error');
            }
          };
          reader.readAsArrayBuffer(file);
        } catch (err) {
          console.error('Error al cargar Excel:', err);
          showNotification('Error al cargar el archivo: ' + err.message, 'error');
        }
        
        // Limpiar input para permitir seleccionar el mismo archivo
        event.target.value = '';
      }
      
      // Función auxiliar para cargar scripts externos
      function loadScript(src) {
        return new Promise((resolve, reject) => {
          const script = document.createElement('script');
          script.src = src;
          script.onload = resolve;
          script.onerror = reject;
          document.head.appendChild(script);
        });
      }
      
      // Función para parsear fechas en formato español (ej: "vie, 23 ene", "mar, 27 ene", "dom, 1 feb")
      function parseSpanishDate(dateStr, defaultYear = new Date().getFullYear()) {
        if (!dateStr) return null;
        const str = String(dateStr).toLowerCase().trim();
        
        // Mapa de meses en español
        const meses = {
          'ene': 0, 'enero': 0,
          'feb': 1, 'febrero': 1,
          'mar': 2, 'marzo': 2,
          'abr': 3, 'abril': 3,
          'may': 4, 'mayo': 4,
          'jun': 5, 'junio': 5,
          'jul': 6, 'julio': 6,
          'ago': 7, 'agosto': 7,
          'sep': 8, 'sept': 8, 'septiembre': 8,
          'oct': 9, 'octubre': 9,
          'nov': 10, 'noviembre': 10,
          'dic': 11, 'diciembre': 11
        };
        
        // Intentar parsear formato "día, DD mes" o "DD mes" o "DD/MM/YYYY"
        let match = str.match(/(\d{1,2})\s+(\w+)/);
        if (match) {
          const day = parseInt(match[1]);
          const mesStr = match[2].toLowerCase();
          const month = meses[mesStr];
          if (month !== undefined && day >= 1 && day <= 31) {
            return new Date(defaultYear, month, day);
          }
        }
        
        // Intentar formato DD/MM/YYYY
        match = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{2,4})/);
        if (match) {
          const day = parseInt(match[1]);
          const month = parseInt(match[2]) - 1;
          let year = parseInt(match[3]);
          if (year < 100) year += 2000;
          return new Date(year, month, day);
        }
        
        // Intentar formato YYYY-MM-DD
        match = str.match(/(\d{4})-(\d{2})-(\d{2})/);
        if (match) {
          return new Date(parseInt(match[1]), parseInt(match[2]) - 1, parseInt(match[3]));
        }
        
        return null;
      }
      
      // Función para analizar datos del Excel vs CRM
      function analyzeExcelData(excelData) {
        if (!excelData || excelData.length < 2) {
          showNotification('El archivo Excel está vacío o no tiene datos válidos', 'error');
          return;
        }
        
        // Obtener headers (primera fila)
        const headers = excelData[0].map(h => String(h||'').toUpperCase().trim());
        
        // Encontrar índices de columnas importantes
        const idxNombre = headers.findIndex(h => h.includes('NOMBRE') || h.includes('CLIENTE'));
        const idxTelefono = headers.findIndex(h => h.includes('TELEFONO') || h.includes('TEL'));
        const idxCuenta = headers.findIndex(h => h.includes('CUENTA'));
        const idxStatus = headers.findIndex(h => h.includes('STATUS') || h === 'STATUS');
        const idxId = headers.findIndex(h => h === 'ID' || h === 'ID:');
        const idxFechaVenta = headers.findIndex(h => h.includes('FECHA') && h.includes('VENTA'));
        
        // Procesar filas del Excel (excluyendo header)
        const excelClients = [];
        let minDate = null;
        let maxDate = null;
        
        for (let i = 1; i < excelData.length; i++) {
          const row = excelData[i];
          if (!row || row.length === 0) continue;
          
          const nombre = idxNombre >= 0 ? String(row[idxNombre]||'').toUpperCase().trim() : '';
          const telefono = idxTelefono >= 0 ? String(row[idxTelefono]||'').replace(/\D/g, '') : '';
          const cuenta = idxCuenta >= 0 ? String(row[idxCuenta]||'').trim() : '';
          const status = idxStatus >= 0 ? String(row[idxStatus]||'').toUpperCase().trim() : '';
          const id = idxId >= 0 ? String(row[idxId]||'').trim() : '';
          const fechaVentaRaw = idxFechaVenta >= 0 ? row[idxFechaVenta] : '';
          
          // Parsear fecha de venta
          const fechaVenta = parseSpanishDate(fechaVentaRaw);
          if (fechaVenta) {
            if (!minDate || fechaVenta < minDate) minDate = fechaVenta;
            if (!maxDate || fechaVenta > maxDate) maxDate = fechaVenta;
          }
          
          if (nombre || telefono || cuenta || id) {
            excelClients.push({ nombre, telefono, cuenta, status, id, fechaVenta, row: i + 1 });
          }
        }
        
        // Filtrar CRM según el rango de fechas del Excel
        let crmClients = [];
        if (minDate && maxDate) {
          // Formatear fechas para comparación
          const formatDate = (d) => {
            const year = d.getFullYear();
            const month = String(d.getMonth() + 1).padStart(2, '0');
            const day = String(d.getDate()).padStart(2, '0');
            return year + '-' + month + '-' + day;
          };
          const minDateStr = formatDate(minDate);
          const maxDateStr = formatDate(maxDate);
          
          
          // Filtrar allItems por el rango de fechas del Excel
          crmClients = allItems.filter(item => {
            let diaVenta = item.dia_venta || '';
            // Normalizar formato de fecha a YYYY-MM-DD
            if (diaVenta && diaVenta.includes('/')) {
              const parts = diaVenta.split('/');
              if (parts.length === 3) {
                diaVenta = parts[2] + '-' + parts[1].padStart(2,'0') + '-' + parts[0].padStart(2,'0');
              }
            }
            return diaVenta >= minDateStr && diaVenta <= maxDateStr;
          });
          
        } else {
          // Si no se detectaron fechas, usar los datos filtrados actuales
          crmClients = applyFilters(allItems);
        }
        
        // Análisis comparativo
        let activasExcel = 0, activasCRM = 0;
        let pendientesExcel = 0, pendientesCRM = 0;
        let canceladasExcel = 0, canceladasCRM = 0;
        const faltantesEnCRM = [];
        const faltantesEnExcel = [];
        
        // Contar por status en Excel
        excelClients.forEach(ec => {
          if (ec.status.includes('ACTIVA')) activasExcel++;
          else if (ec.status.includes('PENDING') || ec.status.includes('PENDIENTE')) pendientesExcel++;
          else if (ec.status.includes('CANCELADA') || ec.status.includes('CANCEL')) canceladasExcel++;
        });
        
        // Contar por status en CRM
        crmClients.forEach(cc => {
          const status = String(cc.status||'').toUpperCase();
          if (status.includes('ACTIVA') || status.includes('COMPLETED') || status.includes('ACTIVE')) activasCRM++;
          else if (status.includes('PENDING') || status.includes('PENDIENTE')) pendientesCRM++;
          else if (status.includes('CANCELADA') || status.includes('CANCEL')) canceladasCRM++;
        });
        
        // Buscar faltantes en CRM (están en Excel pero no en CRM)
        excelClients.forEach(ec => {
          const found = crmClients.some(cc => {
            const crmTel = String(cc.telefono_principal||'').replace(/\D/g, '');
            const crmCuenta = String(cc.numero_cuenta||'').trim();
            const crmId = String(cc.id||'').trim();
            return (ec.telefono && crmTel.includes(ec.telefono)) ||
                   (ec.cuenta && crmCuenta === ec.cuenta) ||
                   (ec.id && crmId === ec.id);
          });
          if (!found) {
            faltantesEnCRM.push(ec);
          }
        });
        
        // Buscar faltantes en Excel (están en CRM pero no en Excel)
        crmClients.forEach(cc => {
          const crmTel = String(cc.telefono_principal||'').replace(/\D/g, '');
          const crmCuenta = String(cc.numero_cuenta||'').trim();
          const crmId = String(cc.id||'').trim();
          
          const found = excelClients.some(ec => {
            return (ec.telefono && crmTel.includes(ec.telefono)) ||
                   (ec.cuenta && crmCuenta === ec.cuenta) ||
                   (ec.id && crmId === ec.id);
          });
          if (!found) {
            faltantesEnExcel.push(cc);
          }
        });
        
        // Formatear fechas para mostrar
        const formatDateDisplay = (d) => {
          if (!d) return 'N/A';
          const day = String(d.getDate()).padStart(2, '0');
          const month = String(d.getMonth() + 1).padStart(2, '0');
          const year = d.getFullYear();
          return day + '/' + month + '/' + year;
        };
        
        // Mostrar resultados en modal
        showAnalysisResults({
          totalExcel: excelClients.length,
          totalCRM: crmClients.length,
          activasExcel,
          activasCRM,
          pendientesExcel,
          pendientesCRM,
          canceladasExcel,
          canceladasCRM,
          faltantesEnCRM,
          faltantesEnExcel,
          fechaDesde: formatDateDisplay(minDate),
          fechaHasta: formatDateDisplay(maxDate)
        });
      }

        items.forEach(it => {

          if (cantLineas >= 2 && !hasLineasStatus) {
            multiLineMissingLineStatus++;
            teamAgg.multi_line_missing_lineas_status += 1;
            if (samplesMissing.length < 10) {
              samplesMissing.push({
                cliente: item.nombre_cliente,
                id: item.ID || item.id || item._id,
                cantidad_lineas: cantLineas,
                status_cliente: clientStatusUpper
              });
            }
          }
          
          // Contar líneas por status individual
          let activeByCurrentLogic = 0;
          const linesArr = Array.isArray(item.lines) ? item.lines : [];
          for (let i = 0; i < cantLineas; i++) {
            let lineStatus = 'PENDING'; // Default

            const isActiveLikeStatus = (stUpper) => (
              stUpper === 'ACTIVE' ||
              stUpper === 'ACTIVA' ||
              stUpper.includes('ACTIV') ||
              stUpper === 'COMPLETED' ||
              stUpper.includes('COMPLET') ||
              stUpper.includes('FINALIZ')
            );

            // Regla de negocio: si el lead tiene 1 sola línea, el STATUS del cliente representa el estado de esa línea.
            // Esto evita que un lineas_status legacy (p.ej. PENDING) contradiga un STATUS real (p.ej. ACTIVE).
            if (cantLineas === 1 && i === 0) {
              const clientUpper = String(clientStatusUpper || '').toUpperCase();
              if (clientUpper) {
                lineStatus = clientUpper;
              }
            }

            // Fuente de verdad #1: item.lines[i].status (lo que ves en el UI de líneas asociadas)
            const directLineStatus = String(linesArr?.[i]?.status || '').trim();
            if (directLineStatus) {
              lineStatus = directLineStatus;
            } else {
              // Respaldo: lineas_status (legacy)
              const extracted = extractLineStatus(item, i);
              if (extracted) {
                const extractedUpper = String(extracted).toUpperCase();
                // Si es 1 línea y el cliente es ACTIVE-like, preferimos el status del cliente.
                if (cantLineas === 1 && isActiveLikeStatus(String(clientStatusUpper || '').toUpperCase())) {
                  lineStatus = clientStatusUpper;
                  inferredFromClientStatus++;
                  teamAgg.inferred_line_status_from_client_status += 1;
                } else {
                  lineStatus = extracted;
                }
              } else if (cantLineas === 1 && clientStatusUpper) {
                inferredFromClientStatus++;
                teamAgg.inferred_line_status_from_client_status += 1;
              }
            }

            const statusUpper = String(lineStatus).toUpperCase();
            // Histograma de status (raw) por team
            try {
              const key = statusUpper || 'VACIO';
              const teamHist = statusHistByTeam.get(teamKey);
              teamHist.set(key, (teamHist.get(key) || 0) + 1);
            } catch (_) {}

            const isActiveLike = isActiveLikeStatus(statusUpper);

            if (isActiveLike) {
              activeByCurrentLogic++;
              lineasActivas++;
              teamAgg.lineas_active += 1;
              const arr = activeSamplesByTeam.get(teamKey);
              if (arr && arr.length < 30) {
                arr.push({
                  team: teamKey,
                  status: statusUpper,
                  cliente: item.nombre_cliente,
                  id: item.ID || item.id || item._id,
                  lineIndex: i,
                  cantidad_lineas: cantLineas,
                  supervisor_raw: rawTeam,
                  agenteAsignado: item.agenteAsignado,
                  agenteNombre: item.agenteNombre,
                  agente: item.agente,
                  collection: item._collectionName,
                  status_cliente: clientStatusUpper
                });
              }
            } else if (_isCancelledStatus(statusUpper)) {
              lineasCanceladas++;
              teamAgg.lineas_otros += 1;
            } else if (statusUpper === 'PENDING' || statusUpper === 'PENDIENTE') {
              lineasPendientes++;
              teamAgg.lineas_pending += 1;
              // Guardar muestras no-ACTIVE para diagnóstico (cap a 20 por team)
              const arr = nonActiveSamplesByTeam.get(teamKey);
              if (arr && arr.length < 20) {
                arr.push({
                  team: teamKey,
                  status: statusUpper,
                  cliente: item.nombre_cliente,
                  id: item.ID || item.id || item._id,
                  lineIndex: i,
                  cantidad_lineas: cantLineas,
                  supervisor_raw: rawTeam,
                  agenteAsignado: item.agenteAsignado,
                  agenteNombre: item.agenteNombre,
                  agente: item.agente,
                  collection: item._collectionName,
                  status_cliente: clientStatusUpper
                });
              }
            } else {
              lineasOtros++;
              teamAgg.lineas_otros += 1;
              const arr = nonActiveSamplesByTeam.get(teamKey);
              if (arr && arr.length < 20) {
                arr.push({
                  team: teamKey,
                  status: statusUpper || 'VACIO',
                  cliente: item.nombre_cliente,
                  id: item.ID || item.id || item._id,
                  lineIndex: i,
                  cantidad_lineas: cantLineas,
                  supervisor_raw: rawTeam,
                  agenteAsignado: item.agenteAsignado,
                  agenteNombre: item.agenteNombre,
                  agente: item.agente,
                  collection: item._collectionName,
                  status_cliente: clientStatusUpper
                });
              }
            }
          }

          if (teamKey === 'JONATHAN F') {
            let activeByLines = 0;
            if (Array.isArray(item.lines) && item.lines.length) {
              for (let i = 0; i < cantLineas; i++) {
                const st = String(item.lines?.[i]?.status || '').toUpperCase();
                if (!st) continue;
                if (st === 'ACTIVE' || st === 'ACTIVA' || st.includes('ACTIV') || st === 'COMPLETED' || st.includes('COMPLET') || st.includes('FINALIZ')) {
                  activeByLines++;
                }
              }
            } else if (cantLineas === 1) {
              const st = clientStatusUpper;
              if (st && (st === 'ACTIVE' || st === 'ACTIVA' || st.includes('ACTIV') || st === 'COMPLETED' || st.includes('COMPLET') || st.includes('FINALIZ'))) {
                activeByLines = 1;
              }
            }

            if (activeByLines !== activeByCurrentLogic) {
              if (mismatchesJonathan.length < 80) {
                mismatchesJonathan.push({
                  id: item.ID || item.id || item._id,
                  cliente: item.nombre_cliente,
                  supervisor_raw: rawTeam,
                  cantLineas,
                  active_by_lines: activeByLines,
                  active_by_current: activeByCurrentLogic,
                  status_cliente: clientStatusUpper,
                  lines_statuses: Array.isArray(item.lines) ? item.lines.slice(0, 6).map(l => String(l?.status || '').toUpperCase()) : [],
                  lineas_status: item.lineas_status
                });
              }
            }
          }
        });

        const resumen = {
          clientes: cantidadVentas,
          lineas_total: cantidadLineas,
          lineas_active: lineasActivas,
          lineas_pending: lineasPendientes,
          lineas_completed: lineasCompleted,
          lineas_otros: lineasOtros,
          inferred_line_status_from_client_status: inferredFromClientStatus,
          multi_line_missing_lineas_status: multiLineMissingLineStatus
        };
        if (samplesMissing.length) console.table(samplesMissing);
        if (mismatchesJonathan.length) {
          console.table(mismatchesJonathan.slice(0, 80));
        }

        // Logs separados por team/supervisor
        try {
          const teamsArr = Array.from(byTeam.values())

        // Contar colchones (active/completed instalados en mes distinto al de venta)

      /* ── KPIs mensuales en vivo ── */
      function _currentMonthRange() {
        const now   = new Date();
        const y     = now.getFullYear();
        const m     = String(now.getMonth() + 1).padStart(2, '0');
        const last  = new Date(y, now.getMonth() + 1, 0).getDate();
        return { desde: `${y}-${m}-01`, hasta: `${y}-${m}-${String(last).padStart(2, '0')}` };
      }

      function _filterByCurrentMonth(items) {
        const { desde, hasta } = _currentMonthRange();
        return items.filter(function(it) {
          const raw = it.dia_venta || it.fecha_venta || it.creadoEn || it.createdAt || '';
          if (!raw) return false;
          const d = String(raw).slice(0, 10);
          return d >= desde && d <= hasta;
        });
      }

          const btns = document.querySelectorAll('#teamToggle .tt-btn');

        } catch (_) {}

      async function bulkCompletedToActive() {
        const list = applyFilters(allItems);
        const targets = (Array.isArray(list) ? list : []).filter(it => String(it?.status || '').toLowerCase() === 'completed');
        if (!targets.length) {
          showNotification('No hay leads con STATUS COMPLETED en la vista actual.', 'error');
          return;
        }

        const ok = await showConfirm(
          'Convertir COMPLETED a ACTIVE',
          `Se van a convertir <strong>${targets.length}</strong> leads de <strong>COMPLETED</strong> a <strong>ACTIVE</strong>.<br><br>¿Deseas continuar?`
        );
        if (!ok) return;

        let done = 0;
        let failed = 0;
        const toId = (it) => String(it?._id || it?.id || it?.ID || '').trim();

        for (const it of targets) {
          const id = toId(it);
          if (!id) { failed++; continue; }
          try {
            const res = await fetch(STATUS_ENDPOINT, {
              method: STATUS_METHOD,
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id, status: 'active' })
            });
            if (!res.ok) failed++;
            else done++;
          } catch (_) {
            failed++;
          }
        }

        if (failed) showNotification(`Finalizado: ${done} actualizados, ${failed} con error.`, 'error');
        else showNotification(`Finalizado: ${done} leads convertidos a ACTIVE.`, 'success');

        await load();
      }

      // Detect supervisor por usuario y marcar por defecto (solo para supervisores)
      let defaultSupervisor = '';
      try {
        const user = JSON.parse(localStorage.getItem('user')||sessionStorage.getItem('user')||'{}');
        const name = String(user.supervisor||user.username||'').toUpperCase();
        const role = String(user.role||'').toLowerCase();

        // Solo aplicar filtro de supervisor para roles de supervisor, NO para vendedores/agentes
        if (role.includes('supervisor')) {
          // Team del supervisor desde permisos (por token). Sin hardcode.
          const myToken = normalizeTeamKey(user.team || user.supervisor || name);
          const myTeam = LINEAS_TEAMS.find(t => t.token === myToken);
          if (myTeam) defaultSupervisor = myTeam.token;
          // El desplegable de agentes lo arma populateAgentFilterFromItems, que
          // ya distingue supervisor (los suyos) de admin/BO (todos, agrupados).
        }
      } catch (_) {}

      // Toggle filters panel
      // No hay panel de filtros
      buildHeaders();

      try {
        if (canEditStatus()) {
          const analyzeContainer = document.getElementById('analyzeExcelContainer');
          if (analyzeContainer) analyzeContainer.style.display = 'flex';
        }
      } catch (_) {}

      // Guardar cambios de STATUS (delegado)
      const tbody = document.getElementById('costumer-tbody');
      if (tbody) {
        tbody.addEventListener('change', async (e)=>{
          const sel = e.target.closest('select.status-select');
          if (!sel) return;
          if (!canEditStatus()) { alert('No tienes permisos para cambiar el STATUS.'); return; }
          const id = sel.getAttribute('data-id');
          const status = sel.value;
          const prev = sel.getAttribute('data-prev') || '';
          if (!id) { alert('Error: ID del registro no encontrado'); return; }
          // Actualizar color del select inmediatamente
          sel.className = sel.className.replace(/status-select-\w+/g, '').trim() + ' status-select-' + status.toLowerCase();
          // Actualizar color del borde de la card y badge
          const card = sel.closest('.client-card');
          if (card) {
            card.className = card.className.replace(/cc-\w+/g, '').trim();
            const cls = status.toLowerCase()==='pending'?'cc-pending':status.toLowerCase()==='completed'?'cc-completed':status.toLowerCase()==='active'?'cc-active':status.toLowerCase()==='repro'?'cc-repro':'';
            if (cls) card.classList.add(cls);
          }
          sel.disabled = true;
          try{
            const res = await fetch(STATUS_ENDPOINT, {
              method: STATUS_METHOD,
              credentials: 'include',
              headers: { 'Content-Type': 'application/json' },
              body: JSON.stringify({ id, status, statusUpper: String(status||'').toUpperCase() })
            });
            if (!res.ok) {
              const errData = await res.json().catch(()=>({}));
              console.error('[STATUS] Response error:', errData);
              throw new Error(errData.message || 'HTTP '+res.status);
            }
            sel.setAttribute('data-prev', status);
            // Refetch para asegurar persistencia real al recargar
            await load();
          }catch(err){
            console.error('[STATUS] error', err);
            alert('No se pudo actualizar el STATUS');
            if (prev) sel.value = prev;
          }finally{
            sel.disabled = false;
          }
        });
      }

      // ── Custom Selects ──────────────────────────────────────────
      function _csCloseAll() {
        document.querySelectorAll('.cs-wrap.cs-open').forEach(function(w) {
          w.classList.remove('cs-open');
          var d = w.querySelector('.cs-dropdown');
          if (d) d.classList.remove('cs-open');
        });
      }
      document.addEventListener('click', _csCloseAll);

      function _csBuild(wrap) {
        var select   = wrap.querySelector('select');
        var dropdown = wrap.querySelector('.cs-dropdown');
        if (!select || !dropdown) return;
        dropdown.innerHTML = '';

        function pintarOpcion(opt) {
          var item = document.createElement('div');
          item.className = 'cs-option' + (opt.selected ? ' cs-selected' : '');
          item.textContent = opt.text || opt.value || 'Todos';
          item.setAttribute('data-value', opt.value);
          item.addEventListener('click', function(e) {
            e.stopPropagation();
            select.value = opt.value;
            select.dispatchEvent(new Event('change'));
            _csCloseAll();
            _csSync(wrap);
          });
          dropdown.appendChild(item);
        }

        // Los <optgroup> (agentes separados por supervisor) se pintan como
        // encabezado; select.options los aplanaría y se perdería la separación.
        Array.from(select.children).forEach(function(nodo) {
          if (nodo.tagName === 'OPTGROUP') {
            var cab = document.createElement('div');
            cab.className = 'cs-group';
            cab.textContent = nodo.label || '';
            dropdown.appendChild(cab);
            Array.from(nodo.children).forEach(pintarOpcion);
          } else {
            pintarOpcion(nodo);
          }
        });
      }

      function _csSync(wrap) {
        var select = wrap.querySelector('select');
        var label  = wrap.querySelector('.cs-label');
        if (!select || !label) return;
        var sel = select.options[select.selectedIndex];
        label.textContent  = sel ? (sel.text || 'Todos') : 'Todos';
        label.style.color  = (sel && sel.value) ? '#1E293B' : '#94A3B8';
      }

      function initCustomSelects() {
        document.querySelectorAll('.filter-select').forEach(function(select) {
          if (select._csInited) return;
          select._csInited = true;

          var wrap = document.createElement('div');
          wrap.className = 'cs-wrap';
          select.parentNode.insertBefore(wrap, select);

          var trigger = document.createElement('div');
          trigger.className = 'cs-trigger';
          trigger.tabIndex = 0;
          trigger.innerHTML =
            '<span class="cs-label"></span>' +
            '<svg class="cs-arrow" xmlns="http://www.w3.org/2000/svg" width="12" height="8" viewBox="0 0 12 8">' +
              '<path d="M1 1.5l5 5 5-5" stroke="currentColor" stroke-width="1.9" fill="none" stroke-linecap="round" stroke-linejoin="round"/>' +
            '</svg>';

          var dropdown = document.createElement('div');
          dropdown.className = 'cs-dropdown';

          wrap.appendChild(trigger);
          wrap.appendChild(dropdown);
          wrap.appendChild(select);
          select.style.display = 'none';

          trigger.addEventListener('click', function(e) {
            e.stopPropagation();
            var isOpen = wrap.classList.contains('cs-open');
            _csCloseAll();
            if (!isOpen) {
              _csBuild(wrap);
              dropdown.classList.add('cs-open');
              wrap.classList.add('cs-open');
            }
          });

          trigger.addEventListener('keydown', function(e) {
            if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); trigger.click(); }
            if (e.key === 'Escape') _csCloseAll();
          });

          // Re-sync cuando cambian las opciones (agentFilter se rellena dinámicamente)
          new MutationObserver(function() {
            _csSync(wrap);
            if (wrap.classList.contains('cs-open')) _csBuild(wrap);
          }).observe(select, { childList: true });

          _csSync(wrap);
        });
      }
      // ────────────────────────────────────────────────────────────

      // Tiempo real (SSE): recarga datos sin refrescar la página. No re-registra
      // el setInterval de load() (eso lo hace load() una sola vez en el arranque).
      async function reloadCostumer(){
        try {
          allItems = await fetchData();
          sortNewToOld(allItems);
          populateAgentFilterFromItems(allItems);
          applyAndRender();
          try { await refreshMonthlyKPIs(); } catch(_){}
        } catch(_){}
      }
      if (window.CRMRealtime) CRMRealtime.connect('lineas', reloadCostumer);

      load().then(initCustomSelects);
    });
  </script>

  <!-- Funciones globales de imagen para filas inline -->
  <script>
    function _clImgLightbox(src) {
      if (!src) return;
      // src viene de this.src del <img>, que ya es una URL absoluta resuelta por el browser
      var o = document.createElement('div');
      o.style.cssText = 'position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:99999;display:flex;align-items:center;justify-content:center;cursor:zoom-out;padding:20px;';
      // createElement en vez de innerHTML: .src asigna el valor como dato y nunca lo
      // interpreta como HTML, así una URL con comillas no puede inyectar onerror=.
      var im = document.createElement('img');
      im.src = String(src || '');
      im.style.cssText = 'max-width:92vw;max-height:90vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.6);';
      o.appendChild(im);
      o.onclick = function(){ document.body.removeChild(o); };
      document.body.appendChild(o);
    }

    /* ── Ficha de cliente (fila desplegada) ──────────────────────────────
       Funciones sueltas porque se llaman desde atributos onclick del HTML
       que genera renderTable, fuera del closure de la pantalla. */

    // "5551230001" -> "555 123 0001". Solo para mostrar: el dato no se toca.
    function lcTelefono(v) {
      var d = String(v || '').replace(/\D/g, '');
      return d.length === 10 ? d.slice(0,3) + ' ' + d.slice(3,6) + ' ' + d.slice(6) : (v || '');
    }

    // "2026-09-22" -> "22 sept"
    function lcFechaCorta(v) {
      if (!v) return '—';
      try {
        return new Date(String(v).slice(0,10) + 'T00:00')
          .toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
      } catch (_) { return v; }
    }

    function fcIniciales(nombre) {
      var limpio = String(nombre || '').replace(/[^A-Za-zÀ-ÿ ]/g, '').trim();
      if (!limpio) return '?';
      return limpio.split(/\s+/).map(function(p){ return p[0]; }).join('').slice(0, 2).toUpperCase();
    }

    // Mismo código de color que las píldoras de estado del listado.
    var FC_COLORES = {
      pending:     'var(--fc-orange)',
      active:      'var(--fc-blue)',
      completed:   'var(--fc-green)',
      cancelled:   'var(--fc-red)',
      hold:        'var(--fc-gray)',
      rescheduled: 'var(--fc-gray)'
    };
    function fcColorEstado(st) { return FC_COLORES[String(st || '').toLowerCase()] || 'var(--fc-gray)'; }
    function fcEtiquetaEstado(st) {
      var s = String(st || 'pending').toLowerCase();
      return s.charAt(0).toUpperCase() + s.slice(1);
    }

    // Estados de LÍNEA (en mayúsculas, distintos de los del cliente).
    var FC_COLORES_LINEA = {
      PENDING:   'var(--fc-orange)',
      ACTIVE:    'var(--fc-blue)',
      COMPLETED: 'var(--fc-green)',
      CANCELLED: 'var(--fc-red)',
      REPRO:     'var(--fc-gray)'
    };
    // Igual que fcColorEstado pero en color literal: el avatar lo necesita
    // dentro de un color-mix(), donde una var() anidada no resuelve.
    var FC_PLANOS = {
      pending: '#ff9f0a', active: '#34c759', completed: '#30b0c7',
      cancelled: '#ff3b30', hold: '#8e8e93', repro: '#8e8e93', rescheduled: '#8e8e93'
    };
    function fcColorEstadoPlano(st) { return FC_PLANOS[String(st || '').toLowerCase()] || '#8e8e93'; }

    function fcColorEstadoLinea(st) { return FC_COLORES_LINEA[String(st || '').toUpperCase()] || 'var(--fc-gray)'; }

    // Repinta la píldora de la línea. El guardado del estado lo sigue haciendo
    // el handler de .line-status-select, que no se toca.
    function fcEstadoLinea(sel) {
      var pill = sel.closest('.fc-line-status');
      if (!pill) return;
      pill.style.setProperty('--c', fcColorEstadoLinea(sel.value));
      var txt = pill.querySelector('.fc-status-txt');
      if (txt) txt.textContent = sel.value;
    }

    function fcCambioEstado(sel) {
      // La píldora ya no envuelve al selector: vive en la cabecera y el estado
      // se cambia desde la lista de Cuenta, así que se busca por la fila.
      var fila = sel.closest('.details-row');
      var pill = fila ? fila.querySelector('.fc-status') : sel.closest('.fc-status');
      if (!pill) return;
      pill.style.setProperty('--c', fcColorEstado(sel.value));
      var txt = pill.querySelector('.fc-status-txt');
      if (txt) txt.textContent = fcEtiquetaEstado(sel.value);
    }

    function fcVerPin(btn) {
      var campo = btn.parentElement.querySelector('.ile-pin');
      if (!campo) return;
      var oculto = campo.type === 'password';
      campo.type = oculto ? 'text' : 'password';
      btn.textContent = oculto ? 'Ocultar' : 'Mostrar';
    }

    function fcLineas(idx, paso) {
      var fila = document.querySelector('.details-row[data-row-index="' + idx + '"]');
      if (!fila) return;
      var campo = fila.querySelector('.ile-cant[data-row="' + idx + '"]');
      var vista = fila.querySelector('.fc-count[data-row="' + idx + '"]');
      if (!campo) return;
      var n = Math.max(1, Math.min(10, (parseInt(campo.value, 10) || 1) + paso));
      campo.value = String(n);
      if (vista) vista.textContent = String(n);
    }

    function fcFechas(idx) {
      var fila = document.querySelector('.details-row[data-row-index="' + idx + '"]');
      if (!fila) return;
      var d1 = fila.querySelector('.ile-dventa[data-row="' + idx + '"]');
      var d2 = fila.querySelector('.ile-dinst[data-row="' + idx + '"]');
      var l1 = fila.querySelector('.fc-d1-lbl[data-row="' + idx + '"]');
      var l2 = fila.querySelector('.fc-d2-lbl[data-row="' + idx + '"]');
      var hueco = fila.querySelector('.fc-gap[data-row="' + idx + '"]');
      var fmt = function(v) {
        if (!v) return '—';
        try {
          return new Date(v + 'T00:00').toLocaleDateString('es-ES', { day: 'numeric', month: 'short' }).replace('.', '');
        } catch (_) { return v; }
      };
      if (l1 && d1) l1.textContent = fmt(d1.value);
      if (l2 && d2) l2.textContent = fmt(d2.value);
      if (hueco && d1 && d2) {
        if (!d1.value || !d2.value) { hueco.textContent = ''; return; }
        var dias = Math.round((new Date(d2.value) - new Date(d1.value)) / 864e5);
        hueco.textContent = dias === 0 ? 'Mismo día'
                          : dias < 0   ? 'Revisar fechas'
                          : dias + (dias === 1 ? ' día' : ' días');
      }
    }

    // Deshace lo tecleado: cada campo guarda su valor de partida en data-inicial.
    function fcDescartar(idx) {
      var fila = document.querySelector('.details-row[data-row-index="' + idx + '"]');
      if (!fila) return;
      fila.querySelectorAll('[data-inicial]').forEach(function(el) { el.value = el.dataset.inicial; });
      var vista = fila.querySelector('.fc-count[data-row="' + idx + '"]');
      var cant  = fila.querySelector('.ile-cant[data-row="' + idx + '"]');
      if (vista && cant) vista.textContent = cant.value;
      var sel = fila.querySelector('.ile-status[data-row="' + idx + '"]');
      if (sel) fcCambioEstado(sel);
      fcFechas(idx);
      var msg = fila.querySelector('.ile-save-msg[data-row="' + idx + '"]');
      if (msg) msg.textContent = '';
    }

    function fcNotaEscrita(input) {
      var btn = input.parentElement.querySelector('.fc-send');
      if (btn) btn.disabled = !input.value.trim();
    }

    function _clImgRemove(btn) {
      var zone = btn.closest('.ile-img-zone');
      if (!zone) return;
      zone._imgFile = null;
      var inp = zone.querySelector('.ile-img-input') || zone.nextElementSibling;
      if (inp && inp.tagName === 'INPUT') inp.value = '';
      var preview = zone.querySelector('.ile-img-preview');
      if (preview) { preview.src = ''; preview.style.display = 'none'; }
      var ph = zone.querySelector('.ile-img-ph');
      if (ph) ph.style.display = 'flex';
      var hint = zone.querySelector('.ile-img-hint');
      if (hint) hint.style.display = 'none';
      btn.style.display = 'none';
    }

    function _clImgSelect(e, inp) {
      var file = e.target.files[0];
      if (!file) return;
      // En la ficha el <input file> va DENTRO de la zona (es un <label>), no
      // como hermano: se aceptan las dos colocaciones.
      var zone = inp.closest('.ile-img-zone') || inp.previousElementSibling;
      if (!zone || !zone.classList.contains('ile-img-zone')) return;
      zone._imgFile = file;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var preview = zone.querySelector('.ile-img-preview');
        if (preview) { preview.src = ev.target.result; preview.style.display = 'block'; }
        var ph = zone.querySelector('.ile-img-ph');
        if (ph) ph.style.display = 'none';
        var hint = zone.querySelector('.ile-img-hint');
        if (hint) hint.style.display = 'block';
        var rmv = zone.querySelector('.ile-img-remove');
        if (rmv) rmv.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    function _clImgDrop(e, zone) {
      e.preventDefault(); e.stopPropagation();
      zone.style.borderColor = '#c7d2fe';
      var file = e.dataTransfer.files[0];
      if (!file || !file.type.startsWith('image/')) return;
      zone._imgFile = file;
      var reader = new FileReader();
      reader.onload = function(ev) {
        var preview = zone.querySelector('.ile-img-preview');
        if (preview) { preview.src = ev.target.result; preview.style.display = 'block'; }
        var ph = zone.querySelector('.ile-img-ph');
        if (ph) ph.style.display = 'none';
        var hint = zone.querySelector('.ile-img-hint');
        if (hint) hint.style.display = 'block';
        var rmv = zone.querySelector('.ile-img-remove');
        if (rmv) rmv.style.display = 'block';
      };
      reader.readAsDataURL(file);
    }

    /* ══════════════════════════════════════════

    function _notesHeaders() {
