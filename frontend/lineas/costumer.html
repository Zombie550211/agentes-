    /* ── Llamadas de verificación / seguimiento (líneas) ── */
    var _llamadaFilesLineas = {};

    window._loadLlamadasLineas = async function(leadId, detailsRow) {
      var row = detailsRow.querySelector('.ile-caps-row-lineas[data-lead="' + leadId + '"]');
      var regWrap = detailsRow.querySelector('.ile-llamada-reg-lineas[data-lead="' + leadId + '"]');
      if (!row && !regWrap) return;
      if (!document.getElementById('ile-caps-lineas-style')) {
        var st = document.createElement('style');
        st.id = 'ile-caps-lineas-style';
        st.textContent = '.ile-caps-row-lineas::-webkit-scrollbar{display:none}'
          + '.ile-ll-nota::placeholder{color:rgba(255,255,255,0.45)}'
          + '.ile-ll-nota:focus{outline:1px solid #fca5a5}';
        document.head.appendChild(st);
      }
      var llamadas = [];
      try {
        var res = await fetch('/api/lineas-team/' + leadId + '/llamadas', { credentials: 'include' });
        if (res.ok) { var d = await res.json(); llamadas = d.data || []; }
      } catch (_) {}
      if (row) {
        row.innerHTML = llamadas.length ? llamadas.map(function(c) {
          var tipo = c.tipo === 'seguimiento' ? 'Seguim.' : 'Verif.';
          // _resolveImgUrl descarta las URLs con caracteres capaces de romper el
          // atributo o el literal JS del onclick — antes solo se escapaba ' en uno
          // y " en el otro, así que cada uno era inyectable por el carácter contrario.
          var capUrl = _resolveImgUrl(c.imagen_url);
          return '<div style="flex-shrink:0;width:72px;">' +
            '<div style="width:72px;height:54px;border:1px solid rgba(255,255,255,0.15);border-radius:8px;overflow:hidden;cursor:zoom-in;background:rgba(255,255,255,0.05);" onclick="_clImgLightbox(\'' + capUrl + '\')" title="Llamada ' + Number(c.numero_llamada || 0) + '/2">' +
              '<img src="' + capUrl + '" style="width:100%;height:100%;object-fit:cover;">' +
            '</div>' +
            '<div style="font-size:9px;font-weight:700;color:#64748b;text-align:center;margin-top:2px;white-space:nowrap;">📞 ' + c.numero_llamada + '/2 ' + tipo + '</div>' +
          '</div>';
        }).join('') : '<span style="font-size:10px;color:#94a3b8;">Sin llamadas registradas</span>';
      }
      var pend = (window.__llamadasPendientes && window.__llamadasPendientes.leads) || [];
      var isDue = pend.some(function(p) { return p.source === 'lineas' && String(p.id || p._id) === String(leadId); });
      var nDone = llamadas.length;
      if (regWrap && isDue && nDone < 2) {
        var nNext = nDone + 1;
        var tipoNext = nDone === 0 ? 'verificación' : 'seguimiento';
        regWrap.innerHTML =
          '<div style="border:1.5px solid rgba(248,113,113,0.45);border-radius:10px;padding:9px;background:rgba(127,29,29,0.22);">' +
            '<div style="font-size:10px;font-weight:800;color:#fca5a5;margin-bottom:6px;">Llamada ' + nNext + '/2 (' + tipoNext + ') pendiente — captura + nota</div>' +
            '<div class="ile-ll-imgname" style="font-size:10px;color:#cbd5e1;margin-bottom:4px;display:none;"></div>' +
            '<button type="button" onclick="this.nextElementSibling.click()" style="width:100%;padding:6px;border:1px solid rgba(255,255,255,0.18);border-radius:7px;background:rgba(255,255,255,0.08);font-size:11px;font-weight:700;cursor:pointer;color:#e2e8f0;margin-bottom:5px;">📷 Subir captura Xencall</button>' +
            '<input type="file" accept="image/*" style="display:none" onchange="_llamadaLineasFileSelect(event,\'' + leadId + '\')">' +
            '<textarea class="ile-ll-nota" rows="2" placeholder="La llamada se realizó. Respuesta del cliente…" style="width:100%;padding:6px 8px;border:1px solid rgba(255,255,255,0.18);border-radius:7px;font-size:11px;resize:none;box-sizing:border-box;color:#e6ebf5;background:rgba(255,255,255,0.06);margin-bottom:5px;"></textarea>' +
            '<button type="button" class="ile-ll-btn" onclick="_registrarLlamadaLineas(\'' + leadId + '\')" style="width:100%;padding:7px;border:none;border-radius:7px;background:#dc2626;color:#fff;font-size:11px;font-weight:800;cursor:pointer;">Registrar llamada ' + nNext + '/2</button>' +
            '<div class="ile-ll-msg" style="font-size:10px;margin-top:4px;text-align:center;"></div>' +
          '</div>';
      } else if (regWrap) {
        regWrap.innerHTML = '';
      }
    };

    window._llamadaLineasFileSelect = function(ev, leadId) {
      var f = ev.target.files[0];
      if (!f) return;
      _llamadaFilesLineas[leadId] = f;
      var wrap = ev.target.closest('.ile-llamada-reg-lineas');
      var lbl = wrap && wrap.querySelector('.ile-ll-imgname');
      if (lbl) { lbl.style.display = 'block'; lbl.textContent = '📎 ' + f.name; }
    };

    window._registrarLlamadaLineas = async function(leadId) {
      var wrap = document.querySelector('.ile-llamada-reg-lineas[data-lead="' + leadId + '"]');
      if (!wrap) return;
      var msg = wrap.querySelector('.ile-ll-msg');
      var btn = wrap.querySelector('.ile-ll-btn');
      var notaEl = wrap.querySelector('.ile-ll-nota');
      var nota = (notaEl && notaEl.value || '').trim();
      var f = _llamadaFilesLineas[leadId];
      function setMsg(t, ok) { if (msg) { msg.textContent = t; msg.style.color = ok ? '#16a34a' : '#dc2626'; } }
      if (!f) { setMsg('Sube la captura de Xencall', false); return; }
      if (!nota) { setMsg('Escribe la nota de la llamada', false); return; }
      if (btn) { btn.disabled = true; btn.textContent = 'Registrando…'; }
      try {
        var fd = new FormData();
        fd.append('file', f);
        fd.append('leadId', leadId);
        var up = await fetch('/api/files/upload', { method: 'POST', credentials: 'include', body: fd });
        if (!up.ok) throw new Error('No se pudo subir la imagen');
        var upd = await up.json();
        var url = (upd.data && upd.data.url) || '';
        if (!url) throw new Error('Sin URL de imagen');
        var res = await fetch('/api/lineas-team/' + leadId + '/llamada', {
          method: 'POST', credentials: 'include',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ imagen_url: url, nota: nota }),
        });
        if (!res.ok) {
          var j = null; try { j = await res.json(); } catch (_) {}
          throw new Error((j && (j.detail || j.message)) || 'No se pudo registrar la llamada');
        }
        delete _llamadaFilesLineas[leadId];
        setMsg('✓ Llamada registrada', true);
        // Refrescar pendientes; si no queda ninguna, levantar bloqueo
        try {
          var pres = await fetch('/api/leads/llamadas-pendientes', { credentials: 'include' });
          var pd = pres.ok ? await pres.json() : null;
          if (pd) window.__llamadasPendientes = pd;
          if (pd && !pd.blocked) {
            setMsg('✅ Todas las llamadas registradas. Bloqueo levantado.', true);
            setTimeout(function() { window.location.href = '/lineas/costumer.html'; }, 1400);
            return;
          }
        } catch (_) {}
        var dr = wrap.closest('.details-row');
        if (dr) window._loadLlamadasLineas(leadId, dr);
      } catch (e) {
        setMsg(e.message || 'Error registrando la llamada', false);
        if (btn) { btn.disabled = false; btn.textContent = 'Registrar llamada'; }
      }
    };

    function _fmtNoteDate(str) {
      if (!str) return '';
      try {
        var d = new Date(str);
        return d.toLocaleString('es-ES', {day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'});
      } catch(_) { return str; }
    }

    function _escAttr(str) {
      return String(str || '').replace(/\\/g,'\\\\').replace(/'/g,"\\'").replace(/\n/g,'\\n').replace(/\r/g,'');
    }

    function renderNoteCards(leadId, container, notes) {
      if (!notes || notes.length === 0) {
        container.innerHTML = '<div class="fc-empty">Sin notas todavía</div>';
        return;
      }
      container.innerHTML = notes.map(function(n) {
        var nid = n._id || n.id || '';
        var autor = n.autor || 'Sistema';
        var fecha = _fmtNoteDate(n.created_at);
        var texto = String(n.texto || '');
        var textoEscAttr = _escAttr(texto);
        var autorEscAttr = _escAttr(autor);
        var fechaEscAttr = _escAttr(fecha);
        return '<div class="ile-note-card" onclick="openNoteModal(\''+autorEscAttr+'\',\''+fechaEscAttr+'\',\''+textoEscAttr+'\')" title="Click para ver nota completa">' +
          '<button class="ile-note-del" onclick="event.stopPropagation();deleteLeadNote(\''+nid+'\',this)" title="Eliminar"><i class="fas fa-times"></i></button>' +
          '<div class="ile-note-autor">' + escH(autor) + '</div>' +
          '<div class="ile-note-fecha">' + escH(fecha) + '</div>' +
          '<div class="ile-note-texto">' + texto.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>') + '</div>' +
          '</div>';
      }).join('');
    }

    function openNoteModal(autor, fecha, texto) {
      var existing = document.getElementById('_noteModalOverlay');
      if (existing) existing.remove();
      var textoHtml = String(texto).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/\n/g,'<br>');
      var overlay = document.createElement('div');
      overlay.id = '_noteModalOverlay';
      overlay.className = 'note-modal-overlay';
      overlay.onclick = function(e){ if(e.target===overlay) overlay.remove(); };
      if (window._noteKeyClose) document.removeEventListener('keydown', window._noteKeyClose);
      window._noteKeyClose = function(e){ if(e.key==='Escape'){ overlay.remove(); document.removeEventListener('keydown',window._noteKeyClose); } };
      document.addEventListener('keydown', window._noteKeyClose);
      overlay.innerHTML =
        '<div class="note-modal-box">' +
          '<button onclick="var o=document.getElementById(\'_noteModalOverlay\');if(o)o.remove();document.removeEventListener(\'keydown\',window._noteKeyClose);" style="position:absolute;top:14px;right:16px;background:none;border:none;font-size:20px;color:#94a3b8;cursor:pointer;line-height:1;" title="Cerrar">&times;</button>' +
          '<div style="display:flex;align-items:center;gap:8px;margin-bottom:16px;">' +
            '<div style="background:#EFF6FF;border-radius:8px;padding:6px 8px;"><i class="fas fa-sticky-note" style="color:#2563EB;font-size:16px;"></i></div>' +
            '<div>' +
              '<div style="font-size:13px;font-weight:700;color:#1E3A8A;">' + String(autor).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>' +
              '<div style="font-size:11px;color:#94a3b8;">' + String(fecha).replace(/&/g,'&amp;').replace(/</g,'&lt;') + '</div>' +
            '</div>' +
          '</div>' +
          '<div style="font-size:14px;color:#334155;line-height:1.7;white-space:pre-wrap;word-break:break-word;overflow-wrap:break-word;">' + textoHtml + '</div>' +
        '</div>';
      document.body.appendChild(overlay);
    }

    // Tras guardar una nota se vuelve aquí: en la ficha el alta está siempre a
    // la vista (caja de escritura), así que basta con vaciarla.
    function cancelAddNote(leadId) {
      var area = document.querySelector('.ile-add-note-area[data-lead="' + leadId + '"]');
      if (!area) return;
      var campo = area.querySelector('.ile-note-ta');
      if (campo) campo.value = '';
      var btn = area.querySelector('.fc-send');
      if (btn) btn.disabled = true;
    }

    async function saveLeadNote(leadId) {
      var area = document.querySelector('.ile-add-note-area[data-lead="' + leadId + '"]');
      if (!area) return;
      var ta = area.querySelector('.ile-note-ta');
      var text = ta ? ta.value.trim() : '';
      if (!text) { if (ta) { ta.style.borderColor = '#EF4444'; ta.focus(); } return; }
      try {
        var res = await fetch('/api/lineas-team/notes', {
          method: 'POST', credentials: 'include',
          headers: _notesHeaders(),
          body: JSON.stringify({ clientId: leadId, texto: text, type: 'general' })
        });
        var data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Error');
        var container = document.querySelector('.ile-notes-container[data-lead="' + leadId + '"]');
        if (container) await loadLeadNotes(leadId, container);
        cancelAddNote(leadId);
      } catch(e) {
        alert('Error al guardar nota: ' + e.message);
      }
    }

    async function deleteLeadNote(noteId, btn) {
      if (!confirm('¿Eliminar esta nota?')) return;
      try {
        var res = await fetch('/api/lineas-team/notes/delete', {
          method: 'POST', credentials: 'include',
          headers: _notesHeaders(),
          body: JSON.stringify({ noteId: String(noteId) })
        });
        var data = await res.json();
        if (!res.ok || !data.success) throw new Error(data.message || 'Error');
        var card = btn.closest('.ile-note-card');
        if (card) card.remove();
      } catch(e) {
        alert('Error al eliminar: ' + e.message);
      }
    }
  </script>
</body>
</html>
