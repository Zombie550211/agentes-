<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Facturación Líneas - CRM</title>
    <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
    <link rel="stylesheet" href="/../css/lineas/facturacion-styles.css">
    <script src="/../js/core/fetch-interceptor.js" defer></script>
    <link rel="stylesheet" href="/css/lineas/layout.css?v=20260828">
    <link rel="stylesheet" href="/css/lineas/fondo-crema.css?v=20260828">
    <link rel="stylesheet" href="/css/componentes/glass-cards-cream.css?v=20260716a">
  <link rel="stylesheet" href="/css/componentes/sidebar-static.css?v=2">
</head>
<body>
  <script src="/js/core/theme-init.js"></script>
  <script src="/js/layout/sidebar.js" defer></script>
  <script src="/js/layout/sidebar-ui.js" defer></script>
  <script src="/js/componentes/llamadas-bloqueo.js" defer></script>
  <script src="/js/layout/sidebar-user.js" defer></script>
<nav class="sidebar" id="app-sidebar"></nav>
    <div class="layout">
        <div class="main-content">
            <div class="header-reportes">
                <h1 class="titulo-reportes">FACTURACIÓN TEAM LÍNEAS</h1>
                <div class="filtros-reportes">
                    <label>Mes:</label>
                    <select id="filtroMes"></select>
                    <label>Año:</label>
                    <select id="filtroAno"></select>
                </div>
            </div>

            <div class="tabla-excel-editable">
                <table id="tablaExcel">
                    <thead id="theadExcel"></thead>
                    <tbody id="excelBody"></tbody>
                </table>
                <div class="fila-totales-fija" id="filaTotales"></div>
            </div>

            <div class="facturacion-toolbar">
                <button id="btnGuardarFacturacion">GUARDAR</button>
            </div>
        </div>
    </div>

    <script>
        const filtroMes = document.getElementById('filtroMes');
        const filtroAno = document.getElementById('filtroAno');
        const excelBody = document.getElementById('excelBody');
        const btnGuardar = document.getElementById('btnGuardarFacturacion');

        let currentMonth = new Date().getMonth() + 1;
        let currentYear = new Date().getFullYear();
        let datosFacturacionIndex = {};
        // Equipos de Líneas: vienen del backend (tabla users / página Permisos).
        // Fallback solo si la API no devuelve equipos (p.ej. error de red).
        let currentTeams = [
            { token: 'jonathan', label: 'TEAM JONATHAN' },
            { token: 'luis', label: 'TEAM LUIS' },
        ];

        function numCols() { return 1 + currentTeams.length * 3 + 3; }

        // Inicializar selectores
        for (let i = 1; i <= 12; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = String(i).padStart(2, '0');
            if (i === currentMonth) opt.selected = true;
            filtroMes.appendChild(opt);
        }

        for (let i = currentYear - 2; i <= currentYear + 1; i++) {
            const opt = document.createElement('option');
            opt.value = i;
            opt.textContent = i;
            if (i === currentYear) opt.selected = true;
            filtroAno.appendChild(opt);
        }

        function daysInMonth(year, month) {
            return new Date(year, month, 0).getDate();
        }

        function toFechaKey(fecha) {
            try {
                if (!fecha) return '';
                const s = String(fecha).trim();
                if (/^\d{2}\/\d{2}\/\d{4}$/.test(s)) return s;
                const m = s.match(/^(\d{4})[-\/.](\d{1,2})[-\/.](\d{1,2})$/);
                if (m) {
                    const yy = parseInt(m[1], 10), mm = parseInt(m[2], 10), dd = parseInt(m[3], 10);
                    return String(dd).padStart(2,'0') + '/' + String(mm).padStart(2,'0') + '/' + String(yy);
                }
                return s;
            } catch { return String(fecha || ''); }
        }

        function formatMoneyTrunc(n) {
            const t = Math.trunc((Number(n) || 0) * 100) / 100;
            return "$" + t.toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 });
        }

        async function fetchFacturacionMes(mes, ano) {
            try {
                const url = `/api/facturacion-lineas/${ano}/${String(mes).padStart(2, '0')}`;
                const res = await fetch(url, { method: 'GET', credentials: 'include' });
                if (!res.ok) {
                    console.warn('Facturación Líneas: respuesta no OK', res.status);
                }
                const data = await res.json().catch(() => (null));
                if (data && Array.isArray(data.teams) && data.teams.length) {
                    currentTeams = data.teams;
                }
                const arr = (data && data.ok && Array.isArray(data.data)) ? data.data : [];
                datosFacturacionIndex = {};
                for (const fila of arr) {
                    const key = toFechaKey(fila?.fecha);
                    if (key) datosFacturacionIndex[key] = (fila && typeof fila.teams === 'object' && fila.teams) || {};
                }
            } catch (e) {
                console.error('Error obteniendo facturación:', e);
                datosFacturacionIndex = {};
            }
        }

        function buscarTeamsPorFecha(fecha) {
            return datosFacturacionIndex[toFechaKey(fecha)] || {};
        }

        function buildHeader() {
            const thead = document.getElementById('theadExcel');
            thead.innerHTML = '';

            const trGrupos = document.createElement('tr');
            const thFecha = document.createElement('th');
            thFecha.textContent = 'FECHA';
            thFecha.rowSpan = 2;
            trGrupos.appendChild(thFecha);
            currentTeams.forEach(t => {
                const th = document.createElement('th');
                th.colSpan = 3;
                th.textContent = String(t.label || t.token || '').toUpperCase();
                trGrupos.appendChild(th);
            });
            const thTot = document.createElement('th');
            thTot.colSpan = 3;
            thTot.textContent = 'TOTALES';
            trGrupos.appendChild(thTot);
            thead.appendChild(trGrupos);

            const trCols = document.createElement('tr');
            const subLabels = ['Total del Día', 'Total Ventas', 'Valor de Venta'];
            for (let g = 0; g < currentTeams.length + 1; g++) {
                subLabels.forEach(lbl => {
                    const th = document.createElement('th');
                    th.textContent = lbl;
                    trCols.appendChild(th);
                });
            }
            thead.appendChild(trCols);
        }

        async function renderTablaDias(mes, ano) {
            await fetchFacturacionMes(mes, ano);
            buildHeader();
            excelBody.innerHTML = "";
            const numDias = daysInMonth(ano, mes);

            for (let i = 0; i < numDias; i++) {
                const tr = document.createElement("tr");
                const fecha = String(i+1).padStart(2,'0') + '/' + String(mes).padStart(2,'0') + '/' + ano;

                const tdFecha = document.createElement('td');
                tdFecha.textContent = fecha;
                tdFecha.contentEditable = false;
                tr.appendChild(tdFecha);

                const teamsData = buscarTeamsPorFecha(fecha);
                currentTeams.forEach(t => {
                    const d = teamsData[t.token] || {};
                    const tdTotal = document.createElement('td');
                    tdTotal.textContent = d.total ? formatMoneyTrunc(d.total) : '';
                    tdTotal.contentEditable = true;
                    tr.appendChild(tdTotal);

                    const tdVentas = document.createElement('td');
                    tdVentas.textContent = d.ventas ? String(d.ventas) : '';
                    tdVentas.contentEditable = true;
                    tr.appendChild(tdVentas);

                    const tdValor = document.createElement('td');
                    tdValor.contentEditable = false;
                    tr.appendChild(tdValor);
                });

                for (let k = 0; k < 3; k++) {
                    const td = document.createElement('td');
                    td.contentEditable = false;
                    tr.appendChild(td);
                }

                excelBody.appendChild(tr);
                recalcularFila(tr);
            }
            renderFilaTotales();
        }

        function recalcularFila(tr) {
            const tds = Array.from(tr.children);
            let totalDia = 0, totalVentas = 0;

            currentTeams.forEach((t, idx) => {
                const base = 1 + idx * 3;
                const total = parseFloat(tds[base].textContent.replace(/[^0-9.-]/g, "")) || 0;
                const ventas = parseFloat(tds[base + 1].textContent.replace(/[^0-9.-]/g, "")) || 0;
                tds[base + 2].textContent = ventas > 0 ? formatMoneyTrunc(total / ventas) : "";
                totalDia += total;
                totalVentas += ventas;
            });

            const totBase = 1 + currentTeams.length * 3;
            tds[totBase].textContent = totalDia > 0 ? formatMoneyTrunc(totalDia) : "";
            tds[totBase + 1].textContent = totalVentas > 0 ? totalVentas.toString() : "";
            tds[totBase + 2].textContent = totalVentas > 0 ? formatMoneyTrunc(totalDia / totalVentas) : "";
        }

        excelBody.addEventListener('input', function(e) {
            const td = e.target;
            const tr = td.parentElement;
            if (td.cellIndex !== 0) {
                recalcularFila(tr);
                renderFilaTotales();
            }
        });

        function renderFilaTotales() {
            const cols = numCols();
            const totales = Array(cols).fill(0);
            const colVentas = new Set();
            currentTeams.forEach((t, idx) => colVentas.add(1 + idx * 3 + 1));
            const totBase = 1 + currentTeams.length * 3;
            colVentas.add(totBase + 1);

            const filas = Array.from(excelBody.querySelectorAll('tr'));
            filas.forEach(tr => {
                Array.from(tr.children).forEach((td, i) => {
                    if (i === 0) return;
                    const val = parseFloat(td.textContent.replace(/[^0-9.-]/g, "")) || 0;
                    totales[i] += val;
                });
            });

            // Recalcular valores de venta (total / ventas) por equipo y en TOTALES
            currentTeams.forEach((t, idx) => {
                const base = 1 + idx * 3;
                if (totales[base + 1] > 0) totales[base + 2] = totales[base] / totales[base + 1];
            });
            if (totales[totBase + 1] > 0) totales[totBase + 2] = totales[totBase] / totales[totBase + 1];

            const filaTotales = document.getElementById('filaTotales');
            filaTotales.innerHTML = '';
            for (let i = 0; i < cols; i++) {
                const div = document.createElement('div');
                if (i === 0) {
                    div.textContent = 'TOTALES';
                } else if (colVentas.has(i)) {
                    div.textContent = Math.round(totales[i]);
                } else {
                    div.textContent = formatMoneyTrunc(totales[i]);
                }
                filaTotales.appendChild(div);
            }
        }

        btnGuardar.addEventListener('click', async () => {
            const filas = Array.from(document.querySelectorAll('#excelBody tr'));
            let guardados = 0, errores = 0;

            for (const tr of filas) {
                recalcularFila(tr);
                const tds = Array.from(tr.children);
                const fecha = tds[0].textContent.trim();

                const teams = {};
                let tieneDatos = false;
                currentTeams.forEach((t, idx) => {
                    const base = 1 + idx * 3;
                    const total = parseFloat(tds[base].textContent.replace(/[^0-9.-]/g, "")) || 0;
                    const ventas = parseFloat(tds[base + 1].textContent.replace(/[^0-9.-]/g, "")) || 0;
                    if (total || ventas) tieneDatos = true;
                    teams[t.token] = { total, ventas };
                });

                if (tieneDatos) {
                    const res = await fetch('/api/facturacion-lineas', {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        credentials: 'include',
                        body: JSON.stringify({ fecha, teams })
                    });

                    if (res.ok) guardados++; else errores++;
                }
            }

            await renderTablaDias(currentMonth, currentYear);
            alert(`Guardados: ${guardados}. Errores: ${errores}`);
        });

        filtroMes.addEventListener('change', () => {
            currentMonth = parseInt(filtroMes.value, 10);
            renderTablaDias(currentMonth, currentYear);
        });

        filtroAno.addEventListener('change', () => {
            currentYear = parseInt(filtroAno.value, 10);
            renderTablaDias(currentMonth, currentYear);
        });

        window.addEventListener('DOMContentLoaded', () => {
            renderTablaDias(currentMonth, currentYear);
        });
    </script>
</body>
</html>
