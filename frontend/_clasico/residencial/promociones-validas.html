<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promociones activas</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <script src="/js/core/theme-init.js"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,400;8..60,600;8..60,700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script src="/agentes/js/auth-check.js"></script>
  <script src="/js/core/logout-handler.js"></script>
  <script src="/js/core/fetch-interceptor.js"></script>
  <script src="/js/core/user-info.js"></script>
  <link rel="stylesheet" href="/css/componentes/sidebar-static.css?v=2">
  <link rel="stylesheet" href="/css/base/form-controls.css?v=20260921">
  <link rel="stylesheet" href="/css/residencial/promociones.css?v=20261006">
</head>
<body>
  <script src="/js/layout/sidebar.js" defer></script>
  <script src="/js/layout/sidebar-ui.js" defer></script>
  <script src="/js/componentes/llamadas-bloqueo.js" defer></script>
  <script src="/js/layout/sidebar-user.js" defer></script>

<div class="layout">
  <nav class="sidebar" id="app-sidebar"></nav>

  <main class="main-content pa-page">

    <header class="pa-head">
      <div class="pa-head-top">
        <h1 class="pa-title">Promociones activas</h1>
        <div class="pa-head-side">
          <div class="pa-dateline">
            <span class="pa-dateline-sec">Residencial</span>
            <span id="paHoy"></span>
          </div>
          <div class="pa-admin" id="paAdmin" hidden>
            <button class="pa-btn pa-btn-secondary" type="button" id="paToggleEdit" aria-pressed="false">
              <i class="fas fa-pen" aria-hidden="true"></i><span>Editar</span>
            </button>
            <button class="pa-btn pa-btn-primary" type="button" id="paNueva">
              <i class="fas fa-plus" aria-hidden="true"></i><span>Nueva promoción</span>
            </button>
          </div>
        </div>
      </div>
      <div class="pa-rule-double" aria-hidden="true"><span></span><span></span></div>
      <nav class="pa-index" id="paIndex" aria-label="Resumen de montos"></nav>
      <div class="pa-rule" aria-hidden="true"></div>
    </header>

    <div id="paContenido" aria-live="polite">
      <p class="pa-estado">Cargando promociones…</p>
    </div>

  </main>
</div>

<!-- Diálogo crear / editar (sólo admin) -->
<div class="pa-backdrop" id="paDialogo" hidden>
  <form class="pa-dialog" id="paForm" role="dialog" aria-modal="true" aria-labelledby="paDialogoTitulo" novalidate>
    <h2 class="pa-dialog-title" id="paDialogoTitulo">Nueva promoción</h2>

    <label class="pa-field">
      <span>Nombre de la promoción</span>
      <input class="pa-input" id="paTitulo" maxlength="120" placeholder="Ej. Bono por portabilidad" autocomplete="off">
      <span class="pa-error" id="paErrTitulo" hidden></span>
    </label>

    <div class="pa-field">
      <div class="pa-items-head" aria-hidden="true"><span>Concepto</span><span>Monto ($)</span><span></span></div>
      <div id="paItems"></div>
      <span class="pa-error" id="paErrItems" hidden></span>
      <button class="pa-btn pa-btn-ghost pa-self-start" type="button" id="paAddItem">
        <i class="fas fa-plus" aria-hidden="true"></i><span>Agregar otro monto</span>
      </button>
    </div>

    <label class="pa-check">
      <input type="checkbox" id="paDestacada">
      <span>Mostrar como promoción destacada</span>
    </label>

    <span class="pa-error" id="paErrGeneral" hidden></span>

    <div class="pa-dialog-actions">
      <button class="pa-btn pa-btn-secondary" type="button" id="paCancelar">Cancelar</button>
      <button class="pa-btn pa-btn-primary" type="submit" id="paGuardar">Publicar promoción</button>
    </div>
  </form>
</div>

  <script src="/js/residencial/promociones.js?v=20261006" defer></script>
  <script src="/js/core/crm-config.js" defer></script>
  <script src="/js/core/inactivity-manager.js?v=20260611a" defer></script>
  <script src="/js/core/crm-init.js" defer></script>
</body>
</html>
