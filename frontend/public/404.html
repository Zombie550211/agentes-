<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Página no encontrada - 404</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            line-height: 1.6;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f5f5f5;
            color: #333;
            text-align: center;
        }
        /* Oscuro: glass-cards.css pone TODO el texto en blanco (!important), y con el
           fondo blanco de antes el mensaje no se veía (blanco sobre blanco). */
        .error-container {
            position: relative;
            z-index: 1;
            max-width: 500px;
            padding: 2rem;
            background: rgba(255,255,255,0.06);
            border: 1px solid rgba(255,255,255,0.12);
            border-radius: 12px;
            box-shadow: 0 8px 30px rgba(0,0,0,0.35);
        }
        h1 {
            color: #e74c3c;
            margin-bottom: 1rem;
        }
        p {
            margin-bottom: 1.5rem;
        }
        a {
            color: #3498db;
            text-decoration: none;
        }
        a:hover {
            text-decoration: underline;
        }
        body { background: #000 !important; }
        body::before {
            content: '';
            position: fixed; inset: 0; z-index: 0;
            background: linear-gradient(160deg,#0b1a33 0%,#0a1628 55%,#080f1f 100%);
            pointer-events: none;
        }
    </style>
    <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
    <link rel="stylesheet" href="/css/componentes/glass-cards.css?v=20260716a">
</head>
<body>
    <div class="error-container">
        <h1>404 - Página no encontrada</h1>
        <p>Lo sentimos, la página que estás buscando no existe o ha sido movida.</p>
        <p><a href="/inicio">Volver al inicio</a></p>
    </div>
</body>
</html>
