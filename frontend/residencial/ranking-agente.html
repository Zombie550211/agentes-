<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Ranking de agentes · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/ranking-agente.css?v=20261009a">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <!-- ══ Título, ranking y mes ══ -->
  <section class="pg-barra in-glass" aria-label="Ranking y mes">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-trophy" aria-hidden="true"></i></span>
      <div>
        <h1>Ranking de agentes</h1>
        <p>Desempeño comercial del mes · ventas completadas</p>
      </div>
    </div>
    <div class="pg-acciones">
      <div class="pg-tabs" role="group" aria-label="Ranking">
        <button type="button" class="pg-tab rk-tab" data-mode="puntaje" aria-pressed="true"><i class="ph ph-lightning" aria-hidden="true"></i>Activación</button>
        <button type="button" class="pg-tab rk-tab" data-mode="att" aria-pressed="false"><i class="ph ph-wifi-high" aria-hidden="true"></i>AT&amp;T / Frontier</button>
      </div>
      <div class="pg-periodo">
        <button type="button" class="pg-paso" id="rank-prev" aria-label="Mes anterior"><i class="ph ph-caret-left" aria-hidden="true"></i></button>
        <span class="pg-periodo-lbl" id="rank-period-label" aria-live="polite">—</span>
        <button type="button" class="pg-paso" id="rank-next" aria-label="Mes siguiente"><i class="ph ph-caret-right" aria-hidden="true"></i></button>
      </div>
    </div>
  </section>

  <!-- ══ Indicadores ══ -->
  <div class="pg-tiles" style="--pg-cols:6" aria-live="polite">
    <div class="pg-tile in-glass"><span class="pg-tico"><i class="ph ph-users"></i></span><div class="pg-tile-val" id="kpi-agentes">—</div><div class="pg-tile-lbl">Agentes en el ranking</div></div>
    <div class="pg-tile pg-tile-dest in-glass"><span class="pg-tico"><i class="ph ph-target"></i></span><div class="pg-tile-val" id="kpi-puntos">—</div><div class="pg-tile-lbl">Puntaje total</div></div>
    <div class="pg-tile in-glass"><span class="pg-tico pg-tico-verde"><i class="ph ph-trend-up"></i></span><div class="pg-tile-val" id="kpi-ventas">—</div><div class="pg-tile-lbl">Ventas activas del mes</div></div>
    <div class="pg-tile in-glass"><span class="pg-tico pg-tico-amarillo"><i class="ph ph-bed"></i></span><div class="pg-tile-val" id="kpi-colchon">—</div><div class="pg-tile-lbl">Colchón</div></div>
    <div class="pg-tile in-glass"><span class="pg-tico"><i class="ph ph-calculator"></i></span><div class="pg-tile-val" id="kpi-total-val">—</div><div class="pg-tile-lbl">Total activas (con colchón)</div></div>
    <div class="pg-tile in-glass"><span class="pg-tico pg-tico-verde"><i class="ph ph-calendar-check"></i></span><div class="pg-tile-val" id="kpi-activas-dia">—</div><div class="pg-tile-lbl">Instalaciones de hoy</div></div>
  </div>

  <!-- ══ Tabla de posiciones ══ -->
  <section class="pg-card in-glass" aria-labelledby="rk-tabla-t">
    <div class="pg-card-head">
      <div>
        <h2 id="rk-tabla-t">Tabla de posiciones</h2>
        <p>Ordenada por puntaje del mes seleccionado</p>
      </div>
      <div class="pg-tabs" role="group" aria-label="Agrupar por">
        <button type="button" class="pg-tab" id="btn-view-agente" aria-pressed="true"><i class="ph ph-user" aria-hidden="true"></i>Agente</button>
        <button type="button" class="pg-tab" id="btn-view-team" aria-pressed="false"><i class="ph ph-users-three" aria-hidden="true"></i>Team</button>
      </div>
    </div>
    <div class="pg-scroll rk-scroll" id="rank-list-dynamic"><div class="pg-vacio">Cargando ranking…</div></div>
  </section>

</div>
</div>

<!-- Huecos que esperan scripts comunes antiguos (crm-init, user-info). -->
<div hidden>
  <div class="first-pos"><div class="astronaut-name"></div><div class="astronaut-score"></div></div>
  <div class="second-pos"><div class="astronaut-name"></div><div class="astronaut-score"></div></div>
  <div class="third-pos"><div class="astronaut-name"></div><div class="astronaut-score"></div></div>
  <div id="fullRankingModal"></div><div id="btn-open-full-ranking"></div><div id="btn-toggle-force-all"></div>
  <table id="full-rank-table"><tbody></tbody></table>
  <span id="welcome-message"></span><span id="welcome-user-name"></span><span id="welcome-user-role"></span>
  <span id="user-name"></span><span id="user-role"></span>
  <span id="sidebar-user-sales"></span><span id="sidebar-user-points"></span><span id="sidebar-user-team"></span>
  <div id="roleBar"></div>
</div>

<script src="/js/layout/topnav.js?v=20261009a" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261009a" defer></script>
<script src="/js/componentes/llamadas-bloqueo.js" defer></script>
<script>
(function(){
  'use strict';
  var MONTHS=['Enero','Febrero','Marzo','Abril','Mayo','Junio','Julio','Agosto','Septiembre','Octubre','Noviembre','Diciembre'];
  var now=new Date(),curY=now.getFullYear(),curM=now.getMonth();
  var _data=[],_mode='puntaje',_view='agente';

  function fmt(v){var n=Number(v||0);return n%1===0?n.toString():n.toFixed(2);}
  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function initials(n){return String(n||'').split(/\s+/).filter(Boolean).map(function(w){return w[0];}).join('').toUpperCase().slice(0,2)||'??';}
  function set(id,v){var e=document.getElementById(id);if(e)e.textContent=v;}
  function esMesActual(){return curY===now.getFullYear()&&curM===now.getMonth();}
  function updateLabel(){
    set('rank-period-label',MONTHS[curM]+' '+curY);
    document.getElementById('rank-next').disabled=esMesActual();
  }
  function getScore(a){if(_mode==='att')return Number(a.ventas_att||a.att||a.ventas||0);return Number(a.puntaje||a.puntos||a.sum_puntaje||a.score||0);}
  // Solo URLs del propio CRM o https: el avatar viene de la BD y va a un atributo.
  function avatarSeguro(u){u=String(u||'').trim();return /^(\/|https:\/\/)[^"'<>\s]*$/.test(u)?u:'';}

  async function load(){
    var lastDay=new Date(curY,curM+1,0).getDate();
    var dts=curY+'-'+String(curM+1).padStart(2,'0')+'-01';
    var dte=curY+'-'+String(curM+1).padStart(2,'0')+'-'+String(lastDay).padStart(2,'0');
    var base='/api/ranking?fechaInicio='+dts+'&fechaFin='+dte+'&limit=200&statuses=COMPLETED';
    document.getElementById('rank-list-dynamic').innerHTML='<div class="pg-vacio">Cargando ranking…</div>';
    try{
      if(_mode==='att'){
        var rs=await Promise.all([fetch(base+'&servicio=AT%26T',{credentials:'include'}),fetch(base+'&servicio=FRONTIER',{credentials:'include'})]);
        var js=await Promise.all([rs[0].json(),rs[1].json()]);
        var parse=function(j){return Array.isArray(j)?j:Array.isArray(j.ranking)?j.ranking:(j.data&&Array.isArray(j.data.ranking))?j.data.ranking:[];};
        var merged={};
        parse(js[0]).concat(parse(js[1])).forEach(function(a){var k=a.nombreNormalizado||a.nombre||'?';if(!merged[k]){merged[k]=Object.assign({},a,{ventas:0,puntos:0,sumPuntaje:0});}merged[k].ventas+=Number(a.ventas||0);merged[k].puntos+=Number(a.puntos||a.sumPuntaje||0);merged[k].sumPuntaje+=Number(a.sumPuntaje||a.puntos||0);});
        _data=Object.values(merged).sort(function(a,b){return b.puntos-a.puntos;});
        _data.forEach(function(a,i){a.position=i+1;});
      }else{
        var res=await fetch(base,{credentials:'include'});
        if(!res.ok)throw new Error(res.status);
        var j=await res.json();
        _data=Array.isArray(j)?j:Array.isArray(j.ranking)?j.ranking:Array.isArray(j.agents)?j.agents:(j.data&&Array.isArray(j.data.ranking))?j.data.ranking:[];
      }
    }catch(e){console.warn('[ranking]',e);_data=[];}
    render();
  }

  function render(){updateKpis();renderList();}

  async function loadActivasDia(){
    try{
      var d=new Date();
      var f=d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
      var r=await fetch('/api/ranking/instalaciones-dia?fecha='+f,{credentials:'include'});
      if(!r.ok)throw new Error(r.status);
      var j=await r.json();
      set('kpi-activas-dia',Number(j.completadas||0)+'/'+Number(j.total||0));
    }catch(e){console.warn('[activas-dia]',e);set('kpi-activas-dia','—');}
  }

  function updateKpis(){
    var totalPts=_data.reduce(function(s,a){return s+Number(a.puntaje||a.puntos||a.sum_puntaje||a.score||0);},0);
    var totalV=_data.reduce(function(s,a){return s+Number(a.ventas||0);},0);
    var totalC=_data.reduce(function(s,a){return s+Number(a.colchon||a.colchón||0);},0);
    var totalA=_data.reduce(function(s,a){return s+Number(a.activas||0);},0);
    set('kpi-agentes',_data.length);set('kpi-puntos',totalPts.toFixed(2));set('kpi-ventas',totalV);set('kpi-colchon',totalC);
    // "Total activas" = activas del período (completed normales + completed colchón)
    set('kpi-total-val', totalA || (totalV + totalC));
  }

  function renderList(){
    var container=document.getElementById('rank-list-dynamic');
    if(!container)return;
    var items;
    if(_view==='team'){
      var teams={};
      _data.forEach(function(a){
        var t=String(a.team||a.equipo||'').trim()||'Sin equipo';
        if(!teams[t])teams[t]={name:t,ventas:0,colchon:0,activas:0,pts:0,agents:0};
        teams[t].ventas+=Number(a.ventas||0);
        teams[t].colchon+=Number(a.colchon||a.colchón||0);
        teams[t].activas+=Number(a.activas||0);
        teams[t].pts+=Number(a.puntaje||a.puntos||a.sum_puntaje||a.score||0);
        teams[t].agents++;
      });
      items=Object.values(teams).filter(function(t){return t.name!=='Sin equipo';}).sort(function(a,b){return b.pts-a.pts;});
    }else{items=_data.slice().sort(function(a,b){return getScore(b)-getScore(a);});}
    if(!items.length){container.innerHTML='<div class="pg-vacio">Sin datos para este mes</div>';return;}
    var maxScore=(_view==='team'?items[0].pts:getScore(items[0]))||1;
    var filas=items.map(function(a,i){
      var pos=i+1;
      var nombre=_view==='team'?a.name:(a.nombre||a.name||a.agenteNombre||a.agente||'—');
      var sub=_view==='team'?(a.agents+(a.agents===1?' agente':' agentes')):(a.supervisor||a.cargo||a.team||'');
      var ventas=_view==='team'?a.ventas:Number(a.ventas||0);
      var colchon=_view==='team'?a.colchon:Number(a.colchon||a.colchón||0);
      var activas=_view==='team'?a.activas:Number(a.activas||0);
      var total=_view==='team'?(activas||ventas+colchon):Number(a.total||ventas+colchon);
      var score=_view==='team'?a.pts:getScore(a);
      var barW=Math.max(0,Math.min(100,Math.round((score/maxScore)*100)));
      var ini=initials(nombre), url=avatarSeguro(a.avatar_url||a.avatarUrl);
      var avatar='<span class="pg-avatar" aria-hidden="true">'+(url?'<img src="'+esc(url)+'" alt="" onerror="this.parentNode.textContent=\''+esc(ini)+'\'">':esc(ini))+'</span>';
      return '<tr class="'+(pos<=3?'rk-podio':'')+'">'+
        '<td class="pg-n rk-pos-cel"><span class="pg-pos'+(pos<=3?' pg-pos-'+pos:'')+'">'+pos+'</span></td>'+
        '<th scope="row" class="pg-izq"><div class="pg-persona">'+avatar+
          '<div class="pg-persona-txt"><span class="pg-persona-nom">'+esc(nombre)+'</span>'+(sub?'<span class="pg-persona-sub">'+esc(sub)+'</span>':'')+'</div></div></th>'+
        '<td class="pg-n rk-opc">'+ventas+'</td>'+
        '<td class="pg-n rk-opc">'+(colchon?'<span class="pg-chip pg-chip-amarillo"><i class="ph ph-bed" aria-hidden="true"></i>'+colchon+'</span>':'<span class="rk-cero">—</span>')+'</td>'+
        '<td class="pg-n pg-n-dest">'+total+'</td>'+
        '<td class="rk-pts-cel"><div class="rk-pts"><span class="rk-pts-n">'+fmt(score)+'</span><small>'+(_mode==='att'&&_view!=='team'?'ventas':'pts')+'</small></div>'+
          '<div class="pg-barrita'+(pos===1?' pg-barrita-verde':'')+'" aria-hidden="true"><span style="width:'+barW+'%"></span></div></td>'+
      '</tr>';
    }).join('');
    container.innerHTML='<table class="pg-tbl rk-tbl"><thead><tr>'+
      '<th scope="col">#</th><th scope="col" class="pg-izq">'+(_view==='team'?'Team':'Agente')+'</th>'+
      '<th scope="col" class="rk-opc">Ventas</th><th scope="col" class="rk-opc">Colchón</th><th scope="col">Total</th><th scope="col" class="rk-pts-th">Puntos</th>'+
      '</tr></thead><tbody>'+filas+'</tbody></table>';
  }

  function marcar(grupo,btn){grupo.forEach(function(b){b.setAttribute('aria-pressed',String(b===btn));});}
  var tabsModo=Array.prototype.slice.call(document.querySelectorAll('.rk-tab'));
  tabsModo.forEach(function(btn){btn.addEventListener('click',function(){marcar(tabsModo,btn);_mode=btn.dataset.mode||'puntaje';load();});});
  var bAg=document.getElementById('btn-view-agente'), bTm=document.getElementById('btn-view-team');
  bAg.addEventListener('click',function(){_view='agente';marcar([bAg,bTm],bAg);render();});
  bTm.addEventListener('click',function(){_view='team';marcar([bAg,bTm],bTm);render();});
  document.getElementById('rank-prev').addEventListener('click',function(){curM--;if(curM<0){curM=11;curY--;}updateLabel();load();});
  document.getElementById('rank-next').addEventListener('click',function(){if(esMesActual())return;curM++;if(curM>11){curM=0;curY++;}updateLabel();load();});

  updateLabel();load();loadActivasDia();
  setInterval(loadActivasDia,120000);
})();
</script>
<script src="/js/core/crm-config.js" defer></script>
<script src="/js/core/inactivity-manager.js?v=20260611a" defer></script>
<script src="/js/core/crm-init.js" defer></script>
</body>
</html>
