<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tabla de puntaje · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261105a">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/tabla-puntaje.css?v=20261112a">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261105a"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <section class="pg-barra in-glass" aria-label="Tabla de puntaje">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-hash" aria-hidden="true"></i></span>
      <div>
        <h1>Tabla de puntaje</h1>
        <p>Puntos que suma cada servicio, tal como los calcula el CRM (Permisos → Servicios y puntajes)</p>
      </div>
    </div>
    <div class="pg-acciones">
      <label class="pg-campo tp-buscar">
        <i class="ph ph-magnifying-glass" aria-hidden="true"></i>
        <span class="tp-sr">Buscar servicio</span>
        <input type="search" id="tp-buscar" placeholder="Buscar servicio, categoría o tipo" autocomplete="off">
      </label>
    </div>
  </section>

  <div class="tp-leyenda" aria-label="Leyenda de puntos">
    <span><b class="tp-pts tp-alto">1.25+</b>Alto</span>
    <span><b class="tp-pts tp-medio">0.70 – 1.00</b>Medio</span>
    <span><b class="tp-pts tp-bajo">hasta 0.50</b>Base</span>
    <span><b class="tp-pts tp-na">N/A</b>No suma puntaje</span>
    <span class="tp-resumen" id="tp-resumen" aria-live="polite"></span>
  </div>

  <div class="tp-grid" id="tp-grid"></div>

</div>
</div>

<script src="/js/layout/topnav.js?v=20261112a" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261106a" defer></script>
<script src="/js/componentes/llamadas-bloqueo.js" defer></script>
<script>
/* Tabla de puntaje: se arma con el catálogo de Permisos → Servicios y puntajes (GET /api/productos),
   el mismo que usa el CRM para calcular los puntos de cada venta (scoring.score_for). Así, un servicio
   nuevo o un puntaje cambiado aparece aquí solo. Las reglas especiales (XFINITY / DOUBLE PLAY según el
   tipo de servicio) mandan sobre el catálogo y vienen en la misma respuesta. */
(function () {
  'use strict';
  var RIESGOS = [['score_low', 'LOW'], ['score_medium', 'MEDIUM'], ['score_high', 'HIGH'], ['score_na', 'N/A']];
  var productos = [], especiales = [];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;'); }
  function norm(s) { try { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); } catch (e) { return String(s || '').toLowerCase(); } }
  function fmt(n) { return n == null || isNaN(n) ? '—' : Number(n).toFixed(2); }
  function nivel(n) {
    if (n == null || isNaN(n) || Number(n) <= 0) return 'tp-na';
    return n >= 1.25 ? 'tp-alto' : n >= 0.7 ? 'tp-medio' : 'tp-bajo';
  }
  function pts(n) { return '<span class="tp-pts ' + nivel(n) + '">' + (n == null || Number(n) <= 0 ? 'N/A' : fmt(n)) + '</span>'; }
  // Puntaje fijo (score_base) o, si no hay, uno por riesgo del cliente.
  function celdaPuntos(p) {
    if (p.score_base != null) return pts(p.score_base);
    return '<div class="tp-riesgos">' + RIESGOS.map(function (r) {
      return '<span class="tp-riesgo"><small>' + r[1] + '</small>' + pts(p[r[0]]) + '</span>';
    }).join('') + '</div>';
  }
  function equivalentes(p) { return Array.isArray(p.equivalentes) ? p.equivalentes : []; }
  function texto(p) { return norm([p.servicio, p.categoria, p.tipo, p.sistema].concat(equivalentes(p)).join(' ')); }

  function tarjeta(titulo, chip, cabecera, filas) {
    return '<section class="pg-card in-glass tp-card"><div class="pg-card-head"><h2>' + esc(titulo) + '</h2>' +
      '<span class="pg-chip">' + chip + '</span></div><table class="pg-tbl tp-tbl"><thead><tr>' + cabecera +
      '</tr></thead><tbody>' + filas + '</tbody></table></section>';
  }

  function pintar() {
    var q = norm(document.getElementById('tp-buscar').value.trim());
    var html = '', vistos = 0;

    var esp = especiales.filter(function (e) { return !q || norm(e.tipo + ' ' + e.servicio + ' reglas especiales').indexOf(q) >= 0; });
    if (esp.length) {
      html += tarjeta('Reglas especiales', 'Mandan sobre el catálogo',
        '<th scope="col" class="pg-izq">Servicio</th><th scope="col" class="pg-izq">Si el tipo de servicio es</th><th scope="col" class="tp-col-pts">Puntos</th>',
        esp.map(function (e) {
          return '<tr><th scope="row" class="pg-izq tp-prod">' + esc(e.servicio) + '</th><td class="pg-izq tp-vel">' + esc(e.tipo) + '</td>' +
            '<td class="tp-col-pts">' + pts(e.puntaje) + '</td></tr>';
        }).join(''));
    }

    var grupos = {};
    productos.forEach(function (p) {
      if (q && texto(p).indexOf(q) < 0) return;
      var c = p.categoria || 'Sin categoría';
      (grupos[c] = grupos[c] || []).push(p);
    });
    Object.keys(grupos).sort(function (a, b) { return a.localeCompare(b, 'es'); }).forEach(function (c) {
      var filas = grupos[c];
      vistos += filas.length;
      html += tarjeta(c, filas.length + (filas.length === 1 ? ' servicio' : ' servicios'),
        '<th scope="col" class="pg-izq">Servicio</th><th scope="col" class="pg-izq">Tipo</th><th scope="col" class="tp-col-pts">Puntos</th>',
        filas.map(function (p) {
          var eq = equivalentes(p);
          return '<tr><th scope="row" class="pg-izq tp-prod">' + esc(p.servicio) +
            (eq.length ? '<span class="tp-eq">También: ' + esc(eq.join(', ')) + '</span>' : '') + '</th>' +
            '<td class="pg-izq tp-vel">' + (p.tipo ? esc(p.tipo) : '<span class="tp-guion">—</span>') + '</td>' +
            '<td class="tp-col-pts">' + celdaPuntos(p) + '</td></tr>';
        }).join(''));
    });

    document.getElementById('tp-grid').innerHTML = html || '<div class="pg-vacio in-glass">Ningún servicio coincide con la búsqueda</div>';
    document.getElementById('tp-resumen').textContent = q ? vistos + ' de ' + productos.length + ' servicios' : productos.length + ' servicios';
  }

  function error(msg) {
    document.getElementById('tp-grid').innerHTML = '<div class="pg-vacio in-glass">' + esc(msg) + '</div>';
  }

  document.getElementById('tp-buscar').addEventListener('input', pintar);
  document.getElementById('tp-grid').innerHTML = '<div class="pg-vacio in-glass">Cargando el catálogo…</div>';
  fetch('/api/productos', { credentials: 'include' })
    .then(function (r) { if (!r.ok) throw new Error('No se pudo cargar el catálogo (' + r.status + ')'); return r.json(); })
    .then(function (d) {
      // Solo los activos: los mismos que se pueden elegir en el formulario.
      productos = (d.productos || []).filter(function (p) { return p.activo !== false && p.activo !== 0; });
      especiales = d.reglas_especiales || [];
      pintar();
    })
    .catch(function (e) { error(e.message || 'No se pudo cargar el catálogo'); });
})();
</script>
</body>
</html>
