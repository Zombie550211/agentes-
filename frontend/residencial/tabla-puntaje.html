  <section class="pg-barra in-glass" aria-label="Tabla de puntaje">

  <div class="tp-leyenda" aria-label="Leyenda de puntos">

    ] },

    ] },
    { cat: "Zipl fiber", filas: [
      ["Zipl fiber 10GIG", "Zipl fiber 10GIG", "Zipl fiber 10GIG", "1.25"],
      ["Zipl fiber 5GIG", "Zipl fiber 5GIG", "Zipl fiber 5GIG", "1.25"],

    ] },
    { cat: "Windstream/Kinetic", filas: [
      ["Windstream/Kinetic", "DEBAJO DE 499MBPS", "Menos de 499 Mbps", "1.00"],
      ["Windstream/Kinetic", "500 A 999MBPS", "500-999 Mbps", "1.00"],

    ] },

    ] },
    { cat: "Brightspeed", filas: [
      ["Brightspeed", "900MBPS+", "900 Mbps o más", "1.00"],
      ["Brightspeed", "100-899MBPS", "100-899 Mbps", "1.00"],
      ["Brightspeed", "40-99MBPS", "40-99 Mbps", "0.35"],

    ] },
    { cat: "Earthlink", filas: [

    ] },

    ] },
    { cat: "Altafiber - Cincinnati Bell (Productos Adicionales)", filas: [
      ["Altafiber", "800MB - 1GB", "800-1000 Mbps", "0.35"],

    ] },
    { cat: "HughesNet", filas: [

    ] },
    { cat: "OPTIMUM", filas: [
      ["Optimum", "BROADBAND 5 GBPS", "5,000 Mbps", "1.25"],
      ["Optimum", "BROADBAND 2 GBPS", "2,000 Mbps", "1.25"],
      ["Optimum", "BROADBAND 1 GBPS", "1,000 Mbps", "1.00"],

    ] },
    { cat: "EXTRAS NO APLICAN PARA PUNTAJE", filas: [
      ["Extras", "VIVINT", "---", "N/A"],
      ["Extras", "LINEAS TELEFONICA AT&T", "---", "N/A"],
      ["Extras", "LINEAS TELEFONICA SPECTRUM", "---", "N/A"],
      ["Extras", "VIDEO EXTRA DE SPECTRUM", "---", "N/A"]
    ] },
    { cat: "DIRECTV (Productos Adicionales)", filas: [
      ["DIRECTV", "Low", "Low", "1.00"],
      ["DIRECTV", "Medium", "Medium", "0.35"]
    ] },
    { cat: "SPECTRUM (Productos Adicionales)", filas: [
      ["Spectrum", "2 GIGA", "2,000 Mbps", "1.25"],
      ["Spectrum", "1 GIGA", "1,000 Mbps", "1.00"],
      ["Spectrum", "PREMIER", "Premier", "1.00"],
      ["Spectrum", "ADVANTAGE", "Standard", "0.35"],
      ["Spectrum", "400 mbps", "400 Mbps", "1.00"]
    ] },
    { cat: "MOBILITY", filas: [
      ["Mobility", "UNLIMITED PLUS FIRST LINE", "---", "0.25"],
      ["Mobility", "UNLIMITED PLUS LINES 2 +", "---", "1.00"],
      ["Mobility", "UNLIMITED LINES 2 +", "---", "0.35"]
    ] },
    { cat: "VIDEO", filas: [
      ["Video", "SELECT", "---", "0.35"],
      ["Video", "ADDITIONAL", "---", "N/A"],
      ["Video", "DOUBLE PLAY", "---", "0.25"],
      ["Video", "TRIPLE PLAY", "---", "0.35"]
    ] }
  ];

  function esc(s) { return String(s == null ? '' : s).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;'); }
  function norm(s) { try { return String(s || '').normalize('NFD').replace(/[\u0300-\u036f]/g, '').toLowerCase(); } catch (e) { return String(s || '').toLowerCase(); } }
  function nivel(p) {
    var n = parseFloat(p);
    if (isNaN(n)) return 'tp-na';
    return n >= 1.25 ? 'tp-alto' : n >= 0.7 ? 'tp-medio' : 'tp-bajo';
  }
  function sinDato(v) { return !v || /^-+$/.test(v); }

  function pintar() {
    var q = norm(document.getElementById('tp-buscar').value.trim());
    var html = '', vistos = 0, total = 0;
    PUNTAJES.forEach(function (c) {
      total += c.filas.length;
      var filas = c.filas.filter(function (r) { return !q || norm(c.cat + ' ' + r.join(' ')).indexOf(q) >= 0; });
      if (!filas.length) return;
      vistos += filas.length;
      // La columna de proveedor sólo hace falta si en la categoría hay más de uno.
      var varios = c.filas.some(function (r) { return r[0] !== c.filas[0][0]; });
      html += '<section class="pg-card in-glass tp-card"><div class="pg-card-head"><h2>' + esc(c.cat) + '</h2>' +
        '<span class="pg-chip">' + filas.length + (filas.length === 1 ? ' producto' : ' productos') + '</span></div>' +
        '<table class="pg-tbl tp-tbl"><thead><tr>' + (varios ? '<th scope="col" class="pg-izq">Proveedor</th>' : '') +
        '<th scope="col" class="pg-izq">Producto</th><th scope="col" class="pg-izq">Velocidad</th><th scope="col" class="tp-col-pts">Puntos</th></tr></thead><tbody>' +
        filas.map(function (r) {
          return '<tr>' + (varios ? '<td class="pg-izq tp-prov">' + esc(r[0]) + '</td>' : '') +
            '<th scope="row" class="pg-izq tp-prod">' + esc(r[1]) + '</th>' +
            '<td class="pg-izq tp-vel">' + (sinDato(r[2]) ? '<span class="tp-guion">—</span>' : esc(r[2])) + '</td>' +
            '<td class="tp-col-pts"><span class="tp-pts ' + nivel(r[3]) + '">' + esc(r[3]) + '</span></td></tr>';
        }).join('') + '</tbody></table></section>';
    });
    document.getElementById('tp-grid').innerHTML = html || '<div class="pg-vacio in-glass">Ningún producto coincide con la búsqueda</div>';
    document.getElementById('tp-resumen').textContent = q ? vistos + ' de ' + total + ' productos' : total + ' productos';
  }

  document.getElementById('tp-buscar').addEventListener('input', pintar);
  pintar();
})();
</script>
</body>
</html>
