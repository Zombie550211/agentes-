<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Tiempo laboral · Administración</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/tiempo-laboral.css?v=20261009a">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <section class="pg-barra in-glass" aria-label="Tiempo laboral">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-clock" aria-hidden="true"></i></span>
      <div>
        <h1>Tiempo laboral</h1>
        <p>Antigüedad de cada agente por equipo, calculada desde su fecha de ingreso (se carga en Permisos → Usuarios → Editar perfil)</p>
      </div>
    </div>
  </section>

  <div id="tl-content"><div class="pg-vacio in-glass">Cargando…</div></div>

</div>
</div>

<script src="/js/layout/topnav.js?v=20261008c" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261009a" defer></script>
<script>
(function(){
  'use strict';
  var currentUser=null;

  function esc(s){ var d=document.createElement('div'); d.textContent=String(s==null?'':s); return d.innerHTML; }

  function normTok(label){
    var n=String(label||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    return n.replace(/^\s*team\s+/,'').replace(/[^a-z0-9]/g,'');
  }

  function isAdminOrBO(role){
    var r=String(role||'').toLowerCase();
    return r==='admin'||r==='administrador'||r.includes('backoffice');
  }

  function tenureText(fecha){
    if(!fecha) return 'Sin fecha';
    var d=new Date(String(fecha).slice(0,10)+'T00:00:00');
    if(isNaN(d.getTime())) return 'Sin fecha';
    var days=Math.floor((Date.now()-d.getTime())/86400000);
    if(days<0) return 'Sin fecha';
    if(days<30) return days<=0?'Hoy':(days+(days===1?' día':' días'));
    var months=Math.floor(days/30.44);
    if(months<12) return months+(months===1?' mes':' meses');
    var years=Math.floor(months/12);
    var remMonths=months%12;
    var yTxt=years+(years===1?' año':' años');
    return remMonths?(yTxt+' '+remMonths+(remMonths===1?' mes':' meses')):yTxt;
  }

  async function loadCurrentUser(){
    try{
      var r=await fetch('/api/auth/verify-server',{credentials:'include'});
      if(!r.ok) return;
      var j=await r.json();
      if(j&&j.authenticated) currentUser=j.user||j;
    }catch(e){ console.warn('[tl] user',e); }
  }

  async function loadTeams(){
    var r;
    try{ r=await fetch('/api/users/admin-list',{credentials:'include'}); }
    catch(e){ return {error:'network'}; }
    if(r.status===403) return {error:'forbidden'};
    var j=await r.json();
    var users=j.users||j.agents||[];
    var byTeam={};
    users.forEach(function(u){
      var active=(u.active===undefined||u.active===null||u.active===1||u.active===true||u.active==='1');
      if(!active) return;
      var role=String(u.role||'').toLowerCase();
      if(/supervisor|admin|backoffice/.test(role)) return;
      if(!/agente|vendedor|agent|seller/.test(role)) return;
      var label=String(u.team||'').trim();
      if(!label) return;
      var tok=normTok(label);
      if(!tok||/backoffice|icon|usa|administra|monitoreo/.test(tok)) return;
      if(!byTeam[tok]) byTeam[tok]={token:tok,label:label,agents:[],lineas:/linea/.test(tok)};
      byTeam[tok].agents.push({name:(u.name||u.username||'').trim(),fecha:u.fecha_ingreso||''});
    });
    var teams=Object.values(byTeam).sort(function(a,b){
      if(a.lineas!==b.lineas) return a.lineas?1:-1;
      return a.label.localeCompare(b.label);
    });
    teams.forEach(function(t){ t.agents.sort(function(a,b){ return a.name.localeCompare(b.name); }); });
    return {teams:teams};
  }

  function teamCard(t){
    var rows=t.agents.map(function(a){
      var sin=tenureText(a.fecha)==='Sin fecha';
      return '<tr><th scope="row" class="pg-izq tl-nom">'+esc(a.name)+'</th><td class="pg-n"><span class="pg-chip'+(sin?' pg-chip-gris':'')+'">'+esc(tenureText(a.fecha))+'</span></td></tr>';
    }).join('');
    return '<section class="pg-card in-glass tl-team">'
      +'<div class="pg-card-head"><h2><i class="ph ph-users-three" aria-hidden="true"></i>'+esc(t.label)+'</h2>'
        +'<span class="pg-chip">'+t.agents.length+(t.agents.length===1?' agente':' agentes')+'</span></div>'
      +'<table class="pg-tbl tl-tbl"><thead><tr><th scope="col" class="pg-izq">Agente</th><th scope="col">Antigüedad</th></tr></thead>'
      +'<tbody>'+(rows||'<tr><td colspan="2" class="pg-vacio">Sin agentes</td></tr>')+'</tbody>'
      +'<tfoot><tr><th scope="row" class="pg-izq">Total de agentes</th><td class="pg-n">'+t.agents.length+'</td></tr></tfoot>'
      +'</table>'
    +'</section>';
  }

  (async function init(){
    await loadCurrentUser();
    if(!currentUser||!isAdminOrBO(currentUser.role)){
      document.getElementById('tl-content').innerHTML='<div class="pg-vacio in-glass"><i class="ph ph-key" aria-hidden="true"></i>Acceso restringido: solo administradores y Back Office pueden ver esta página</div>';
      return;
    }
    var box=document.getElementById('tl-content');
    var res=await loadTeams();
    if(res.error){
      box.innerHTML='<div class="pg-vacio in-glass">'+(res.error==='forbidden'?'Solo administradores y Back Office pueden ver esta página':'Error de conexión')+'</div>';
      return;
    }
    if(!res.teams.length){
      box.innerHTML='<div class="pg-vacio in-glass">Sin equipos para mostrar</div>';
      return;
    }
    box.innerHTML='<div class="tl-teams">'+res.teams.map(teamCard).join('')+'</div>';
  })();
})();
</script>
</body>
</html>
