<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gestión Multimedia - CRM</title>
  <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
  <link rel="stylesheet" href="/css/base/theme.css?v=20251124f">
  
  <!-- Font Awesome -->
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">
  
  <!-- Custom CSS -->
  
  <!-- Scripts -->
  <script src="/js/core/fetch-interceptor.js"></script>
  <script src="/agentes/js/auth-check.js"></script>
  <script src="/js/core/logout-handler.js"></script>
  <script src="/js/core/user-info.js"></script>
  
  <!-- Sistema de Inactividad -->
  <script src="/js/core/crm-config.js"></script>
  <script src="/js/core/inactivity-manager.js?v=20260611a"></script>
  <script src="/js/core/crm-init.js"></script>
  
  <link rel="stylesheet" href="/css/residencial/multimedia.css">
  <link rel="stylesheet" href="/css/componentes/sidebar-static.css?v=2">
  <link rel="stylesheet" href="/css/base/form-controls.css?v=20260921">
</head>
<body>
  <script src="/js/core/theme-init.js"></script>
  <script src="/js/layout/sidebar.js" defer></script>
  <script src="/js/layout/sidebar-ui.js" defer></script>
  <script src="/js/componentes/llamadas-bloqueo.js" defer></script>
  <script src="/js/layout/sidebar-user.js" defer></script>
  <div class="layout">
    <!-- SIDEBAR (cargado dinámicamente, estilo unificado) -->
    <nav class="sidebar" id="app-sidebar"></nav>
    
    <main class="main-content">
      <div class="multimedia-container">
        <!-- Page Header -->
        <div class="page-header">
          <div class="page-title">
            <div class="page-icon">
              <i class="fas fa-photo-video"></i>
            </div>
            <div>
              <h1>Gestión Multimedia</h1>
              <p class="page-subtitle">Sube y gestiona imágenes, GIFs y videos para tu CRM</p>
            </div>
          </div>
        </div>

        <!-- Upload Section -->
        <div class="upload-section">
          <div class="upload-area" id="uploadArea">
            <div class="upload-icon">
              <i class="fas fa-cloud-upload-alt"></i>
            </div>
            <div class="upload-text">
              <h3>Arrastra archivos aquí o haz clic para seleccionar</h3>
              <p>Sube imágenes, GIFs y videos para usar en tu CRM</p>
              <button class="upload-button" onclick="document.getElementById('fileInput').click()">
                <i class="fas fa-plus"></i> Seleccionar Archivos
              </button>
            </div>
            <input type="file" id="fileInput" class="file-input" multiple accept="image/*,video/*,.gif">
            
            <div class="supported-formats">
              <div class="format-tags">
                <span class="format-tag">📷 JPG</span>
                <span class="format-tag">📷 PNG</span>
                <span class="format-tag">🎬 GIF</span>
                <span class="format-tag">🎥 MP4</span>
                <span class="format-tag">🎥 MOV</span>
                <span class="format-tag">🎥 AVI</span>
              </div>
            </div>
          </div>

          <div class="upload-progress" id="uploadProgress">
            <div class="progress-bar">
              <div class="progress-fill" id="progressFill"></div>
            </div>
            <div class="progress-text" id="progressText">Subiendo archivos...</div>
          </div>
        </div>

        <!-- Gallery Section -->
        <div class="gallery-section">
          <div class="gallery-header">
            <h2 class="gallery-title">Galería Multimedia</h2>
            <div class="gallery-filters">
              <button class="filter-btn active" data-filter="all">Todos</button>
              <button class="filter-btn" data-filter="image">Imágenes</button>
              <button class="filter-btn" data-filter="gif">GIFs</button>
              <button class="filter-btn" data-filter="video">Videos</button>
            </div>
          </div>

          <div class="gallery-grid" id="galleryGrid">
            <!-- Los archivos multimedia se cargarán aquí dinámicamente -->
          </div>
        </div>
      </div>
    </main>

    <!-- Modal para vista previa -->
    <div class="modal" id="previewModal">
      <div class="modal-content">
        <div class="modal-header">
          <h3 id="modalTitle">Vista Previa</h3>
          <button class="modal-close" onclick="closeModal()">&times;</button>
        </div>
        <div id="modalBody">
          <!-- Contenido del modal se carga aquí -->
        </div>
      </div>
    </div>
  </div>

  <!-- Scripts de sidebar unificado -->
  <script src="/js/core/auth-logout.js"></script>
  <script src="/js/core/user-info-updater.js"></script>

  <script>
    // ========== PRECALENTAMIENTO DE MULTIMEDIA (FAST PATH) ==========
    function tryLoadFromPrecachedMultimedia() {
      try {
        const storedData = sessionStorage.getItem('multimediaData');
        const storedTimestamp = sessionStorage.getItem('multimediaTimestamp');
        
        if (!storedData || !storedTimestamp) {
          return null;
        }

        const cacheAge = Date.now() - new Date(storedTimestamp).getTime();
        const TTL = 5 * 60 * 1000;
        
        if (cacheAge > TTL) {
          sessionStorage.removeItem('multimediaData');
          sessionStorage.removeItem('multimediaTimestamp');
          return null;
        }

        const data = JSON.parse(storedData);
        return { success: true, data: data, fromCache: true, loadTime: 0 };
      } catch (e) {
        console.warn('[PRECACHE-MULTIMEDIA] ⚠️ Error procesando caché:', e?.message);
        return null;
      }
    }

    window.addEventListener('multimediaPreheated', (event) => {
      sessionStorage.setItem('multimediaData', JSON.stringify(event.detail));
      window.__precachedMultimediaData = event.detail;
    });

    // Variables globales
    let uploadedFiles = [];
    let currentFilter = 'all';

    // Inicialización
    document.addEventListener('DOMContentLoaded', function() {
      // Intentar cargar datos del caché primero
      const cachedMultimedia = tryLoadFromPrecachedMultimedia();
      if (cachedMultimedia) {
        window.__precachedMultimediaData = cachedMultimedia.data;
      }
      
      initializeUpload();
      loadGallery();
      initializeFilters();
    });

    // Inicializar funcionalidad de upload
    function initializeUpload() {
      const uploadArea = document.getElementById('uploadArea');
      const fileInput = document.getElementById('fileInput');

      // Drag and drop
      uploadArea.addEventListener('dragover', handleDragOver);
      uploadArea.addEventListener('dragleave', handleDragLeave);
      uploadArea.addEventListener('drop', handleDrop);

      // File input change
      fileInput.addEventListener('change', handleFileSelect);
    }

    function handleDragOver(e) {
      e.preventDefault();
      e.currentTarget.classList.add('dragover');
    }

    function handleDragLeave(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
    }

    function handleDrop(e) {
      e.preventDefault();
      e.currentTarget.classList.remove('dragover');
      const files = Array.from(e.dataTransfer.files);
      uploadFiles(files);
    }

    function handleFileSelect(e) {
      const files = Array.from(e.target.files);
      uploadFiles(files);
    }

    // Subir archivos
    async function uploadFiles(files) {
      if (files.length === 0) return;

      const validFiles = files.filter(file => {
        const validTypes = ['image/jpeg', 'image/png', 'image/gif', 'video/mp4', 'video/mov', 'video/avi'];
        return validTypes.includes(file.type);
      });

      if (validFiles.length === 0) {
        alert('Por favor selecciona archivos válidos (JPG, PNG, GIF, MP4, MOV, AVI)');
        return;
      }

      showUploadProgress();

      for (let i = 0; i < validFiles.length; i++) {
        const file = validFiles[i];
        await uploadSingleFile(file, i + 1, validFiles.length);
      }

      hideUploadProgress();
      loadGallery();
    }

    async function uploadSingleFile(file, current, total) {
      const formData = new FormData();
      formData.append('file', file);

      try {
        updateProgress((current / total) * 100, `Subiendo ${file.name} (${current}/${total})`);

        const response = await fetch('/api/upload', {
          method: 'POST',
          body: formData,
          credentials: 'include'
        });

        if (!response.ok) {
          throw new Error(`Error subiendo ${file.name}`);
        }

        const result = await response.json();

      } catch (error) {
        console.error('Error:', error);
        alert(`Error subiendo ${file.name}: ${error.message}`);
      }
    }

    function showUploadProgress() {
      document.getElementById('uploadProgress').style.display = 'block';
    }

    function hideUploadProgress() {
      document.getElementById('uploadProgress').style.display = 'none';
      updateProgress(0, '');
    }

    function updateProgress(percent, text) {
      document.getElementById('progressFill').style.width = percent + '%';
      document.getElementById('progressText').textContent = text;
    }

    // Cargar galería
    async function loadGallery() {
      try {
        const response = await fetch('/api/media', {
          method: 'GET',
          credentials: 'include'
        });

        if (response.ok) {
          const files = await response.json();
          uploadedFiles = files;
          renderGallery();
        }
      } catch (error) {
        console.error('Error cargando galería:', error);
      }
    }

    function renderGallery() {
      const grid = document.getElementById('galleryGrid');
      const filteredFiles = currentFilter === 'all' 
        ? uploadedFiles 
        : uploadedFiles.filter(file => getFileType(file.type) === currentFilter);

      if (filteredFiles.length === 0) {
        grid.innerHTML = '<p style="text-align: center; color: #718096; grid-column: 1/-1;">No hay archivos para mostrar</p>';
        return;
      }

      grid.innerHTML = filteredFiles.map(file => `
        <div class="media-item">
          <div class="media-preview">
            ${renderMediaPreview(file)}
            <div class="media-type-icon">
              <i class="fas fa-${getFileIcon(file.type)}"></i>
            </div>
          </div>
          <div class="media-info">
            <div class="media-name">${file.name}</div>
            <div class="media-details">
              ${formatFileSize(file.size)} • ${new Date(file.uploadDate).toLocaleDateString()}
            </div>
            <div class="media-actions">
              <button class="action-btn btn-view" onclick="viewFile('${file.id}')">
                <i class="fas fa-eye"></i> Ver
              </button>
              <button class="action-btn btn-copy" onclick="copyUrl('${file.url}')">
                <i class="fas fa-copy"></i> Copiar
              </button>
              <button class="action-btn btn-delete" onclick="deleteFile('${file.id}')">
                <i class="fas fa-trash"></i> Borrar
              </button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function _resolveMediaUrl(u) {
      if (!u) return '';
      if (u.startsWith('http://') || u.startsWith('https://')) return u;
      return u.startsWith('/') ? u : '/' + u;
    }

    function renderMediaPreview(file) {
      const type = getFileType(file.type);
      const url = _resolveMediaUrl(file.url);
      if (type === 'image' || type === 'gif') {
        return `<img src="${url}" alt="${file.name}">`;
      } else if (type === 'video') {
        return `<video src="${url}" muted></video>`;
      }

      return `<i class="fas fa-file" style="font-size: 3rem; color: #cbd5e0;"></i>`;
    }

    function getFileType(mimeType) {
      if (mimeType.startsWith('image/')) {
        return mimeType === 'image/gif' ? 'gif' : 'image';
      } else if (mimeType.startsWith('video/')) {
        return 'video';
      }
      return 'other';
    }

    function getFileIcon(mimeType) {
      const type = getFileType(mimeType);
      switch (type) {
        case 'image': return 'image';
        case 'gif': return 'file-image';
        case 'video': return 'video';
        default: return 'file';
      }
    }

    function formatFileSize(bytes) {
      if (bytes === 0) return '0 Bytes';
      const k = 1024;
      const sizes = ['Bytes', 'KB', 'MB', 'GB'];
      const i = Math.floor(Math.log(bytes) / Math.log(k));
      return parseFloat((bytes / Math.pow(k, i)).toFixed(2)) + ' ' + sizes[i];
    }

    // Filtros
    function initializeFilters() {
      const filterBtns = document.querySelectorAll('.filter-btn');
      filterBtns.forEach(btn => {
        btn.addEventListener('click', function() {
          filterBtns.forEach(b => b.classList.remove('active'));
          this.classList.add('active');
          currentFilter = this.dataset.filter;
          renderGallery();
        });
      });
    }

    // Acciones de archivos
    function viewFile(fileId) {
      const file = uploadedFiles.find(f => f.id === fileId);
      if (!file) return;

      const modal = document.getElementById('previewModal');
      const modalTitle = document.getElementById('modalTitle');
      const modalBody = document.getElementById('modalBody');

      modalTitle.textContent = file.name;
      
      const type = getFileType(file.type);
      if (type === 'image' || type === 'gif') {
        modalBody.innerHTML = `<img src="${_resolveMediaUrl(file.url)}" class="modal-media" alt="${file.name}">`;
      } else if (type === 'video') {
        modalBody.innerHTML = `<video src="${_resolveMediaUrl(file.url)}" class="modal-media" controls></video>`;
      }

      modal.style.display = 'block';
    }

    function copyUrl(url) {
      navigator.clipboard.writeText(url).then(() => {
        alert('URL copiada al portapapeles');
      }).catch(() => {
        alert('Error copiando URL');
      });
    }

    async function deleteFile(fileId) {
      if (!confirm('¿Estás seguro de que quieres eliminar este archivo?')) return;

      try {
        const response = await fetch(`/api/media/${fileId}`, {
          method: 'DELETE',
          credentials: 'include'
        });

        if (response.ok) {
          loadGallery();
        } else {
          alert('Error eliminando archivo');
        }
      } catch (error) {
        console.error('Error:', error);
        alert('Error eliminando archivo');
      }
    }

    function closeModal() {
      document.getElementById('previewModal').style.display = 'none';
    }

    // Cerrar modal al hacer clic fuera
    window.onclick = function(event) {
      const modal = document.getElementById('previewModal');
      if (event.target === modal) {
        closeModal();
      }
    }
  </script>
</body>
</html>
