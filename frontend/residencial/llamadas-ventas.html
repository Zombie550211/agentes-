  <!-- ══ Sección (Residencial / Líneas) y día ══ -->
  <section class="lv-barra in-glass" aria-label="Sección y fecha">
    <div class="lv-tabs" role="tablist" aria-label="Sección">

  <!-- ══ Residencial ══ -->

    <div class="lv-tiles">
      <div class="lv-tile in-glass"><span class="lv-ico"><i class="ph ph-phone-call"></i></span><div class="lv-tile-val" id="kpi-llamadas-tot">0</div><div class="lv-tile-lbl">Llamadas totales</div></div>

      <div class="lv-tile lv-edit in-glass"><span class="lv-ico lv-ico-rojo"><i class="ph ph-phone-x"></i></span>

      <div class="lv-tile lv-edit in-glass"><span class="lv-ico lv-ico-verde"><i class="ph ph-trend-up"></i></span>

        <div class="lv-tile-lbl">Ventas <span class="lv-adj" id="adj-ventas" title="Ajustado manualmente — borra el campo para volver al automático">ajuste</span></div></div>
      <div class="lv-tile in-glass"><span class="lv-ico"><i class="ph ph-target"></i></span><div class="lv-tile-val" id="kpi-puntos">0.00</div><div class="lv-tile-lbl">Puntos</div></div>
      <div class="lv-tile lv-tile-dest in-glass"><span class="lv-ico"><i class="ph ph-calculator"></i></span><div class="lv-tile-val" id="kpi-costo">$0.00</div><div class="lv-tile-lbl">Costo por venta</div></div>
    </div>
    <div id="lv-content-resi"><div class="lv-loading">Cargando…</div></div>

  <!-- ══ Líneas ══ -->
  <section class="lv-sec" id="lv-sec-lin" role="tabpanel" aria-labelledby="lv-tab-lin" hidden>
    <div class="lv-tiles">
      <div class="lv-tile in-glass"><span class="lv-ico"><i class="ph ph-phone-call"></i></span><div class="lv-tile-val" id="kpi-llamadas-tot-lin">0</div><div class="lv-tile-lbl">Llamadas totales</div></div>
      <div class="lv-tile in-glass"><span class="lv-ico"><i class="ph ph-phone"></i></span><div class="lv-tile-val" id="kpi-atendidas-lin">0</div><div class="lv-tile-lbl">Llamadas atendidas</div></div>
      <div class="lv-tile lv-edit in-glass"><span class="lv-ico lv-ico-rojo"><i class="ph ph-phone-x"></i></span>
        <input type="number" min="0" id="kpi-perdidas-lin" value="0" aria-label="Llamadas perdidas de Líneas (editable)" title="Editable — se guarda al salir de la celda"/>
        <div class="lv-tile-lbl">Llamadas perdidas <i class="ph ph-pencil-simple" aria-hidden="true"></i></div></div>
      <div class="lv-tile lv-edit in-glass"><span class="lv-ico"><i class="ph ph-currency-dollar"></i></span>

        <div class="lv-tile-lbl">Ventas <span class="lv-adj" id="adj-ventas-lin" title="Ajustado manualmente — borra el campo para volver al automático">ajuste</span></div></div>
      <div class="lv-tile in-glass"><span class="lv-ico"><i class="ph ph-target"></i></span><div class="lv-tile-val" id="kpi-puntos-lin">0.00</div><div class="lv-tile-lbl">Puntos</div></div>
      <div class="lv-tile lv-tile-dest in-glass"><span class="lv-ico"><i class="ph ph-calculator"></i></span><div class="lv-tile-val" id="kpi-costo-lin">$0.00</div><div class="lv-tile-lbl">Costo por venta</div></div>
    </div>
    <div id="lv-content-lin"><div class="lv-loading">Cargando…</div></div>
  </section>

<script>
  // Pestañas Residencial / Líneas (con teclado: ← →)
  (function () {
    var tabs = [document.getElementById('lv-tab-resi'), document.getElementById('lv-tab-lin')];
    function elegir(t, foco) {
      tabs.forEach(function (x) {
        var on = x === t;
        x.setAttribute('aria-selected', String(on));
        x.tabIndex = on ? 0 : -1;
        document.getElementById(x.getAttribute('aria-controls')).hidden = !on;
      });
      if (foco) t.focus();
      try { sessionStorage.setItem('lv-seccion', t.id); } catch (e) {}
    }
    tabs.forEach(function (t, i) {
      t.addEventListener('click', function () { elegir(t); });
      t.addEventListener('keydown', function (e) {
        if (e.key === 'ArrowRight' || e.key === 'ArrowLeft') { e.preventDefault(); elegir(tabs[(i + 1) % 2], true); }
      });
    });
    try { var g = sessionStorage.getItem('lv-seccion'); if (g && document.getElementById(g)) elegir(document.getElementById(g)); } catch (e) {}
  })();
</script>

<script>
(function(){
  'use strict';
  var API='/api/llamadas-ventas-excel';
  var DIAS=['Domingo','Lunes','Martes','Miércoles','Jueves','Viernes','Sábado'];
  var MESES=['enero','febrero','marzo','abril','mayo','junio','julio','agosto','septiembre','octubre','noviembre','diciembre'];

  var sel=new Date(); sel.setHours(0,0,0,0);
  var currentUser=null;
  var teams=[];
  var sheetsByDate={};
  var currentSheetId=null;
  var cells={};
  var globals={perdidas:0,inversion:0,perdidasLin:0,inversionLin:0};
  var puntos={resi:0,lin:0};
  var ventasOff={resi:0,lin:0};   // ajuste del KPI Ventas como DESPLAZAMIENTO (0 = sin ajuste).
  // Si auto=8 y el admin escribe 4, se guarda -4: las ventas nuevas siguen contando (5, 6, ...).
  var ventasAuto={resi:{},lin:{},totalResi:0,totalLin:0};   // ventas reales del CRM por agente
  var creatingSheet=null;

  function esc(s){var d=document.createElement('div');d.textContent=String(s==null?'':s);return d.innerHTML;}
  function initials(n){return String(n||'').split(/\s+/).filter(Boolean).map(function(w){return w[0];}).join('').toUpperCase().slice(0,2)||'?';}
  function normTok(label){
    var n=String(label||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase();
    return n.replace(/^\s*team\s+/,'').replace(/[^a-z0-9]/g,'');
  }
  function dateKey(d,m,y){return d+'/'+m+'/'+y;}
  function normName(s){
    var n=String(s||'');
    try{n=n.normalize('NFD').replace(/[\u0300-\u036f]/g,'');}catch(_){}
    return n.replace(/[._]+/g,' ').replace(/\s+/g,' ').trim().toLowerCase();
  }
  function pad(n){return String(n).padStart(2,'0');}
  function ymdInput(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());}
  function fmtUSD(n){return '$'+(Math.round(n*100)/100).toLocaleString('en-US',{minimumFractionDigits:2,maximumFractionDigits:2});}

  function parseSheetName(name){
    var p=String(name||'').split('/');
    if(p.length!==3)return null;
    var mo=parseInt(p[0],10),d=parseInt(p[1],10),y=parseInt(p[2],10);
    if(!mo||!d||!y||mo>12||d>31)return null;
    return {day:d,month:mo,year:y};
  }
  function normalizeTeamToken(label){
    return String(label||'').normalize('NFD').replace(/[̀-ͯ]/g,'').toLowerCase().replace(/^\s*team\s+/,'').replace(/[^a-z0-9]/g,'');
  }
  async function loadCurrentUser(){
    try{
      var r=await fetch('/api/auth/verify-server',{credentials:'include'});
      if(!r.ok)return;
      var j=await r.json();
      if(j&&j.authenticated) currentUser=j.user||j;
    }catch(e){console.warn('[lv] user',e);}
  }

  /* ── carga inicial ── */
  async function loadTeams(){
    try{
      var r=await fetch('/api/users/agents',{credentials:'include'});
      var j=await r.json();
      var byTeam={};
      var isSupervisor=!!(currentUser && /supervisor/.test(String(currentUser.role||'').toLowerCase()));
      var allowedTeamToken='';
      if(isSupervisor){
        allowedTeamToken=normalizeTeamToken(currentUser.team || currentUser.equipo || '');
      }
      (j.agents||[]).forEach(function(u){
        var label=String(u.team||'').trim();
        if(!label)return;
        // Solo teams de venta (residencial y líneas): fuera administrativos
        if(/backoffice|icon|usa|administra|monitoreo/.test(normTok(label)))return;
        var role=String(u.role||'').toLowerCase();
        if(!/agente|vendedor|agent|seller|supervisor/.test(role))return;
        var tok=normTok(label); if(!tok)return;
        if(isSupervisor && allowedTeamToken && tok!==allowedTeamToken) return;
        if(!byTeam[tok])byTeam[tok]={token:tok,label:label,agents:[],lineas:/linea/.test(tok)};
        var nm=String(u.name||u.username||'').trim().toUpperCase();
        var un=String(u.username||'').trim().toUpperCase();
        if(nm&&!byTeam[tok].agents.some(function(a){return a.name===nm;})){
          byTeam[tok].agents.push({name:nm,uname:un,manual:false,sup:/supervisor/.test(role)});
        }
      });
      teams=Object.values(byTeam).sort(function(a,b){
        if(a.lineas!==b.lineas)return a.lineas?1:-1;
        return a.label.localeCompare(b.label);
      });
      teams.forEach(function(t){t.agents.sort(function(a,b){return (b.sup?1:0)-(a.sup?1:0)||a.name.localeCompare(b.name);});});
    }catch(e){console.warn('[lv] teams',e);teams=[];}
  }

  async function loadSheets(){
    sheetsByDate={};
    try{
      var r=await fetch(API+'/sheets',{credentials:'include'});
      if(r.status===403){
        ['lv-content-resi','lv-content-lin'].forEach(function(id){document.getElementById(id).innerHTML='<div class="lv-loading">Solo Admin / Back Office pueden ver esta página</div>';});
        return false;
      }
      var j=await r.json();
      (j.data||[]).forEach(function(sh){
        var p=parseSheetName(sh.name);
        if(p)sheetsByDate[dateKey(p.day,p.month,p.year)]={id:sh._id,name:sh.name};
      });
      return true;
    }catch(e){console.warn('[lv] sheets',e);return true;}
  }

  async function ensureSheet(){
    if(currentSheetId)return currentSheetId;
    if(creatingSheet)return creatingSheet;
    var d=sel.getDate(),m=sel.getMonth()+1,y=sel.getFullYear();
    creatingSheet=(async function(){
      try{
        var r=await fetch(API+'/sheets',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'include',
          body:JSON.stringify({name:m+'/'+d+'/'+y})});
        var j=await r.json();
        if(j.success&&j.data){
          sheetsByDate[dateKey(d,m,y)]={id:j.data._id,name:j.data.name};
          currentSheetId=j.data._id;
          return currentSheetId;
        }
      }catch(e){console.warn('[lv] createSheet',e);}
      return null;
    })();
    var id=await creatingSheet; creatingSheet=null;
    return id;
  }

  /* ── puntos del día por sección (automático desde las ventas del CRM) ── */
  async function loadPuntosDia(){
    puntos={resi:0,lin:0};
    try{
      var r=await fetch(API+'/puntos-dia?fecha='+ymdInput(sel),{credentials:'include'});
      var j=await r.json();
      if(j&&j.success){puntos.resi=parseFloat(j.resi)||0;puntos.lin=parseFloat(j.lineas)||0;}
    }catch(e){console.warn('[lv] puntos',e);}
    updateKpis();
  }

  /* ── ventas del día por agente (automático: cada venta que mandan al CRM) ── */
  async function loadVentasDia(){
    ventasAuto={resi:{},lin:{},totalResi:0,totalLin:0};
    try{
      var f=ymdInput(sel);
      var r=await fetch('/api/productividad?start='+f+'&end='+f,{credentials:'include'});
      var j=await r.json();
      if(j&&j.success){
        (j.residencial||[]).forEach(function(row){
          var k=normName(row.agente); if(!k)return;
          ventasAuto.resi[k]=(ventasAuto.resi[k]||0)+(row.n||0);
          ventasAuto.totalResi+=row.n||0;
        });
        (j.lineas||[]).forEach(function(row){
          var k=normName(row.agente); if(!k)return;
          ventasAuto.lin[k]=(ventasAuto.lin[k]||0)+(row.n||0);
          ventasAuto.totalLin+=row.n||0;
        });
      }
    }catch(e){console.warn('[lv] ventas',e);}
    // re-pintar la grilla: cada V se calcula con agentVentas (exacto+username+difuso)
    render();
  }
  function agentVentas(t,a){
    var map=t.lineas?ventasAuto.lin:ventasAuto.resi;
    var k1=normName(a.name);
    if(map[k1]!=null)return map[k1];
    var k2=normName(a.uname||'');
    if(k2&&map[k2]!=null)return map[k2];
    // Difuso: todas las palabras significativas del nombre corto deben estar
    // en el largo (ej. "emanuel velasquez" ⊆ "emanuel de jesus velasquez hernandez")
    var aw=k1.split(' ').filter(function(w){return w.length>2;});
    var found=0;
    Object.keys(map).forEach(function(k){
      if(found)return;
      var kw=k.split(' ').filter(function(w){return w.length>2;});
      if(aw.length<1||kw.length<1)return;
      var shorter=aw.length<=kw.length?aw:kw, longer=aw.length<=kw.length?kw:aw;
      if(shorter.length>=2&&shorter.every(function(w){return longer.indexOf(w)!==-1;}))found=map[k];
    });
    return found||0;
  }

  /* ── día seleccionado ── */
  async function loadDay(){
    // Reinicio completo del día: también Líneas y el ajuste de ventas (antes se arrastraban del día anterior)
    cells={};globals={perdidas:0,inversion:0,perdidasLin:0,inversionLin:0};ventasOff={resi:0,lin:0};
    teams.forEach(function(t){t.agents=t.agents.filter(function(a){return !a.manual;});});
    var key=dateKey(sel.getDate(),sel.getMonth()+1,sel.getFullYear());
    var sh=sheetsByDate[key];
    currentSheetId=sh?sh.id:null;
    if(sh){
      try{
        var r=await fetch(API+'/sheets/'+encodeURIComponent(sh.id),{credentials:'include'});
        var j=await r.json();
        if(j.success){
          (j.data||[]).forEach(function(c){
            if(c.kind==='cell'){
              var tok=String(c.team||'').trim(),person=String(c.person||'').trim().toUpperCase();
              var col=String(c.col||'').toUpperCase(),val=parseFloat(c.value)||0;
              if(tok==='GLOBAL'){
                if(col==='PERDIDAS')globals.perdidas=Math.round(val);
                else if(col==='INVERSION')globals.inversion=val;
                else if(col==='PERDIDAS_LIN')globals.perdidasLin=Math.round(val);
                else if(col==='INVERSION_LIN')globals.inversionLin=val;
                else if(col==='VENTAS_OFF')ventasOff.resi=Math.round(val);
                else if(col==='VENTAS_OFF_LIN')ventasOff.lin=Math.round(val);
                return;
              }
              if(!cells[tok])cells[tok]={};
              if(!cells[tok][person])cells[tok][person]={LL:0,CA:0,V:0};
              if(col==='LL'||col==='CA'||col==='V')cells[tok][person][col]=Math.round(val);
            } else if(c.kind==='summary'){
              var m=String(c.metric||'').toUpperCase();
              if(m==='PERDIDAS')globals.perdidas=parseInt(c.value,10)||0;
              else if(m==='INVERSION')globals.inversion=parseFloat(c.value)||0;
              else if(m==='PERDIDAS_LIN')globals.perdidasLin=parseInt(c.value,10)||0;
              else if(m==='INVERSION_LIN')globals.inversionLin=parseFloat(c.value)||0;
              else if(m==='VENTAS_OFF')ventasOff.resi=parseInt(c.value,10)||0;
              else if(m==='VENTAS_OFF_LIN')ventasOff.lin=parseInt(c.value,10)||0;
            }
          });
          (j.users||[]).forEach(function(u){
            var tok=String(u.team||'').trim(),nm=String(u.name||'').trim().toUpperCase();
            var t=teams.find(function(x){return x.token===tok;});
            if(t&&nm&&!t.agents.some(function(a){return a.name===nm;}))t.agents.push({name:nm,manual:true});
          });
        }
      }catch(e){console.warn('[lv] loadDay',e);}
    }
    var pInp=document.getElementById('kpi-perdidas');
    pInp.value=globals.perdidas; pInp.dataset.prev=globals.perdidas;
    var iInp=document.getElementById('kpi-inversion');
    iInp.value=globals.inversion||''; iInp.dataset.prev=globals.inversion;
    var pInp2=document.getElementById('kpi-perdidas-lin');
    pInp2.value=globals.perdidasLin; pInp2.dataset.prev=globals.perdidasLin;
    var iInp2=document.getElementById('kpi-inversion-lin');
    iInp2.value=globals.inversionLin||''; iInp2.dataset.prev=globals.inversionLin;
    render();
    loadPuntosDia();
    loadVentasDia();
  }

  /* ── render ── */
  function cellVal(tok,person,col){
    return (cells[tok]&&cells[tok][person]&&cells[tok][person][col])||0;
  }
  function updateKpis(){
    // Llamadas atendidas (LL) separadas por sección según el team de cada celda
    var llResi=0,llLin=0;
    var linTokens={}; teams.forEach(function(t){ if(t.lineas)linTokens[t.token]=1; });
    Object.keys(cells).forEach(function(tok){
      if(tok==='GLOBAL')return;
      var suma=0;
      Object.keys(cells[tok]).forEach(function(p){ suma+=cells[tok][p].LL||0; });
      if(linTokens[tok])llLin+=suma; else llResi+=suma;
    });
    // KPI Ventas: automático + desplazamiento del admin (sigue contando ventas nuevas)
    var vResi=Math.max(0,(ventasAuto.totalResi||0)+(ventasOff.resi||0));
    var vLin=Math.max(0,(ventasAuto.totalLin||0)+(ventasOff.lin||0));
    // ── Residencial ──
    document.getElementById('kpi-atendidas').textContent=llResi;
    document.getElementById('kpi-llamadas-tot').textContent=llResi+(globals.perdidas||0);
    var vInp=document.getElementById('kpi-ventas');
    if(document.activeElement!==vInp)vInp.value=vResi;
    var adjR=document.getElementById('adj-ventas');
    adjR.classList.toggle('on',ventasOff.resi!==0);
    adjR.textContent='ajuste '+(ventasOff.resi>0?'+':'')+ventasOff.resi;
    document.getElementById('kpi-puntos').textContent=puntos.resi.toFixed(2);
    document.getElementById('kpi-costo').textContent=vResi>0?fmtUSD((globals.inversion||0)/vResi):'$0.00';
    // ── Líneas ──
    document.getElementById('kpi-atendidas-lin').textContent=llLin;
    document.getElementById('kpi-llamadas-tot-lin').textContent=llLin+(globals.perdidasLin||0);
    var vInp2=document.getElementById('kpi-ventas-lin');
    if(document.activeElement!==vInp2)vInp2.value=vLin;
    var adjL=document.getElementById('adj-ventas-lin');
    adjL.classList.toggle('on',ventasOff.lin!==0);
    adjL.textContent='ajuste '+(ventasOff.lin>0?'+':'')+ventasOff.lin;
    document.getElementById('kpi-puntos-lin').textContent=puntos.lin.toFixed(2);
    document.getElementById('kpi-costo-lin').textContent=vLin>0?fmtUSD((globals.inversionLin||0)/vLin):'$0.00';
    teams.forEach(function(t){
      var tl=0,tv=0;
      Object.keys(cells[t.token]||{}).forEach(function(p){tl+=cells[t.token][p].LL||0;});
      t.agents.forEach(function(a){tv+=agentVentas(t,a);});
      var chipL=document.getElementById('chip-ll-'+t.token),chipV=document.getElementById('chip-v-'+t.token);
      if(chipL)chipL.textContent=tl+' llamadas';
      if(chipV)chipV.textContent=tv+' ventas';
    });
  }
  function updateDayLabel(){
    var lbl=document.getElementById('lv-daylabel'); if(!lbl)return;
    lbl.textContent=
      DIAS[sel.getDay()]+' '+sel.getDate()+' de '+MESES[sel.getMonth()]+' de '+sel.getFullYear()+' · registro diario por agente';
  }

  function render(){
    updateDayLabel();
    var boxR=document.getElementById('lv-content-resi');
    var boxL=document.getElementById('lv-content-lin');
    if(!teams.length){
      boxR.innerHTML='<div class="lv-loading">No hay equipos configurados</div>';
      boxL.innerHTML='';
      return;
    }
    var teamCard=function(t){
      var rows=t.agents.map(function(a){
        var inp=function(col){
          var v=cellVal(t.token,a.name,col);
          return '<td><input type="number" min="0" class="lv-cell" value="'+(v||'')+'" placeholder="—" '+
            'data-tok="'+esc(t.token)+'" data-person="'+esc(a.name)+'" data-col="'+col+'" data-prev="'+(v||0)+'"/></td>';
        };
        // V es AUTOMÁTICA: las ventas que cada agente manda al CRM ese día
        var nv=agentVentas(t,a);
        var vCell='<td><span class="lv-vauto'+(nv>0?' has':'')+'" '+
          'title="Ventas registradas por el agente en el CRM (automático)">'+(nv||'—')+'</span></td>';
        return '<tr><td class="ag"><div class="lv-ag-wrap"><span class="lv-avatar">'+esc(initials(a.name))+'</span>'+
          '<span class="lv-agent-name">'+esc(a.name)+'</span>'+(a.sup?'<span class="lv-sup">SUP</span>':'')+'</div></td>'+
          inp('LL')+inp('CA')+vCell+'</tr>';
      }).join('');
      return '<div class="lv-team in-glass">'+
        '<div class="lv-team-head"><div class="lv-team-name">'+esc(t.label)+'</div>'+
          '<div class="lv-team-tot"><span class="lv-chip ll" id="chip-ll-'+esc(t.token)+'">0 llamadas</span>'+
          '<span class="lv-chip v" id="chip-v-'+esc(t.token)+'">0 ventas</span></div></div>'+
        '<div class="lv-team-scroll">'+
          (t.agents.length
            ? '<table class="lv-tbl"><colgroup><col class="c-ag"><col class="c-n"><col class="c-n"><col class="c-n"></colgroup>'+
              '<thead><tr><th>Agente</th><th title="Llamadas">LL</th><th title="Llamadas con cliente atendido">CA</th><th title="Automático: ventas registradas en el CRM">V <i class="ph ph-lightning" aria-hidden="true"></i></th></tr></thead><tbody>'+rows+'</tbody></table>'
            : '<div class="lv-empty-team">Sin agentes asignados</div>')+
        '</div></div>';
    };
    var resi=teams.filter(function(t){return !t.lineas;});
    var lin=teams.filter(function(t){return t.lineas;});
    boxR.innerHTML=resi.length?'<div class="lv-teams">'+resi.map(teamCard).join('')+'</div>':'<div class="lv-loading">Sin teams residenciales</div>';
    boxL.innerHTML=lin.length?'<div class="lv-teams">'+lin.map(teamCard).join('')+'</div>':'<div class="lv-loading">Sin teams de líneas</div>';

    document.querySelectorAll('.lv-cell').forEach(function(inp){
      inp.addEventListener('input',onCellInput);
      inp.addEventListener('blur',onCellBlur);
      inp.addEventListener('focus',function(){ this.select(); ensureSheet(); });
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur(); } });
    });
    updateKpis();
  }

  /* ── guardado: al salir de la celda o al cerrar la página ── */
  function onCellInput(){
    var tok=this.dataset.tok,person=this.dataset.person,col=this.dataset.col;
    var val=Math.max(0,parseInt(this.value,10)||0);
    if(!cells[tok])cells[tok]={};
    if(!cells[tok][person])cells[tok][person]={LL:0,CA:0,V:0};
    cells[tok][person][col]=val;
    updateKpis();
  }
  function onCellBlur(){
    var val=Math.max(0,parseInt(this.value,10)||0);
    if(String(val)===String(this.dataset.prev||0))return;
    this.dataset.prev=val;
    saveCell(this.dataset.tok,this.dataset.person,this.dataset.col,val,this);
  }
  async function saveCell(tok,person,col,val,inp){
    var sid=await ensureSheet();
    if(!sid)return;
    try{
      var r=await fetch(API+'/cell',{method:'POST',headers:{'Content-Type':'application/json'},
        credentials:'include',keepalive:true,
        body:JSON.stringify({sheetId:String(sid),team:tok,person:person,col:col,value:String(val)})});
      var j=await r.json();
      if(j.success&&inp){inp.classList.add('saved');setTimeout(function(){inp.classList.remove('saved');},900);}
    }catch(e){console.warn('[lv] saveCell',e);}
  }

  function bindGlobal(id,colName,prop,isFloat){
    var el=document.getElementById(id);
    el.addEventListener('input',function(){
      globals[prop]=Math.max(0,(isFloat?parseFloat(this.value):parseInt(this.value,10))||0);
      updateKpis();
    });
    el.addEventListener('focus',function(){ ensureSheet(); });
    el.addEventListener('blur',function(){
      var val=Math.max(0,(isFloat?parseFloat(this.value):parseInt(this.value,10))||0);
      if(String(val)===String(this.dataset.prev||''))return;
      this.dataset.prev=val;
      saveCell('GLOBAL','RESUMEN',colName,val,this);
    });
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur(); } });
  }
  bindGlobal('kpi-perdidas','PERDIDAS','perdidas',false);
  bindGlobal('kpi-inversion','INVERSION','inversion',true);
  bindGlobal('kpi-perdidas-lin','PERDIDAS_LIN','perdidasLin',false);
  bindGlobal('kpi-inversion-lin','INVERSION_LIN','inversionLin',true);

  // KPI Ventas: automático + ajuste como DESPLAZAMIENTO. Si auto=8 y el admin
  // escribe 4, se guarda -4 y las ventas nuevas siguen contando: 5, 6, 7...
  // Dejar el campo VACÍO elimina el ajuste y vuelve al automático puro.
  function bindVentasAdj(id,colName,prop){
    var el=document.getElementById(id);
    var auto=function(){ return prop==='resi'?(ventasAuto.totalResi||0):(ventasAuto.totalLin||0); };
    el.addEventListener('focus',function(){ ensureSheet(); this.select(); });
    el.addEventListener('input',function(){
      if(this.value==='')ventasOff[prop]=0;
      else ventasOff[prop]=Math.max(0,parseInt(this.value,10)||0)-auto();
      updateKpis();
    });
    el.addEventListener('blur',function(){
      var raw=this.value.trim();
      var off=raw===''?0:(Math.max(0,parseInt(raw,10)||0)-auto());
      ventasOff[prop]=off;
      updateKpis();
      saveCell('GLOBAL','RESUMEN',colName,off===0?'':off,this);
    });
    el.addEventListener('keydown',function(e){ if(e.key==='Enter'){ e.preventDefault(); this.blur(); } });
  }
  bindVentasAdj('kpi-ventas','VENTAS_OFF','resi');
  bindVentasAdj('kpi-ventas-lin','VENTAS_OFF_LIN','lin');

  // Si el usuario sale de la página con una celda a medio editar, forzar guardado
  window.addEventListener('pagehide',function(){
    var el=document.activeElement;
    if(el&&(el.classList.contains('lv-cell')||/^kpi-(perdidas|inversion|ventas)/.test(el.id||'')))el.blur();
  });

  /* ── filtros: mes + día ── */
  var mInput=document.getElementById('lv-month'), dInput=document.getElementById('lv-date');
  function syncInputs(){
    mInput.value=sel.getFullYear()+'-'+pad(sel.getMonth()+1);
    dInput.value=ymdInput(sel);
    dInput.min=sel.getFullYear()+'-'+pad(sel.getMonth()+1)+'-01';
    dInput.max=sel.getFullYear()+'-'+pad(sel.getMonth()+1)+'-'+pad(new Date(sel.getFullYear(),sel.getMonth()+1,0).getDate());
  }
  mInput.addEventListener('change',function(){
    var p=this.value.split('-'); if(p.length!==2)return;
    var y=parseInt(p[0],10),m=parseInt(p[1],10)-1;
    var day=Math.min(sel.getDate(),new Date(y,m+1,0).getDate());
    sel=new Date(y,m,day);
    syncInputs(); loadDay();
  });
  dInput.addEventListener('change',function(){
    var p=this.value.split('-'); if(p.length!==3)return;
    sel=new Date(parseInt(p[0],10),parseInt(p[1],10)-1,parseInt(p[2],10));
    syncInputs(); loadDay();
  });

  /* ── init ── */
  (async function init(){
    syncInputs(); updateDayLabel();
    await loadCurrentUser();
    await loadTeams();
    var ok=await loadSheets();
    if(ok===false)return;
    await loadDay();
    // Ventas y puntos se refrescan solos: el KPI ajustado sigue contando
    // las ventas nuevas en vivo (auto + desplazamiento)
    setInterval(function(){
      if(document.activeElement&&document.activeElement.classList.contains('lv-cell'))return; // no interrumpir edición
      loadPuntosDia(); loadVentasDia();
    },90000);
  })();
})();
</script>
</body>
</html>
