<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Promociones activas · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008g">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/residencial/promociones.css?v=20261008e">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/logout-handler.js"></script>
  <script src="/js/core/fetch-interceptor.js"></script>
  <script src="/js/core/user-info.js"></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <!-- ══ Resumen de todas las promociones + acciones de administración ══ -->
  <section class="pa-barra in-glass" aria-label="Resumen de promociones">
    <nav class="pa-indice" id="paIndex" aria-label="Montos de las promociones"></nav>
    <div class="pa-barra-der">
      <span class="pa-fecha"><i class="ph ph-calendar-blank" aria-hidden="true"></i><span><b>Residencial</b> <span id="paHoy"></span></span></span>
      <div class="pa-admin" id="paAdmin" hidden>
        <button class="pa-btn pa-btn-sec" type="button" id="paToggleEdit" aria-pressed="false">
          <i class="ph ph-pencil-simple" aria-hidden="true"></i><span>Editar</span>
        </button>
        <button class="pa-btn pa-btn-pri" type="button" id="paNueva">
          <i class="ph ph-plus" aria-hidden="true"></i><span>Nueva promoción</span>
        </button>
      </div>
    </div>
  </section>

  <!-- ══ Destacada + carrusel (los pinta js/residencial/promociones.js) ══ -->
  <div id="paContenido" aria-live="polite">
    <p class="pa-estado">Cargando promociones…</p>
  </div>

</div>
</div>

<!-- Diálogo crear / editar (sólo admin) -->
<div class="pa-backdrop" id="paDialogo" hidden>
  <form class="pa-dialog" id="paForm" role="dialog" aria-modal="true" aria-labelledby="paDialogoTitulo" novalidate>
    <h2 class="pa-dialog-title" id="paDialogoTitulo">Nueva promoción</h2>

    <label class="pa-field">
      <span>Nombre de la promoción</span>
      <input class="pa-input" id="paTitulo" maxlength="120" placeholder="Ej. Bono por portabilidad" autocomplete="off">
      <span class="pa-error" id="paErrTitulo" hidden></span>
    </label>

    <div class="pa-field">
      <div class="pa-items-head" aria-hidden="true"><span>Concepto</span><span>Monto ($)</span><span></span></div>
      <div id="paItems"></div>
      <span class="pa-error" id="paErrItems" hidden></span>
      <button class="pa-btn pa-btn-ghost pa-self-start" type="button" id="paAddItem">
        <i class="ph ph-plus" aria-hidden="true"></i><span>Agregar otro monto</span>
      </button>
    </div>

    <label class="pa-check">
      <input type="checkbox" id="paDestacada">
      <span>Mostrar como promoción destacada</span>
    </label>

    <span class="pa-error" id="paErrGeneral" hidden></span>

    <div class="pa-dialog-actions">
      <button class="pa-btn pa-btn-sec" type="button" id="paCancelar">Cancelar</button>
      <button class="pa-btn pa-btn-pri" type="submit" id="paGuardar">Publicar promoción</button>
    </div>
  </form>
</div>

<script src="/js/layout/topnav.js?v=20261008c" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261008b" defer></script>
<script src="/js/componentes/llamadas-bloqueo.js" defer></script>
<script src="/js/residencial/promociones.js?v=20261008d" defer></script>
<script src="/js/core/crm-config.js" defer></script>
<script src="/js/core/inactivity-manager.js?v=20260611a" defer></script>
<script src="/js/core/crm-init.js" defer></script>
</body>
</html>
