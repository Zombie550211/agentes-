<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Monitoreo · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/monitoreo.css?v=20261026f">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <section class="pg-barra in-glass" aria-label="Monitoreo">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-monitor" aria-hidden="true"></i></span>
      <div>
        <h1>Monitoreo</h1>
        <p>Supervisor y agentes de cada equipo de Residencial</p>
      </div>
    </div>
  </section>

  <!-- Equipos de residencial con su supervisor y agentes: js/residencial/monitoreo.js -->
  <div id="mo-contenido" aria-live="polite">
    <div class="pg-vacio in-glass">Cargando equipos…</div>
  </div>

</div>
</div>

<!-- Faltas del día con sus notas (js/residencial/monitoreo.js) -->
<dialog class="mo-dialogo" id="mo-dialogo" aria-labelledby="mo-dlg-titulo">
  <form method="dialog" id="mo-form">
    <h2 class="mo-dlg-titulo" id="mo-dlg-titulo">Faltas en sus llamadas</h2>
    <p class="mo-dlg-sub" id="mo-dlg-sub"></p>
    <ul class="mo-dlg-lista" id="mo-dlg-lista" aria-label="Faltas del día"></ul>
    <p class="mo-dlg-vacio" id="mo-dlg-vacio">Sin faltas este día.</p>
    <label class="mo-dlg-campo" for="mo-nota">Notas</label>
    <textarea id="mo-nota" maxlength="500" rows="3" placeholder="¿Por qué la falta?"></textarea>
    <div class="mo-dlg-acciones">
      <button type="button" class="pg-boton" id="mo-cancelar">Cerrar</button>
      <button type="submit" class="pg-boton pg-boton-pri" id="mo-guardar">Guardar falta</button>
    </div>
  </form>
</dialog>

<script src="/js/layout/topnav.js?v=20261026c" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261031b" defer></script>
<script src="/js/residencial/monitoreo.js?v=20261026f" defer></script>
</body>
</html>
