<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de llamadas · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/auditoria.css?v=20261028e">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <section class="pg-barra in-glass" aria-label="Auditoría de llamadas">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-headset" aria-hidden="true"></i></span>
      <div>
        <h1>Auditoría de llamadas</h1>
        <p>Transcripción completa de cada llamada, con las faltas marcadas al momento</p>
      </div>
    </div>
  </section>

  <p class="pg-vacio in-glass" id="au-sin-permiso" hidden>No tienes acceso a la auditoría de llamadas.</p>

  <!-- Todo lo pinta js/residencial/auditoria.js con GET /api/auditoria/llamadas (routers/auditoria.py). -->
  <div class="au-panel" id="au-contenido" hidden>
    <section class="pg-card in-glass au-lista-card" aria-labelledby="au-lista-titulo">
      <div class="pg-card-head au-lista-head">
        <div><h2 id="au-lista-titulo">Llamadas</h2></div>
        <div class="pg-tabs" role="group" aria-label="Periodo">
          <button type="button" class="pg-tab" data-dias="1" aria-pressed="true">Hoy</button>
          <button type="button" class="pg-tab" data-dias="7" aria-pressed="false">7 días</button>
          <button type="button" class="pg-tab" data-dias="30" aria-pressed="false">30 días</button>
        </div>
      </div>
      <ul class="au-lista" id="au-lista" aria-live="polite"><li class="pg-vacio">Cargando…</li></ul>
    </section>

    <section class="pg-card in-glass au-detalle" id="au-detalle" aria-labelledby="au-det-titulo">
      <div class="pg-vacio" id="au-det-vacio">Elige una llamada para ver su transcripción.</div>
      <div id="au-det" hidden>
        <div class="pg-card-head au-det-head">
          <div>
            <h2 id="au-det-titulo"></h2>
            <p class="au-det-sub" id="au-det-sub"></p>
          </div>
          <span class="au-vivo" id="au-det-vivo" hidden><i aria-hidden="true"></i>En curso</span>
        </div>
        <div class="au-quien">
          <div class="au-campo">
            <label for="au-agente">Agente</label>
            <select id="au-agente"></select>
            <span class="au-fuente" id="au-agente-fuente"></span>
          </div>
          <div class="au-campo">
            <label for="au-cliente">Cliente</label>
            <input id="au-cliente" maxlength="200" autocomplete="off">
            <span class="au-fuente" id="au-cliente-fuente"></span>
          </div>
        </div>
        <audio class="au-audio" id="au-audio" controls preload="none" hidden></audio>
        <ol class="au-tx" id="au-tx" aria-label="Transcripción"></ol>
        <div class="au-hall" id="au-hall"></div>
      </div>
    </section>
  </div>

</div>
</div>

<script src="/js/layout/topnav.js?v=20261028a" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261028a" defer></script>
<script src="/js/residencial/auditoria.js?v=20261028b" defer></script>
</body>
</html>
