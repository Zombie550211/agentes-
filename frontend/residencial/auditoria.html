<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Auditoría de llamadas · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261105a">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/residencial/auditoria.css?v=20261112c">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261105a"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <!-- El auditor sigue siendo una app aparte; esta página solo lo muestra dentro del CRM:
       - En vivo y Trasladar audio: el revisor de esta PC (Reintento/auditor/servicio/revisor_web.py, puerto 8777).
       - Llamadas auditadas: el panel de connecting.lat/auditor/ (login propio). -->
  <section class="pg-barra in-glass" aria-label="Auditoría de llamadas">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-headset" aria-hidden="true"></i></span>
      <div>
        <h1>Auditoría de llamadas</h1>
        <p>Transcribe llamadas y marca en rojo lo que el agente no puede decir</p>
      </div>
    </div>
    <div class="pg-acciones">
      <div class="pg-tabs" role="tablist" aria-label="Área">
        <button type="button" class="pg-tab au-tab" role="tab" id="au-t-vivo" data-area="vivo" aria-selected="false" tabindex="-1"><i class="ph ph-phone-call" aria-hidden="true"></i>En vivo</button>
        <button type="button" class="pg-tab au-tab" role="tab" id="au-t-tras" data-area="tras" aria-selected="true"><i class="ph ph-upload-simple" aria-hidden="true"></i>Trasladar audio</button>
        <button type="button" class="pg-tab au-tab" role="tab" id="au-t-panel" data-area="panel" aria-selected="false" tabindex="-1"><i class="ph ph-list-checks" aria-hidden="true"></i>Llamadas auditadas</button>
      </div>
    </div>
  </section>

  <section class="pg-card in-glass au-marco" role="tabpanel" id="au-area" aria-labelledby="au-t-tras">
    <iframe id="au-frame" class="au-frame" title="Auditor de llamadas"
            allow="microphone" referrerpolicy="same-origin"></iframe>
  </section>

</div>
</div>

<script src="/js/layout/topnav.js?v=20261112a" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261106a" defer></script>
<script src="/js/residencial/auditoria.js?v=20261112e" defer></script>
</body>
</html>
