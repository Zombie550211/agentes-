<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Inicio · Residencial</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sin sesión no se ve: el login redirige aquí. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008a">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/paginas/inicio.css?v=20261008s">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <div class="in-grid">

    <section id="in-hero" class="in-a-hero in-glass">
      <div style="display:flex;flex-direction:column;justify-content:space-between;padding:var(--space-1)">
        <div id="in-fecha" style="font-size:11px;color:var(--color-accent-900)"></div>
        <div>
          <div style="display:flex;align-items:center;gap:8px;font-size:26px;font-weight:700"><span id="in-hola">¡Hola!</span></div>
          <div style="font-size:11px;color:var(--color-accent-900);margin-top:4px">Sigue y gestiona el progreso de tu equipo</div>
        </div>
      </div>
    </section>

    <!-- Video promocional (GET /api/promo-video), sin sonido y sin nada encima. Se sube y se
         cambia desde Promociones activas (el cuadro grande); el servidor lo recomprime. -->
    <section id="in-promo" class="in-a-promo in-promo in-glass">
      <video id="in-promo-video" muted loop playsinline preload="metadata" disablepictureinpicture disableremoteplayback tabindex="-1" aria-hidden="true" hidden></video>
      <div id="in-promo-vacio" class="in-promo-vacio">
        <i class="ph ph-film-strip" style="font-size:28px"></i>
        <span id="in-promo-msg">Cargando…</span>
      </div>
      <div id="in-promo-barra" class="in-promo-barra" hidden>
        <label id="in-promo-subir" class="in-promo-btn"><i class="ph ph-upload-simple"></i><span>Subir video</span>
          <input id="in-promo-archivo" type="file" accept="video/mp4,video/quicktime,video/webm,video/x-matroska,video/x-msvideo,.mp4,.m4v,.mov,.webm,.mkv,.avi,.3gp" hidden></label>
        <button type="button" id="in-promo-quitar" class="in-promo-btn" aria-label="Quitar video" hidden><i class="ph ph-trash"></i></button>
      </div>
    </section>

    <section class="in-a-kpi in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:6px">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:600">Ventas mensuales</span>
        <span id="in-kpi-anio" style="display:flex;align-items:center;gap:4px;font-size:10px;background:var(--color-neutral-200);padding:3px 8px;border-radius:var(--radius-md)"></span>
      </div>
      <div style="display:flex;align-items:center;gap:8px"><span id="in-kpi-valor" style="font-size:22px;font-weight:700">—</span><span id="in-kpi-var" class="tag tag-accent" style="font-size:9px;padding:1px 6px" hidden></span></div>
      <div id="in-kpi-ant" style="font-size:9px;color:var(--color-neutral-600);margin-top:-6px"></div>
      <div style="position:relative;margin-top:var(--space-2)">
        <svg id="in-kpi" viewBox="0 0 560 170" style="width:100%;height:auto;display:block;overflow:visible"></svg>
        <div id="in-kpi-tip" style="position:absolute;transform:translate(-50%,-140%);background:var(--color-text);color:var(--color-neutral-100);font-size:9px;padding:3px 8px;border-radius:var(--radius-lg);white-space:nowrap;pointer-events:none"></div>
      </div>
    </section>

    <section class="in-a-asis in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:600">Ventas diarias</span>
        <span style="display:flex;align-items:center;gap:4px;font-size:10px;background:var(--color-neutral-200);padding:3px 8px;border-radius:var(--radius-md)"><i class="ph ph-calendar-blank"></i><span id="in-diario-mes"></span></span>
      </div>
      <div style="display:flex;gap:var(--space-3);font-size:9px;color:var(--color-neutral-600)">
        <span id="in-diario-res"></span>
      </div>
      <div id="in-asist" style="display:flex;gap:var(--space-2);flex:1;min-height:150px"></div>
    </section>

    <section class="in-a-agenda in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="display:flex;justify-content:space-between;align-items:center">
        <span style="font-size:13px;font-weight:600">Agenda</span><a href="/horarios.html" style="font-size:10px;color:var(--color-neutral-700);text-decoration:none">Ver todo</a>
      </div>
      <div style="display:flex;align-items:center;justify-content:space-between;margin-top:var(--space-1)">
        <button type="button" id="in-mes-ant" aria-label="Mes anterior" style="border:0;background:var(--color-neutral-200);width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center"><i class="ph ph-caret-left"></i></button>
        <span id="in-mes" style="font-size:13px"></span>
        <button type="button" id="in-mes-sig" aria-label="Mes siguiente" style="border:0;background:var(--color-neutral-200);width:22px;height:22px;border-radius:50%;cursor:pointer;display:grid;place-items:center"><i class="ph ph-caret-right"></i></button>
      </div>
      <div id="in-cal" style="display:grid;grid-template-columns:repeat(7,1fr);row-gap:2px;text-align:center"></div>
      <div style="height:1px;background:var(--color-neutral-200);margin:var(--space-2) 0"></div>
      <div id="in-dia" style="font-size:11px"></div>
      <div id="in-eventos" class="in-lista-scroll" style="display:flex;flex-direction:column;gap:var(--space-3);margin-top:var(--space-1)"></div>
    </section>

    <section id="in-tareas" class="in-a-tareas in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:var(--space-1)"><span style="font-size:13px;font-weight:600">Casos pendientes <span id="in-casos-total" style="font-weight:400;font-size:10px;color:var(--color-neutral-600)"></span></span><a href="/residencial/semaforo.html" style="font-size:10px;color:var(--color-neutral-700);text-decoration:none">Ver todo</a></div>
      <!-- Casos del Semáforo sin solventar (js/paginas/inicio.js → cargarCasos). -->
      <div id="in-casos" class="in-lista-scroll" style="display:flex;flex-direction:column;gap:var(--space-2)"><div style="font-size:10px;color:var(--color-neutral-600)">Cargando casos…</div></div>
    </section>

    <!-- Semáforo del mes (dashboard/home → semaforo), con el diseño de medidor + barras.
         Medidor: promedio de puntos por team; cortes de color en js/paginas/inicio.js → SEMAFORO. -->
    <section class="in-a-satis in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600">Semáforo del mes</span><a href="/residencial/semaforo.html" style="font-size:10px;color:var(--color-neutral-700);text-decoration:none">Ver completo</a></div>
      <div style="position:relative;width:170px;align-self:center;margin-top:var(--space-2)">
        <svg id="in-gauge" viewBox="0 0 180 100" style="width:100%;display:block;overflow:visible"></svg>
        <div style="position:absolute;left:0;right:0;bottom:-4px;text-align:center">
          <div id="in-gauge-valor" style="font-size:22px;font-weight:700;line-height:1">—</div>
          <div style="font-size:8px;color:var(--color-neutral-700)">Puntos promedio por team</div>
          <div id="in-gauge-sub" style="font-size:6px;color:var(--color-neutral-500)"></div>
        </div>
      </div>
      <div id="in-satis" class="in-lista-scroll" style="display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-3)"></div>
      <div id="in-satis-eje"></div>
    </section>

    <!-- Top productos del mes (dashboard/home → top_productos), con el diseño de dona + leyenda. -->
    <section class="in-a-sit in-glass" style="padding:var(--space-3);display:flex;flex-direction:column;gap:var(--space-2)">
      <div style="display:flex;justify-content:space-between;align-items:center"><span style="font-size:13px;font-weight:600">Top productos</span><span id="in-top-mes" style="font-size:10px;background:var(--color-neutral-200);padding:3px 8px;border-radius:var(--radius-md)"></span></div>
      <div style="position:relative;width:130px;align-self:center;margin:var(--space-3) 0">
        <svg id="in-donut" viewBox="0 0 180 180" style="width:100%;display:block;transform:rotate(-90deg)"></svg>
        <div style="position:absolute;inset:0;display:grid;place-items:center;text-align:center"><div><div id="in-donut-total" style="font-size:20px;font-weight:700;line-height:1">—</div><div style="font-size:7px;color:var(--color-neutral-700);margin-top:2px">Servicios vendidos</div></div></div>
      </div>
      <div style="height:1px;background:var(--color-neutral-200)"></div>
      <div id="in-donut-ley" style="display:flex;flex-direction:column;gap:var(--space-2);margin-top:var(--space-1)"></div>
    </section>
  </div>

</div>
</div>

<script src="/js/layout/topnav.js?v=20261008c" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261008b" defer></script>
<script src="/js/paginas/inicio.js?v=20261008x" defer></script>
</body>
</html>
