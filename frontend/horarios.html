<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios de agentes — CRM</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="/css/base/tokens.css?v=20260921">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/fontawesome/css/all.min.css">
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
  <link rel="stylesheet" href="/css/paginas/horarios.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/sidebar-static.css?v=2">
  <link rel="stylesheet" href="/css/base/form-controls.css?v=20260921">
</head>
<body>
  <script src="/js/core/theme-init.js"></script>
  <script src="/js/layout/sidebar.js" defer></script>
  <script src="/js/layout/sidebar-ui.js" defer></script>
  <script src="/js/layout/sidebar-user.js" defer></script>
<div class="layout">
  <nav class="sidebar" id="app-sidebar"></nav>
  <main class="main-content">
   <div class="hr-page">

    <!-- "Esta semana" vive aquí y no en la barra: al aparecer o desaparecer no mueve nada. -->
    <div class="hr-top">
      <div class="hr-eyebrow" id="hr-eyebrow">Supervisión · Horarios de agentes</div>
      <button class="hr-link" id="hr-today" hidden>Volver a esta semana</button>
    </div>
    <!-- KPIs de la semana; las flechas cambian de semana. -->
    <div class="hr-days-nav">
      <button class="hr-icon-btn hr-days-arrow" id="hr-prev" aria-label="Semana anterior" title="Semana anterior">‹</button>
      <div class="hr-days" id="hr-days" role="tablist" aria-label="Día de la semana"></div>
      <button class="hr-icon-btn hr-days-arrow" id="hr-next" aria-label="Semana siguiente" title="Semana siguiente">›</button>
    </div>

    <!-- Una sola barra: búsqueda, filtro de equipo, estado del envío y acciones. -->
    <div class="hr-toolbar" id="hr-toolbar" hidden>
      <input class="hr-input" id="hr-search" type="search" placeholder="Buscar agente o ID de reloj" aria-label="Buscar agente">
      <select class="hr-input" id="hr-team" hidden aria-label="Filtrar por equipo"></select>
      <div class="hr-status" id="hr-status"></div>
      <div class="hr-spacer"></div>
      <div class="hr-actions" id="hr-actions" hidden>
        <button class="hr-btn hr-btn-ghost" id="hr-copy" title="Copia los horarios de la semana anterior a esta">Copiar semana anterior</button>
        <button class="hr-btn hr-btn-secondary" id="hr-save" disabled>Guardado</button>
        <button class="hr-btn" id="hr-send">Enviar a Cuadratura</button>
      </div>
    </div>

    <div class="hr-dayopts" id="hr-dayopts" hidden>
      <label class="hr-check" id="hr-short-wrap"><input type="checkbox" id="hr-short"> Este día es shortday (4 h: 8–12, 3–7, 5–9)</label>
      <div class="hr-spacer"></div>
      <span class="hr-legend-lunch"><i></i>Hora de comida</span>
      <span id="hr-hint">Clic en una fila para asignar el turno</span>
    </div>

    <div class="hr-scroll">
      <div class="hr-board" id="hr-board">
        <div class="hr-loading">Cargando…</div>
      </div>
    </div>

   </div>
  </main>
</div>

<div class="hr-pop-bg" id="hr-pop-bg" hidden></div>
<div class="hr-pop" id="hr-pop" role="dialog" aria-modal="false" hidden></div>
<div class="hr-toast" id="hr-toast" role="status" aria-live="polite"></div>

<!-- Alta de un empleado que aún no tiene usuario del CRM (lo abre "+ Nuevo empleado"). -->
<div class="hr-modal-bg" id="hr-alta" hidden>
  <form class="hr-modal" id="hr-alta-form" role="dialog" aria-modal="true" aria-labelledby="hr-alta-t" novalidate>
    <div class="hr-modal-head">
      <div class="hr-modal-ic" aria-hidden="true">+</div>
      <div>
        <h2 class="hr-modal-t" id="hr-alta-t">Nuevo empleado</h2>
        <p class="hr-modal-sub">Equipo <b id="hr-alta-team"></b></p>
      </div>
    </div>
    <label class="hr-modal-field">
      <span>Nombre completo</span>
      <input class="hr-input" id="hr-alta-nombre" maxlength="160" autocomplete="off" placeholder="Nombres y apellidos">
    </label>
    <p class="hr-modal-note">Aún no tendrá usuario del CRM: aparece en su equipo para asignarle el horario. Cuando le toque entrar, administración le da acceso desde Permisos.</p>
    <p class="hr-modal-err" id="hr-alta-err" hidden></p>
    <div class="hr-modal-acc">
      <button type="button" class="hr-btn hr-btn-ghost" id="hr-alta-cancel">Cancelar</button>
      <button type="submit" class="hr-btn" id="hr-alta-ok">Agregar empleado</button>
    </div>
  </form>
</div>

<script src="/js/paginas/horarios.js?v=20261008b" defer></script>
</body>
</html>
