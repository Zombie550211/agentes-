<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Horarios de agentes · Administración</title>
  <link rel="icon" type="image/png" href="/images/favicon.png">
  <!-- Sesión: la cabecera (menú e iconos) la reutiliza; sin sesión, al login. -->
  <script>
    window.__sesion = fetch('/api/auth/verify-server', { credentials: 'include' })
      .then(function (r) { return r.ok ? r.json() : { authenticated: false }; })
      .then(function (d) { if (!d.authenticated) { location.replace('/login.html'); } return d; })
      .catch(function () { location.replace('/login.html'); return {}; });
  </script>
  <link rel="stylesheet" href="/css/base/scroll.css?v=20261008a">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;0,8..60,700;1,8..60,400&family=Inter:wght@500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="/vendor/phosphor/phosphor-inicio.css?v=20261008h">
  <link rel="stylesheet" href="/css/base/sistema.css?v=20261008b">
  <link rel="stylesheet" href="/css/componentes/transicion.css?v=20261008a">
  <link rel="stylesheet" href="/css/componentes/pagina.css?v=20261009a">
  <link rel="stylesheet" href="/css/paginas/horarios.css?v=20261009d">
  <!-- Transición entre páginas: en el <head> y sin defer, para que no parpadee. -->
  <script src="/js/layout/transicion.js?v=20261008b"></script>
  <script src="/js/core/fetch-interceptor.js" defer></script>
  <script src="/js/core/logout-handler.js" defer></script>
  <script src="/js/core/user-info.js" defer></script>
</head>
<body>
<div class="in-marco">
<div class="in-hoja">

  <header class="in-head">
    <nav id="topnav" class="tn" aria-label="Menú principal"></nav>
    <!-- Ajustes, chat, notificaciones y usuario: js/layout/topbar-acciones.js -->
    <div id="topbar-acciones" class="in-iconos"></div>
  </header>

  <section class="pg-barra in-glass" aria-label="Horarios">
    <div class="pg-titulo">
      <span class="pg-ico"><i class="ph ph-calendar-check" aria-hidden="true"></i></span>
      <div>
        <h1>Horarios de agentes</h1>
        <p id="hr-eyebrow">Supervisión · Horarios de agentes</p>
      </div>
    </div>
    <!-- "Volver a esta semana" vive aquí y no en la barra de días: al aparecer no mueve nada. -->
    <div class="pg-acciones"><button type="button" class="pg-boton" id="hr-today" hidden>Volver a esta semana</button></div>
  </section>

  <div class="hr-page">

    <!-- KPIs de la semana; las flechas cambian de semana. -->
    <div class="hr-days-nav">
      <button class="hr-icon-btn hr-days-arrow" id="hr-prev" aria-label="Semana anterior" title="Semana anterior">‹</button>
      <div class="hr-days" id="hr-days" role="tablist" aria-label="Día de la semana"></div>
      <button class="hr-icon-btn hr-days-arrow" id="hr-next" aria-label="Semana siguiente" title="Semana siguiente">›</button>
    </div>

    <!-- Una sola barra: búsqueda, filtro de equipo, estado del envío y acciones. -->
    <div class="hr-toolbar" id="hr-toolbar" hidden>
      <input class="hr-input" id="hr-search" type="search" placeholder="Buscar agente o ID de reloj" aria-label="Buscar agente">
      <select class="hr-input" id="hr-team" hidden aria-label="Filtrar por equipo"></select>
      <div class="hr-status" id="hr-status"></div>
      <div class="hr-spacer"></div>
      <div class="hr-actions" id="hr-actions" hidden>
        <button class="hr-btn hr-btn-ghost" id="hr-copy" title="Copia los horarios de la semana anterior a esta">Copiar semana anterior</button>
        <button class="hr-btn hr-btn-secondary" id="hr-save" disabled>Guardado</button>
        <button class="hr-btn" id="hr-send">Enviar a Cuadratura</button>
      </div>
    </div>

    <div class="hr-dayopts" id="hr-dayopts" hidden>
      <label class="hr-check" id="hr-short-wrap"><input type="checkbox" id="hr-short"> Este día es shortday (4 h: 8–12, 3–7, 5–9)</label>
      <div class="hr-spacer"></div>
      <span class="hr-legend-lunch"><i></i>Hora de comida</span>
      <span id="hr-hint">Clic en una fila para asignar el turno</span>
    </div>

    <div class="hr-scroll">
      <div class="hr-board" id="hr-board">
        <div class="hr-loading">Cargando…</div>
      </div>
    </div>

  </div>

</div>
</div>

<div class="hr-pop-bg" id="hr-pop-bg" hidden></div>
<div class="hr-pop" id="hr-pop" role="dialog" aria-modal="false" hidden></div>
<div class="hr-toast" id="hr-toast" role="status" aria-live="polite"></div>

<script src="/js/layout/topnav.js?v=20261008c" defer></script>
<script src="/js/layout/topbar-acciones.js?v=20261009a" defer></script>
<script src="/js/paginas/horarios.js?v=20261009e" defer></script>
</body>
</html>
