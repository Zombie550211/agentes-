# Despliegue automático a producción (EC2) en cada push a main.
#
# Sin SSH y sin claves de AWS guardadas en GitHub:
#   1. Comprueba que el Python compila y que el JS no tiene errores de sintaxis.
#   2. Se identifica ante AWS por OIDC: el rol solo acepta ejecuciones de la rama
#      main de este repositorio.
#   3. Empaqueta los archivos que cambiaron desde el último despliegue (el commit
#      desplegado se guarda en S3) y los sube al bucket de despliegues.
#   4. Por SSM ordena al EC2 ejecutar CRM_PYTHON/scripts/deploy/aplicar_release.sh,
#      que comprueba los hashes, aplica, reinicia y verifica; si falla, revierte.
#   5. Solo si todo fue bien registra el commit como desplegado.
#
# Configuración (Settings → Secrets and variables → Actions → Variables):
#   AWS_ROLE_ARN, DEPLOY_BUCKET, EC2_INSTANCE_ID
name: Desplegar a producción

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  id-token: write   # para el token OIDC que se cambia por credenciales de AWS

# Un despliegue cada vez y en orden: si llegan dos pushes seguidos, el segundo espera.
concurrency:
  group: produccion
  cancel-in-progress: false

jobs:
  desplegar:
    runs-on: ubuntu-24.04   # Python 3.12, el mismo que el EC2
    timeout-minutes: 20
    env:
      AWS_REGION: us-east-2
      BUCKET: ${{ vars.DEPLOY_BUCKET }}
      INSTANCIA: ${{ vars.EC2_INSTANCE_ID }}
      SHA: ${{ github.sha }}
      URL_PUBLICA: https://connecting.lat
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0              # hace falta la historia para el diff contra lo desplegado
          persist-credentials: false

      - name: Comprobar el código
        run: |
          set -euo pipefail
          # Sintaxis de Python 3.12 (la del EC2) en todo el backend versionado.
          git ls-files -z 'CRM_PYTHON/*.py' | xargs -0 python3 -m py_compile
          # Sintaxis de JS, sin las librerías de /vendor/.
          fallos=0
          while IFS= read -r -d '' f; do
            node --check "$f" || { echo "::error file=$f::error de sintaxis"; fallos=1; }
          done < <(git ls-files -z 'frontend/*.js' ':(exclude)frontend/vendor/**')
          bash -n CRM_PYTHON/scripts/deploy/aplicar_release.sh
          exit $fallos

      - name: Credenciales de AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          role-session-name: gha-desplegar-${{ github.run_id }}
          aws-region: us-east-2

      - name: Preparar la release
        id: release
        run: |
          set -euo pipefail
          PREV="$(aws s3 cp "s3://${BUCKET}/estado/desplegado" - 2>/dev/null | tr -d '[:space:]' || true)"
          if [ -z "$PREV" ]; then
            echo "::error::No existe s3://${BUCKET}/estado/desplegado: no se sabe qué hay en producción."
            exit 1
          fi
          if ! git cat-file -e "${PREV}^{commit}" 2>/dev/null; then
            echo "::error::El commit desplegado (${PREV}) no está en este repositorio."
            exit 1
          fi
          if ! git merge-base --is-ancestor "$PREV" "$SHA"; then
            echo "::error::Producción (${PREV:0:7}) tiene cambios que no están en main. No se despliega para no pisarlos."
            exit 1
          fi

          mkdir -p rel
          # --no-renames: un renombrado se trata como borrado + alta, así el nombre viejo
          # también desaparece del servidor. .github/ no se despliega.
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=d "$PREV" "$SHA" -- . ':(exclude).github/**' > rel/cambiados.txt
          git -c core.quotePath=false diff --name-only --no-renames --diff-filter=D "$PREV" "$SHA" -- . ':(exclude).github/**' > rel/borrados.txt

          {
            echo "### Despliegue ${PREV:0:7} → ${SHA:0:7}"
            echo "- archivos a copiar: $(wc -l < rel/cambiados.txt)"
            echo "- archivos a borrar: $(wc -l < rel/borrados.txt)"
          } >> "$GITHUB_STEP_SUMMARY"

          if [ ! -s rel/cambiados.txt ] && [ ! -s rel/borrados.txt ]; then
            echo "Nada que desplegar entre ${PREV:0:7} y ${SHA:0:7}."
            echo "vacio=1" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          if [ -s rel/cambiados.txt ]; then
            tar czf rel/release.tgz --verbatim-files-from -T rel/cambiados.txt
          else
            tar czf rel/release.tgz -T /dev/null
          fi
          cp CRM_PYTHON/scripts/deploy/aplicar_release.sh rel/

          {
            echo "h_release=$(sha256sum rel/release.tgz | cut -d' ' -f1)"
            echo "h_borrados=$(sha256sum rel/borrados.txt | cut -d' ' -f1)"
            echo "h_cambiados=$(sha256sum rel/cambiados.txt | cut -d' ' -f1)"
            echo "h_script=$(sha256sum rel/aplicar_release.sh | cut -d' ' -f1)"
          } >> "$GITHUB_OUTPUT"

          aws s3 cp rel/ "s3://${BUCKET}/releases/${SHA}/" --recursive --only-show-errors

      - name: Aplicar en el EC2 (SSM)
        if: steps.release.outputs.vacio != '1'
        env:
          H_RELEASE: ${{ steps.release.outputs.h_release }}
          H_BORRADOS: ${{ steps.release.outputs.h_borrados }}
          H_CAMBIADOS: ${{ steps.release.outputs.h_cambiados }}
          H_SCRIPT: ${{ steps.release.outputs.h_script }}
        run: |
          set -euo pipefail
          ORIGEN="s3://${BUCKET}/releases/${SHA}"
          # El script se descarga y se comprueba su hash en el EC2 antes de ejecutarlo;
          # los hashes viajan por SSM, no por S3.
          PARAMS="$(jq -n \
            --arg o "$ORIGEN" --arg s "$SHA" --arg hs "$H_SCRIPT" \
            --arg hr "$H_RELEASE" --arg hb "$H_BORRADOS" --arg hc "$H_CAMBIADOS" '{
              commands: [
                "export PATH=\"$PATH:/snap/bin\"",
                "D=$(mktemp -d)",
                ("aws s3 cp " + $o + "/aplicar_release.sh \"$D/aplicar_release.sh\" --only-show-errors || exit 1"),
                ("echo \"" + $hs + "  $D/aplicar_release.sh\" | sha256sum -c --quiet - || { echo \"hash del script no coincide\"; exit 1; }"),
                ("bash \"$D/aplicar_release.sh\" " + $o + " " + $s + " " + $hr + " " + $hb + " " + $hc + "; rc=$?; rm -rf \"$D\"; exit $rc")
              ],
              executionTimeout: ["900"]
            }')"

          CMD="$(aws ssm send-command \
            --instance-ids "$INSTANCIA" \
            --document-name AWS-RunShellScript \
            --comment "desplegar ${SHA:0:7}" \
            --parameters "$PARAMS" \
            --query Command.CommandId --output text)"
          echo "Orden SSM: $CMD"

          ESTADO=Pending
          for _ in $(seq 1 180); do
            sleep 5
            ESTADO="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCIA" \
                        --query Status --output text 2>/dev/null || echo Pending)"
            case "$ESTADO" in Pending|InProgress|Delayed) continue ;; *) break ;; esac
          done

          echo "----- salida del EC2 -----"
          aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCIA" \
            --query StandardOutputContent --output text || true
          ERR="$(aws ssm get-command-invocation --command-id "$CMD" --instance-id "$INSTANCIA" \
                   --query StandardErrorContent --output text 2>/dev/null || true)"
          if [ -n "$ERR" ] && [ "$ERR" != "None" ]; then echo "----- stderr -----"; echo "$ERR"; fi

          if [ "$ESTADO" != "Success" ]; then
            echo "::error::El despliegue falló en el EC2 (estado: ${ESTADO}). Si llegó a aplicarse, el servidor volvió solo a la versión anterior."
            exit 1
          fi

      - name: Registrar el commit desplegado
        run: echo "$SHA" | aws s3 cp - "s3://${BUCKET}/estado/desplegado" --only-show-errors

      - name: Comprobar desde fuera
        if: steps.release.outputs.vacio != '1'
        run: |
          set -euo pipefail
          codigo=000
          for _ in $(seq 1 10); do
            codigo="$(curl -s -o /dev/null -w '%{http_code}' --max-time 10 "${URL_PUBLICA}/login.html" || true)"
            [ "$codigo" = 200 ] && break
            sleep 3
          done
          [ "$codigo" = 200 ] || { echo "::error::${URL_PUBLICA}/login.html responde ${codigo}"; exit 1; }
          # Hasta 5 archivos del frontend desplegados: lo servido tiene que ser idéntico al repo.
          # (mapfile y no una tubería: sin archivos del frontend, grep devuelve 1 y con
          # pipefail el paso quedaría en rojo aunque el despliegue fuera bien)
          mapfile -t FRONT < <(grep '^frontend/' rel/cambiados.txt | head -5 || true)
          for f in "${FRONT[@]}"; do
            ruta="$(python3 -c 'import sys,urllib.parse; print(urllib.parse.quote(sys.argv[1][len("frontend/"):]))' "$f")"
            remoto="$(curl -s --max-time 15 "${URL_PUBLICA}/${ruta}?v=${SHA:0:7}" | sha256sum | cut -d' ' -f1)"
            local_="$(sha256sum < "$f" | cut -d' ' -f1)"
            if [ "$remoto" = "$local_" ]; then echo "ok  $f"; else echo "::error file=$f::producción no sirve la versión nueva"; exit 1; fi
          done
          echo "Producción responde y sirve la versión ${SHA:0:7}." >> "$GITHUB_STEP_SUMMARY"
